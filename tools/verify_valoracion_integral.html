<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>verify_valoracion_integral</title>
<!--
  Pruebas de Valoración integral (js/views/calc-valoracion-integral.js) y de su lógica (js/calc/valoracion-integral.js).
  Se ejecuta en el navegador, sin internet: la vista real se renderiza en un contenedor oculto y se maneja como lo haría una
  persona. Pérdidas, regulación y cortocircuito se comparan con cálculos escritos aquí de forma independiente (pérdidas con la
  potencia física 3·I²·R·L); la ampacidad, con los motores de Ampacidad aérea y subterránea (ya probados en sus arneses),
  para comprobar que la combinación les pasa los datos correctos.

  Uso (desde la raíz del proyecto):
    python -m http.server 8000
    abrir http://localhost:8000/tools/verify_valoracion_integral.html   -> lista PASS/FAIL
  o en modo consola:
    msedge --headless --dump-dom --virtual-time-budget=15000 http://localhost:8000/tools/verify_valoracion_integral.html
-->
<style>body{font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:12px}#stage{position:absolute;left:-9999px;width:1000px}</style>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<pre id="out"></pre>
<div id="stage"></div>
<script type="module">
window.__BASE_PATH__ = "../";
const out = document.getElementById("out");
let fallos = 0;
let total = 0;
function ok(cond, msg) {
  total++;
  if (!cond) fallos++;
  out.textContent += `${cond ? "PASS" : "FAIL"} ${msg}\n`;
}
function cerca(a, b, tol, msg) {
  ok(Math.abs(a - b) <= tol * Math.max(1, Math.abs(b)), `${msg} (obtenido ${a}, esperado ${b})`);
}
async function seccion(nombre, fn) {
  out.textContent += `\n== ${nombre}\n`;
  try {
    await fn();
  } catch (err) {
    fallos++;
    total++;
    out.textContent += `FAIL excepcion en "${nombre}": ${err && err.stack ? err.stack : err}\n`;
  }
}
const espera = (ms) => new Promise((r) => setTimeout(r, ms));

const V = await import("../js/calc/valoracion-integral.js");
const { calcularAmpacidadAerea } = await import("../js/calc/ampacidad-aerea.js");
const { calcularAmpacidadSubterranea } = await import("../js/calc/ampacidad-subterranea.js");
const { calcularOpcion } = await import("../js/calc/conductor-economico.js");
const { guardarEstado } = await import("../js/util/persistencia-calculo.js");
const D = await import("../js/util/valores-defecto.js");
const cat = {
  desnudos: await (await fetch("../data/conductores-desnudos.json")).json(),
  xlpe: await (await fetch("../data/conductores-xlpe.json")).json(),
  cables: await (await fetch("../data/construccion-cable-subterraneo.json")).json(),
};
const ALLIANCE = cat.desnudos.find((c) => c.tipo === "AAAC" && c.calibre_awg_kcmil === "246.9");
const HAWK = cat.desnudos.find((c) => c.tipo === "ACSR" && c.calibre_awg_kcmil === "477" && c.nombre_clave.startsWith("Hawk"));

const AEREA = { taC: 25, tcC: 75, vwMs: 0.61, anguloVientoDeg: 90, elevacionM: 0, epsilon: 0.5, alfa: 0.5, qseWm2: 1000, thetaDeg: 90 };
const SUBT = { tempMaxC: 90, tempTerrenoC: 25, rhoSueloKmW: 1, uDuctoKmW: 0.3, profundidadBancoM: 1, frecuenciaHz: 60 };
const COMUN = { potenciaActivaMw: 30, factorPotencia: 0.9, factorCarga: 0.4, longitudKm: 5, aerea: AEREA, subterranea: SUBT, tempFallaC: 250, economia: null };
const ECON = { anios: 25, tasaDescuentoPct: 10, precioKwh: 350, escaladaEnergiaPct: 2.5, crecimientoDemandaPct: 0 };

// ---------- cálculos independientes ----------
const corriente = (P, V, fp) => (P * 1e6) / (Math.sqrt(3) * V * 1e3 * fp);
function perdidasPct(c, V, R, n) {
  const I = corriente(c.potenciaActivaMw, V, c.factorPotencia);
  const Fp = 0.3 * c.factorCarga + 0.7 * c.factorCarga ** 2;
  const kw = (3 * I * I * (R / n) * c.longitudKm * Fp) / 1000;
  return (kw / (c.potenciaActivaMw * 1000)) * 100;
}
function caidaPct(c, V, Ref, rmgMm, dmgM) {
  const I = corriente(c.potenciaActivaMw, V, c.factorPotencia);
  const phi = Math.acos(c.factorPotencia);
  const Xl = 0.0754 * Math.log(dmgM / (rmgMm / 1000));
  const Z = Ref * Math.cos(phi) + Xl * Math.sin(phi);
  return { pct: (Math.sqrt(3) * I * Z * c.longitudKm * 100) / (V * 1000), Xl, Z };
}
const K = { Cobre: [341, 234], Aluminio: [224, 228] };
function ccKa(material, A, T1, T2, t) {
  const [k1, lam] = K[material];
  return (A * k1 * Math.sqrt(Math.log10((T2 + lam) / (T1 + lam)) / t)) / 1000;
}

// Un escenario = tensión + falla + tramos. Los extras de escAereo/escSubt se reparten: falla y tiempo al escenario, lo demás al tramo.
const CLAVES_ESC = ["corrienteFallaKa", "tiempoDespejeS"];
const partir = (extra) => [Object.fromEntries(Object.entries(extra).filter(([k]) => CLAVES_ESC.includes(k))), Object.fromEntries(Object.entries(extra).filter(([k]) => !CLAVES_ESC.includes(k)))];
const escenario = (tensionKv, tramos, extra = {}) => ({ tensionKv, corrienteFallaKa: null, tiempoDespejeS: 0.3, tramos, ...extra });
function tramoAereo(fila, n, extra = {}) {
  const conductor = V.datosConductor({ red: "Aerea", material: fila.tipo, calibre: fila.calibre_awg_kcmil, referencia: fila.nombre_clave }, cat);
  return { red: "Aerea", n, longitudKm: 5, conductor, dabM: 2, dacM: 2.84, dbcM: 0.84, separacionHazM: n > 1 ? 0.4 : 0, costos: null, ...extra };
}
function tramoSubt(material, calibre, tensionKv, n, extra = {}) {
  const conductor = V.datosConductor({ red: "Subterranea", material, calibre, tipoPantalla: "Hilos", nivelAislamientoPct: 100, tensionKv }, cat);
  return { red: "Subterranea", n, longitudKm: 5, conductor, puestaTierra: "Unipuntual", separacionFasesM: 0.04, separacionDuctosM: 0.2, otrosCircuitos: 0, costos: null, ...extra };
}
function escAereo(fila, tensionKv, n, extra = {}) {
  const [e, tr] = partir(extra);
  return escenario(tensionKv, [tramoAereo(fila, n, tr)], e);
}
function escSubt(material, calibre, tensionKv, n, extra = {}) {
  const [e, tr] = partir(extra);
  return escenario(tensionKv, [tramoSubt(material, calibre, tensionKv, n, tr)], e);
}

await seccion("catálogos: datos del conductor", async () => {
  const a = V.datosConductor({ red: "Aerea", material: "AAAC", calibre: "246.9", referencia: "Alliance (7)" }, cat);
  ok(a.ok && a.resistenciaOhmKm === ALLIANCE.r_ac_75c_ohm_km && a.diametroMm === ALLIANCE.diametro_cable_mm && a.areaMm2 === ALLIANCE.area_seccion_aluminio_mm2 && a.materialCc === "Aluminio", "aéreo: R75, diámetro y área de aluminio del catálogo; cortocircuito como aluminio");
  ok(!V.datosConductor({ red: "Aerea", material: "AAAC", calibre: "246.9", referencia: "" }, cat).ok, "aéreo sin referencia: error");
  ok(V.nivelAislamientoPara(13.2) === 15 && V.nivelAislamientoPara(34.5) === 35 && V.nivelAislamientoPara(44) === 46 && V.nivelAislamientoPara(69) === null, "nivel de aislamiento según la tensión: 13.2→15, 34.5→35, 44→46, 69→ninguno");
  const s = V.datosConductor({ red: "Subterranea", material: "Cobre", calibre: "500 kcmil", tipoPantalla: "Hilos", nivelAislamientoPct: 100, tensionKv: 34.5 }, cat);
  const x = cat.xlpe.find((r) => r.material_conductor === "Cobre" && r.calibre_awg_kcmil === "500" && r.nivel_tension_kv === "35 kV" && r.pantalla === "Hilos de cobre");
  ok(s.ok && s.cable.nivel_aislamiento_kv === 35 && s.cable.calibre_awg_kcmil === "500 kcmil" && s.nivelAislamientoKv === 35, "subterráneo: cable de construcción de 35 kV");
  ok(x && s.resistenciaOhmKm === x.r_ac_75c_ohm_km && s.rmgMm === x.radio_medio_geometrico_mm && s.areaMm2 === x.area_conductor_mm2, "subterráneo: R75, RMG y área del catálogo XLPE (35 kV, hilos)");
  const e = V.datosConductor({ red: "Subterranea", material: "Cobre", calibre: "500 kcmil", tipoPantalla: "Hilos", nivelAislamientoPct: 100, tensionKv: 69 }, cat);
  ok(!e.ok && /46 kV/.test(e.error), "subterráneo a 69 kV: error que dice hasta dónde llega el catálogo");
  const e2 = V.datosConductor({ red: "Subterranea", material: "Cobre", calibre: "500 kcmil", tipoPantalla: "Cinta", nivelAislamientoPct: 133, tensionKv: 44 }, cat);
  ok(!e2.ok, "combinación inexistente (46 kV al 133 %): error");
  ok(V.MIN_ESCENARIOS === 1 && V.MAX_ESCENARIOS === 6 && V.MAX_TRAMOS === 4, "de 1 a 6 escenarios, hasta 4 tramos cada uno");
});

await seccion("motor: escenario aéreo de un conductor (AAAC 246.9 a 34.5 kV)", async () => {
  const e = escAereo(ALLIANCE, 34.5, 1, { corrienteFallaKa: 5 });
  const r = V.evaluarEscenario(COMUN, e);
  cerca(r.corrienteA, corriente(30, 34.5, 0.9), 1e-9, "corriente de operación");
  cerca(r.perdidas.pct, perdidasPct(COMUN, 34.5, ALLIANCE.r_ac_75c_ohm_km, 1), 1e-9, "% de pérdidas = 3·I²·R·L·Fp / P");
  cerca(r.perdidas.kw, (r.perdidas.pct / 100) * 30000, 1e-9, "pérdidas en kW");
  cerca(r.perdidas.energiaMwhAnio, (r.perdidas.kw / 1000) * 8760, 1e-9, "energía anual en MWh");
  const reg = caidaPct(COMUN, 34.5, ALLIANCE.r_ac_75c_ohm_km, ALLIANCE.radio_medio_geometrico_mm, Math.cbrt(2 * 2.84 * 0.84));
  cerca(r.regulacion.pct, reg.pct, 1e-9, "% de caída de tensión");
  cerca(r.tramos[0].regulacion.reactanciaOhmKm, reg.Xl, 1e-9, "reactancia inductiva");
  const amp = calcularAmpacidadAerea({ diametroMm: ALLIANCE.diametro_cable_mm, rBajoOhmKm: ALLIANCE.r_ac_25c_ohm_km, rAltoOhmKm: ALLIANCE.r_ac_75c_ohm_km, ...AEREA }).ampacidad;
  cerca(r.ampacidad.porConductorA, amp, 1e-12, "ampacidad = motor IEEE 738 con R25/R75 y diámetro del catálogo");
  cerca(r.ampacidad.usoPct, (r.corrienteA / amp) * 100, 1e-9, "% de uso de la ampacidad");
  ok(r.ampacidad.cumple === r.corrienteA <= amp, "cumple ampacidad si la corriente no la supera");
  const cc = ccKa("Aluminio", ALLIANCE.area_seccion_aluminio_mm2, 75, 250, 0.3);
  cerca(r.cortocircuito.totalKa, cc, 1e-9, "capacidad de cortocircuito (aluminio, desde 75 °C a 250 °C en 0.3 s)");
  ok(r.cortocircuito.cumple === cc >= 5, `con falla de 5 kA: ${r.cortocircuito.cumple ? "la soporta" : "no la soporta"}`);
  cerca(ccKa("Aluminio", r.cortocircuito.areaMinimaMm2, 75, 250, 0.3), 5, 1e-9, "el área mínima soporta justo los 5 kA");
  ok(r.perdidas.clase.etiqueta && r.regulacion.clase.etiqueta, `clasificación: pérdidas ${r.perdidas.clase.etiqueta}, regulación ${r.regulacion.clase.etiqueta}`);
  ok(r.economia === null, "sin precio de la energía no hay costos");
  const sinFalla = V.evaluarEscenario(COMUN, escAereo(ALLIANCE, 34.5, 1));
  ok(sinFalla.cortocircuito.cumple === null && sinFalla.cortocircuito.areaMinimaMm2 === null && !sinFalla.incumple.includes("cortocircuito"), "sin corriente de falla: solo se informa la capacidad y no cuenta como incumplimiento");
});

await seccion("motor: haz de 2 conductores por fase (13.2 kV)", async () => {
  const r = V.evaluarEscenario(COMUN, escAereo(HAWK, 13.2, 2, { corrienteFallaKa: 20 }));
  cerca(r.perdidas.pct, perdidasPct(COMUN, 13.2, HAWK.r_ac_75c_ohm_km, 2), 1e-9, "pérdidas con R/2");
  const rmgHaz = Math.sqrt(HAWK.radio_medio_geometrico_mm * 400); // √(RMG·d), d en mm
  cerca(r.tramos[0].regulacion.rmgEfectivoMm, rmgHaz, 1e-9, "RMG del haz = √(RMG·d)");
  cerca(r.regulacion.pct, caidaPct(COMUN, 13.2, HAWK.r_ac_75c_ohm_km / 2, rmgHaz, Math.cbrt(2 * 2.84 * 0.84)).pct, 1e-9, "caída de tensión con el haz");
  const amp = calcularAmpacidadAerea({ diametroMm: HAWK.diametro_cable_mm, rBajoOhmKm: HAWK.r_ac_25c_ohm_km, rAltoOhmKm: HAWK.r_ac_75c_ohm_km, ...AEREA }).ampacidad;
  cerca(r.ampacidad.totalA, 2 * amp, 1e-12, "ampacidad de la fase = 2 × la de un conductor");
  cerca(r.cortocircuito.totalKa, 2 * ccKa("Aluminio", HAWK.area_seccion_aluminio_mm2, 75, 250, 0.3), 1e-9, "capacidad de cortocircuito = 2 × la de un conductor");
  cerca(ccKa("Aluminio", r.cortocircuito.areaMinimaMm2, 75, 250, 0.3), 10, 1e-9, "área mínima POR conductor: soporta la mitad de la falla");
});

await seccion("motor: subterráneo con 2 circuitos en paralelo", async () => {
  const e = escSubt("Cobre", "500 kcmil", 34.5, 2, { otrosCircuitos: 1, corrienteFallaKa: 25 });
  const r = V.evaluarEscenario(COMUN, e);
  const c = e.tramos[0].conductor;
  const ampMotor = calcularAmpacidadSubterranea({
    tipoCable: "Monopolar", cable: c.cable, tipoPantalla: "Hilos", nivelAislamientoKv: 35, puestaTierra: "Unipuntual", tensionSistemaKv: 34.5, frecuenciaHz: 60,
    tempMaxC: 90, tempTerrenoC: 25, rhoSueloKmW: 1, uDuctoKmW: 0.3, separacionFasesM: 0.04, numCircuitos: 3, profundidadBancoM: 1, separacionDuctosM: 0.2,
  }).ampacidad;
  cerca(r.ampacidad.porConductorA, ampMotor, 1e-12, "ampacidad de un circuito con 3 circuitos en el banco (2 propios + 1 ajeno)");
  ok(r.ampacidad.circuitosBanco === 3, "circuitos en el banco = 3");
  cerca(r.ampacidad.totalA, 2 * ampMotor, 1e-12, "ampacidad de la fase = 2 circuitos");
  cerca(r.perdidas.pct, perdidasPct(COMUN, 34.5, c.resistenciaOhmKm, 2), 1e-9, "pérdidas con R/2");
  const uno = caidaPct(COMUN, 34.5, c.resistenciaOhmKm, c.rmgMm, 0.04);
  cerca(r.regulacion.pct, uno.pct / 2, 1e-9, "caída = la de un circuito en trébol (D = separación entre fases) / 2");
  cerca(r.cortocircuito.totalKa, 2 * ccKa("Cobre", c.areaMm2, 90, 250, 0.3), 1e-9, "cortocircuito: cobre, desde 90 °C, 2 conductores");
  const alto = V.evaluarEscenario({ ...COMUN, subterranea: { ...SUBT, tempTerrenoC: 95 } }, escSubt("Cobre", "500 kcmil", 34.5, 1));
  ok(alto.ampacidad.error && !alto.ampacidad.cumple && alto.incumple.includes("ampacidad (no calculable)"), "terreno más caliente que el conductor: la ampacidad no se puede calcular y el escenario no cumple");
});

await seccion("motor: comparación, costos y recomendado", async () => {
  const comun = { ...COMUN, economia: ECON };
  const costos = (c, i = null) => ({ costoConductorKm: c, costoInstalacionKm: i ?? 0, instalacionIndicada: i !== null });
  const e1 = escAereo(ALLIANCE, 34.5, 1, { costos: costos(8e6, 50e6) });
  const e2 = escAereo(HAWK, 13.2, 2, { costos: costos(14e6, 60e6) });
  const e3 = escAereo(cat.desnudos.find((c) => c.tipo === "ACSR" && c.calibre_awg_kcmil === "4/0"), 13.2, 1, { costos: costos(1e6) }); // barato pero se sobrecarga
  const r = V.compararEscenarios(comun, [e1, e2, e3]);
  ok(r.escenarios.length === 3 && r.costosCompletos, "3 escenarios, todos con costos");
  const esperado = calcularOpcion({ tensionLineaKv: 13.2, potenciaActivaMw: 30, factorPotencia: 0.9, factorCarga: 0.4, longitudKm: 5, ...ECON }, { resistenciaOhmKm: HAWK.r_ac_75c_ohm_km, numConductoresPorFase: 2, costoConductorKm: 14e6, costoInstalacionKm: 60e6 });
  cerca(r.escenarios[1].economia.costoTotal, esperado.costoTotal, 1e-12, "el costo usa el motor de Conductor económico con la tensión DEL escenario");
  cerca(r.escenarios[1].economia.inversion, 5 * (3 * 2 * 14e6 + 60e6), 1e-12, "inversión = L·(3·N·c_cond + c_inst)");
  ok(!r.escenarios[2].cumpleTodo && r.escenarios[2].incumple.includes("ampacidad"), `el 4/0 a 13.2 kV no cumple (${r.escenarios[2].incumple.join(", ")})`);
  const totales = r.escenarios.map((x) => x.economia.costoTotal);
  const menor = totales.indexOf(Math.min(...totales));
  ok(r.mejorCosto === menor, `menor costo total: Escenario ${menor + 1}`);
  const candidatos = r.cumplen.filter(() => true);
  const recomendadoEsperado = candidatos.length ? candidatos.reduce((m, i) => (totales[i] < totales[m] ? i : m), candidatos[0]) : null;
  ok(r.recomendado === recomendadoEsperado && (r.recomendado === null || r.escenarios[r.recomendado].cumpleTodo), `recomendado = el más barato de los que cumplen (Escenario ${r.recomendado === null ? "—" : r.recomendado + 1})`);
  ok(r.escenarios[r.mejorCosto].economia.diferenciaVsMejor === 0 && r.escenarios.every((x) => x.economia.diferenciaVsMejor >= 0), "diferencia frente al menor costo: 0 para el menor y positiva para los demás");
  // el más barato no cumple: no puede ser el recomendado
  const barato = V.compararEscenarios(comun, [e3, e1]);
  ok(barato.escenarios[0].economia.costoTotal < barato.escenarios[1].economia.costoTotal || barato.mejorCosto !== 0 || barato.recomendado !== 0, "un escenario que no cumple nunca es el recomendado aunque sea el más barato");
  ok(barato.recomendado !== 0, "…en particular el 4/0 sobrecargado no se recomienda");
  // sin costo en uno: queda fuera de la comparación
  const parcial = V.compararEscenarios(comun, [e1, { ...e2, tramos: [{ ...e2.tramos[0], costos: null }] }]);
  ok(parcial.escenarios[1].economia === null && !parcial.costosCompletos && parcial.mejorCosto === 0, "un escenario sin costo del conductor queda fuera de la comparación de costos");
  const uno = V.compararEscenarios(COMUN, [e1]);
  ok(uno.escenarios.length === 1 && uno.recomendado === null && uno.mejorCosto === null, "un solo escenario y sin precio: se evalúa igual, sin recomendado por costo");
});

await seccion("motor: escenario con varios tramos (aéreo + subterráneo a 34.5 kV)", async () => {
  const comun = { ...COMUN, economia: ECON };
  const costos = (c) => ({ costoConductorKm: c, costoInstalacionKm: 0, instalacionIndicada: false });
  const a = tramoAereo(HAWK, 1, { longitudKm: 3, costos: costos(12e6) });
  const s = tramoSubt("Cobre", "500 kcmil", 34.5, 2, { longitudKm: 2, costos: costos(60e6) });
  const r = V.evaluarEscenario(comun, escenario(34.5, [a, s], { corrienteFallaKa: 30 }));
  const ra = V.evaluarEscenario(comun, escenario(34.5, [a], { corrienteFallaKa: 30 }));
  const rs = V.evaluarEscenario(comun, escenario(34.5, [s], { corrienteFallaKa: 30 }));
  ok(r.tramos.length === 2 && r.longitudKm === 5, "2 tramos, 5 km en total");
  cerca(r.perdidas.pct, ra.perdidas.pct + rs.perdidas.pct, 1e-12, "pérdidas = suma de los tramos");
  cerca(r.perdidas.pct, perdidasPct({ ...COMUN, longitudKm: 3 }, 34.5, HAWK.r_ac_75c_ohm_km, 1) + perdidasPct({ ...COMUN, longitudKm: 2 }, 34.5, s.conductor.resistenciaOhmKm, 2), 1e-9, "…y coincide con 3·I²·R·L de cada tramo, calculado aparte");
  cerca(r.regulacion.pct, ra.regulacion.pct + rs.regulacion.pct, 1e-12, "caída de tensión = suma de los tramos");
  const usos = [ra.ampacidad.usoPct, rs.ampacidad.usoPct];
  ok(r.ampacidad.tramo === usos.indexOf(Math.max(...usos)) && r.ampacidad.usoPct === Math.max(...usos), `ampacidad: se evalúa con el tramo de menor capacidad, que es el más cargado (tramo ${r.ampacidad.tramo + 1})`);
  ok(r.ampacidad.totalA === Math.min(ra.ampacidad.totalA, rs.ampacidad.totalA), "la ampacidad de la alternativa es la menor de sus tramos");
  const caps = [ra.cortocircuito.totalKa, rs.cortocircuito.totalKa];
  ok(r.cortocircuito.tramo === caps.indexOf(Math.min(...caps)) && r.cortocircuito.totalKa === Math.min(...caps), `cortocircuito: manda el tramo de menor capacidad (tramo ${r.cortocircuito.tramo + 1})`);
  ok(r.cortocircuito.cumple === Math.min(...caps) >= 30, "la falla del escenario se compara con el tramo más débil");
  cerca(r.economia.costoTotal, ra.economia.costoTotal + rs.economia.costoTotal, 1e-12, "costo total = suma de los tramos");
  cerca(r.economia.inversion, 3 * 3 * 1 * 12e6 + 2 * 3 * 2 * 60e6, 1e-12, "inversión = Σ L·3·N·c_cond de cada tramo");
  const sin = V.evaluarEscenario(comun, escenario(34.5, [a, { ...s, costos: null }]));
  ok(sin.economia === null, "si a un tramo le falta el costo, el escenario queda fuera de la comparación de costos");

// Lee un ZIP sin compresión (el que arma js/util/zip.js): { nombre: texto }
function leerZip(bytes) {
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const dec = new TextDecoder();
  const archivos = {};
  let p = 0;
  while (p + 30 <= bytes.length && dv.getUint32(p, true) === 0x04034b50) {
    const tam = dv.getUint32(p + 18, true);
    const largoNombre = dv.getUint16(p + 26, true);
    const extra = dv.getUint16(p + 28, true);
    const nombre = dec.decode(bytes.subarray(p + 30, p + 30 + largoNombre));
    const ini = p + 30 + largoNombre + extra;
    archivos[nombre] = dec.decode(bytes.subarray(ini, ini + tam));
    p = ini + tam;
  }
  return archivos;
}

await seccion("xlsx: generador de Excel", async () => {
  const X = await import("../js/util/xlsx.js");
  ok(X.columna(0) === "A" && X.columna(25) === "Z" && X.columna(26) === "AA" && X.columna(27) === "AB", "letras de columna: A, Z, AA, AB");
  const zip = X.crearXlsx([
    { nombre: "Prueba: [1]", anchos: [20, 10], combinar: ["A1:B1"], filas: [[{ v: "Título <&>", estilo: "titulo" }], ["texto", 1234.5678], [{ v: 3.14159, dec: 2, estilo: "celda" }, { v: "", estilo: "seccion" }]] },
    { nombre: "Otra", filas: [["x"]] },

  const a = leerZip(zip);
  const nombres = Object.keys(a);
  for (const n of ["[Content_Types].xml", "_rels/.rels", "xl/workbook.xml", "xl/_rels/workbook.xml.rels", "xl/styles.xml", "xl/worksheets/sheet1.xml", "xl/worksheets/sheet2.xml"]) ok(nombres.includes(n), `trae ${n}`);

await seccion("vista: tramos dentro de un escenario", async () => {
  $(".btn-agregar-tramo").click(); // alternativa nueva, al final
  const cards = $$(".vi-escenario");
  const card = cards.at(-1);
  const col = cards.length; // su columna en la tabla (la 0 es la de etiquetas)
  const sid = card.querySelector("[id^=f-tension-]").id.split("-").pop();
  const cab = () => [...card.querySelectorAll(".vi-tramo-cab")];
  ok(card.querySelectorAll(".vi-tramo").length === 1 && cab().every((c) => c.hidden), "con un tramo la tarjeta no muestra encabezado de tramo (se ve como siempre)");
  const agregarTramo = card.querySelector(".vi-agregar-tramo");
  ok(agregarTramo && !agregarTramo.hidden && agregarTramo.textContent.includes("Agregar tramo"), "botón «Agregar tramo» dentro del escenario");
  agregarTramo.click();
  ok(card.querySelectorAll(".vi-tramo").length === 2 && cab().every((c) => !c.hidden), "con dos tramos aparece el encabezado de cada uno");
  ok(cab().map((c) => c.querySelector(".vi-tramo-titulo").textContent).join(" | ") === "Tramo 1 · Aérea | Tramo 2 · Aérea", "títulos «Tramo N · red»");
  ok($(T("longitud", sid, 0)).value === "5" && $(T("longitud", sid, 1)).value === "1", "cada tramo tiene su propia longitud");
  agregarTramo.click();
  agregarTramo.click();
  agregarTramo.click();
  ok(card.querySelectorAll(".vi-tramo").length === 4 && agregarTramo.hidden, "máximo 4 tramos: luego «Agregar tramo» se oculta");
  card.querySelectorAll(".vi-quitar-tramo")[3].click();
  card.querySelectorAll(".vi-quitar-tramo")[2].click();
  ok(card.querySelectorAll(".vi-tramo").length === 2 && !agregarTramo.hidden, "se pueden quitar tramos");
  ok(getComputedStyle(agregarTramo.parentElement).justifyContent === "flex-end", "«Agregar tramo» va justificado a la derecha");
  const titulosCosto = $$(".vi-economia .vi-costo-titulo").map((x) => x.textContent);
  ok(titulosCosto.includes(`Alternativa ${col} · Tramo 1 (aérea)`) && titulosCosto.includes(`Alternativa ${col} · Tramo 2 (aérea)`), "en la tarjeta económica cada tramo tiene su bloque de costos");
  ok(card.querySelectorAll("details.vi-avanzado .vi-tramo-avanzado").length === 2, "un solo «Parámetros avanzados» por alternativa, con la disposición de cada tramo");
  poner(T("tension", sid), "34.5", "input");
  poner(T("material", sid, 0), "ACSR");
  poner(T("calibre", sid, 0), "477");
  poner(T("referencia", sid, 0), HAWK.nombre_clave);
  poner(T("longitud", sid, 0), "3", "input");
  poner(T("red", sid, 1), "Subterranea");
  ok(cab()[1].querySelector(".vi-tramo-titulo").textContent === "Tramo 2 · Subterránea", "el título del tramo cambia con la red");
  poner(T("material", sid, 1), "Cobre");
  poner(T("calibre", sid, 1), "500 kcmil");
  poner(T("longitud", sid, 1), "2.5", "input");
  poner(T("tension", sid), "69", "input");
  ok(!$(T("tension", sid)).validity.valid, "la tensión es del escenario: con un tramo subterráneo, 69 kV no es válido");
  poner(T("tension", sid), "34.5", "input");
  ok($(T("tension", sid)).validity.valid && [...$(T("pct", sid, 1)).options].map((o) => o.value).join(",") === "100,133", "a 34.5 kV sí, y el cable del tramo subterráneo toma el nivel de 35 kV");
  $("#form-calc").requestSubmit();
  await espera(30);
  const fila = (nombre) => $$("#resultado-wrap .vi-matriz tr").find((tr) => tr.querySelector(":scope > td.etiqueta-fila")?.textContent === nombre);
  const conductor = fila("Conductor").children[col];
  ok(conductor.innerHTML.includes("<br>") && conductor.textContent.includes("T1 · Aérea") && conductor.textContent.includes("T2 · Subterránea"), "la celda del conductor lista los tramos, uno por línea");
  const longitud = fila("Longitud").children[col].textContent;
  ok(longitud.startsWith("5.50 km") && longitud.includes("2 tramos"), `longitud total del escenario y cuántos tramos («${longitud}»)`);
  const amp = (fila("Ampacidad total") ?? fila("Ampacidad por conductor")).children[col].textContent;
  ok(/T1 [\d,]+ A · T2 [\d,]+ A/.test(amp), `la ampacidad muestra la de cada tramo («${amp}»)`);
  ok(/Con T\d, el de menor capacidad/.test(fila("Uso de la ampacidad").children[col].textContent), "el uso se evalúa con el tramo de menor capacidad");
  ok(/T1 [\d.]+ kA · T2 [\d.]+ kA/.test(fila("Capacidad de cortocircuito").children[col].textContent), "el cortocircuito muestra la capacidad de cada tramo");
  const det = $("#resultado-wrap .vi-detalle-tramos");
  ok(det && !det.open && det.querySelectorAll("tbody tr").length === $$(".vi-tramo").length, "«Detalle por tramo» plegado, con una fila por tramo de todos los escenarios");
  ok($$("#resultado-wrap .callout-warning").some((c) => c.textContent.includes("no tienen la misma longitud total")), "avisa que las alternativas no suman la misma longitud");
  const rep = $("#resultado-wrap .report-block").textContent;
  ok(rep.includes(`Alternativa ${col} — 34.50 kV · 2 tramos · 5.50 km:`) && rep.includes("  Tramo 2 — Subterránea") && rep.includes("  Totales de la alternativa:") && rep.includes("Ampacidad: se evalúa con el tramo"), "el reporte detalla cada tramo y los totales del escenario");
  ok(rep.includes("  Tramo 1:\n    Tipo de red: Aérea\n    Longitud: 3.00 km"), "los parámetros de entrada van por tramo");
  card.querySelector(".btn-tramo-quitar").click(); // se deja la pantalla como estaba para las pruebas siguientes
  ok($$(".vi-escenario").length === col - 1, "se quita el escenario de prueba");
});

await seccion("vista: al volver a la pantalla se conserva lo escrito", async () => {
  const antes = $$(".tramo-block").length;
  $("details.vi-avanzado").open = true;
  poner("#f-ta", "31", "input");
  salir();
  stage.innerHTML = "";
  salir = await vista.render(stage);
  const ids = $$(".tramo-block [id^=f-tension-]").map((el) => el.id.split("-").pop());
  ok($$(".tramo-block").length === antes, `se restauran los ${antes} escenarios`);
  ok($(T("red", ids[1])).value === "Subterranea" && $(T("calibre", ids[1])).value === "500 kcmil" && $(T("n", ids[1])).value === "2", "el escenario 2 vuelve subterráneo, 500 kcmil, 2 circuitos");
  ok($(T("material", ids[0])).value === "AAAC" && $(T("referencia", ids[0])).value === "Alliance (7)" && $(T("falla", ids[0])).value === "5", "el escenario 1 conserva conductor, referencia y falla");
  ok($("#f-ta").value === "31" && $("details.vi-avanzado").open, "se conservan los parámetros avanzados y si estaban abiertos");
  ok($("#f-precio").value === "350", "se conserva el precio de la energía");
});

await seccion("vista: un dato obligatorio faltante dentro de «Parámetros avanzados» lo despliega", async () => {

});

await seccion("registro: menú, permisos, ruta, ayuda y service worker", async () => {
  const nav = await import("../js/nav.js");
  const lista = nav.sectionMenus.calculos;
  const item = lista.find((x) => x.title === "Valoración integral");
  ok(item && item.hash === "#/calculos/valoracion-integral" && item.icon === "clipboardCheck" && !item.libre, "tarjeta en Cálculos, icono clipboardCheck, solo usuarios");
  ok(lista.at(-1) === item, "va al final del menú de Cálculos");
  const perm = await import("../js/auth/permisos.js");
  ok(!perm.permitida("/calculos/valoracion-integral", "visitante") && perm.permitida("/calculos/valoracion-integral", "usuario"), "el visitante no la abre; el usuario sí");
  const { icon } = await import("../js/icons.js");
  ok(icon("clipboardCheck").includes("M9 14l2 2l4 -4"), "el icono existe");
  const router = await (await fetch("../js/router.js")).text();
  ok(router.includes('"/calculos/valoracion-integral"') && router.includes("calc-valoracion-integral.js"), "la ruta está en el router");
  const ayuda = await (await fetch("../js/views/ayuda.js")).text();
  ok(ayuda.includes('"#/calculos/valoracion-integral"'), "tiene descripción en Ayuda");
  const sw = await (await fetch("../sw.js")).text();
  const shell = [...sw.matchAll(/^\s*"([^"]+)",\s*$/gm)].map((m) => m[1]);
  ok(shell.includes("js/calc/valoracion-integral.js") && shell.includes("js/views/calc-valoracion-integral.js") && shell.includes("data/construccion-cable-subterraneo.json"), "el service worker precachea el motor, la vista y los catálogos");
  const css = await (await fetch("../css/app.css")).text();
  ok(!/#[0-9a-fA-F]{3,8}\b/.test(css.split("\n").filter((l) => l.includes(".vi-") && !l.includes("vi-doc")).join("\n")), "el CSS de la pantalla no lleva colores escritos a mano (solo el documento PDF, que siempre es claro)");
  ok(shell.includes("js/util/xlsx.js"), "el service worker precachea el generador de Excel");
  ok(!css.includes("vi-seccion + tr td"), "la primera fila de cada sección conserva su línea de tabla (no se le quita el borde)");
});
