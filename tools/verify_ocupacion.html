<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>verify_ocupacion</title>
<!--
  Pruebas de la pantalla de Ocupacion de ductos (js/views/calc-ocupacion-ductos.js) y de su logica de varios tipos de
  conductor (js/calc/ocupacion-grupos.js). Se ejecuta en el navegador, sin internet: la vista real se renderiza en un
  contenedor oculto y se maneja como lo haria una persona; los numeros se comparan con formulas escritas aqui de forma
  independiente (areas con π ≈ 3.1416, como el original, y limites NTC-2050 Cap. 9 Tabla 1).

  Uso (desde la raiz del proyecto):
    python -m http.server 8000
    abrir http://localhost:8000/tools/verify_ocupacion.html   -> lista PASS/FAIL
  o en modo consola:
    msedge --headless --dump-dom --virtual-time-budget=35000 http://localhost:8000/tools/verify_ocupacion.html
-->
<style>body{font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:12px}#stage{position:absolute;left:-9999px;width:1000px}</style>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<pre id="out"></pre>
<div id="stage"></div>
<script type="module">
window.__BASE_PATH__ = "../";
const out = document.getElementById("out");
let fallos = 0;
let total = 0;
function ok(cond, msg) {
  total++;
  if (!cond) fallos++;
  out.textContent += `${cond ? "PASS" : "FAIL"} ${msg}\n`;
}
function cerca(a, b, tol, msg) {
  ok(Math.abs(a - b) <= tol, `${msg} (obtenido ${a}, esperado ${b})`);
}
async function seccion(nombre, fn) {
  out.textContent += `\n== ${nombre}\n`;
  try {
    await fn();
  } catch (err) {
    fallos++;
    total++;
    out.textContent += `FAIL excepcion en "${nombre}": ${err && err.stack ? err.stack : err}\n`;
  }
}
const espera = (ms) => new Promise((r) => setTimeout(r, ms));

const motor = await import("../js/calc/ocupacion-ductos.js");
const og = await import("../js/calc/ocupacion-grupos.js");
const tuberias = await (await fetch("../data/tuberias.json")).json();
const xlpe = await (await fetch("../data/conductores-xlpe.json")).json();

// Formulas independientes (π = 3.1416 como el original).
const PI = 3.1416;
const area = (d) => PI * (d / 2) ** 2;
const limite = (n) => (n === 1 ? 53 : n === 2 ? 31 : 40);
function esperado(tuboMm, lista) {
  const n = lista.reduce((s, g) => s + g.cantidad, 0);
  const areaC = lista.reduce((s, g) => s + g.cantidad * area(g.diametroMm), 0);
  return { n, areaC, areaT: area(tuboMm), pct: (areaC * 100) / area(tuboMm), limite: limite(n) };
}

await seccion("ocupacion-grupos: logica", async () => {
  const uno = og.calcularOcupacionGrupos(100, [{ cantidad: 3, diametroMm: 30 }]);
  const directo = motor.calcularOcupacionDuctos({ numeroConductores: 3, diametroConductorMm: 30, diametroTuboMm: 100 });
  ok(uno.ocupacionPct === directo.ocupacionPct && uno.areaCables === directo.areaCables && uno.areaTubo === directo.areaTubo && uno.limitePct === directo.limitePct && uno.cumple === directo.cumple, "un solo tipo: idéntico al motor original");
  ok(uno.jammingRatio === directo.jammingRatio && uno.riesgoAtascamiento === directo.riesgoAtascamiento, "un solo tipo: mismo jamming ratio que el motor");
  cerca(uno.ocupacionPct, 27, 1e-9, "3 conductores de 30 mm en un ducto de 100 mm: 27 %");

  const lista = [{ cantidad: 3, diametroMm: 22.3 }, { cantidad: 3, diametroMm: 30.5 }];
  const e = esperado(100, lista);
  const dos = og.calcularOcupacionGrupos(100, lista);
  cerca(dos.ocupacionPct, e.pct, 1e-9, `dos ternas de distinto calibre: ocupación ${e.pct.toFixed(3)} %`);
  cerca(dos.areaCables, e.areaC, 1e-9, "el área total es la suma de las áreas de todos los conductores");
  ok(dos.totalConductores === 6 && dos.limitePct === 40, "el límite depende del número TOTAL de conductores (6 → 40 %)");
  cerca(dos.grupos[0].ocupacionPct + dos.grupos[1].ocupacionPct, dos.ocupacionPct, 1e-9, "la ocupación de cada tipo suma la total");
  cerca(dos.grupos[1].areaTotal, 3 * area(30.5), 1e-9, "área total del segundo tipo = 3·área de un conductor");
  cerca(dos.disponiblePct, 100 - e.pct, 1e-9, "disponible = 100 − ocupación");
  cerca(dos.grupos[0].radioCurvaturaMm, 12 * 22.3, 1e-9, "radio de curvatura del tipo 1 = 12 × 22.3 mm");
  cerca(dos.grupos[1].radioCurvaturaMm, 12 * 30.5, 1e-9, "radio de curvatura del tipo 2 = 12 × 30.5 mm");
  ok(uno.grupos[0].radioCurvaturaMm === 360 && og.FACTOR_RADIO_CURVATURA === 12, "un conductor de 30 mm: radio de curvatura 360 mm (factor 12 fijo)");

  // limites segun el total (1 → 53, 2 → 31, 3 o mas → 40), aunque vengan de tipos distintos
  const lim = (l) => og.calcularOcupacionGrupos(100, l).limitePct;
  ok(lim([{ cantidad: 1, diametroMm: 10 }]) === 53 && lim([{ cantidad: 1, diametroMm: 10 }, { cantidad: 1, diametroMm: 12 }]) === 31 && lim([{ cantidad: 1, diametroMm: 10 }, { cantidad: 2, diametroMm: 12 }]) === 40, "límites: 1 → 53 %, 2 (1+1) → 31 %, 3 (1+2) → 40 %");
  ok(og.getLimiteOcupacion === motor.getLimiteOcupacion, "el límite es el del motor original");

  // cumple / no cumple
  ok(og.calcularOcupacionGrupos(100, [{ cantidad: 3, diametroMm: 30 }]).cumple && !og.calcularOcupacionGrupos(100, [{ cantidad: 3, diametroMm: 40 }]).cumple, "27 % cumple (límite 40 %); 48 % no cumple");
  ok(og.calcularOcupacionGrupos(100, [{ cantidad: 1, diametroMm: 70 }]).cumple === true && og.calcularOcupacionGrupos(100, [{ cantidad: 1, diametroMm: 80 }]).cumple === false, "un conductor: 49 % cumple y 64 % no cumple (límite 53 %)");

  // atascamiento: solo con exactamente 3 conductores del mismo diametro
  const j = og.calcularOcupacionGrupos(93, [{ cantidad: 3, diametroMm: 30 }]);
  ok(Math.abs(j.jammingRatio - 3.1) < 1e-12 && j.riesgoAtascamiento, "3 iguales con razón 3.1: hay riesgo de atascamiento");
  const j2 = og.calcularOcupacionGrupos(93, [{ cantidad: 2, diametroMm: 30 }, { cantidad: 1, diametroMm: 30 }]);
  ok(Math.abs(j2.jammingRatio - 3.1) < 1e-12 && j2.riesgoAtascamiento, "3 en total del mismo diámetro (2+1): también se evalúa");
  const j3 = og.calcularOcupacionGrupos(93, [{ cantidad: 2, diametroMm: 30 }, { cantidad: 1, diametroMm: 25 }]);
  ok(j3.jammingRatio === null && !j3.riesgoAtascamiento, "3 en total pero de distinto diámetro: no se evalúa el atascamiento");
  ok(og.calcularOcupacionGrupos(93, [{ cantidad: 6, diametroMm: 30 }]).jammingRatio === null, "con 6 conductores no se evalúa el atascamiento");
  ok(og.calcularOcupacionGrupos(100, [{ cantidad: 3, diametroMm: 30 }]).riesgoAtascamiento === false, "razón 3.33: sin riesgo");
});

const stage = document.getElementById("stage");
const $ = (s, r = stage) => r.querySelector(s);
const $$ = (s, r = stage) => [...r.querySelectorAll(s)];
const poner = (sel, v, ev = "input") => { const e = $(sel); e.value = v; e.dispatchEvent(new Event(ev, { bubbles: true })); };
const elegir = (sel, v) => poner(sel, v, "change");
const marcar = (sel, v) => { const e = $(sel); e.checked = v; e.dispatchEvent(new Event("change", { bubbles: true })); };
const texto = (e) => (e ? e.textContent.replace(/\s+/g, " ").trim() : "");
const metrica = (etiqueta) => $$(".result-metric").find((m) => texto($(".label", m)).startsWith(etiqueta));
const valorDe = (etiqueta) => parseFloat(texto($(".value", metrica(etiqueta))));
const calcular = () => $("#form-calc").requestSubmit();

// tuberia del catalogo usada en las pruebas: la primera de su tipo con diametro interno cercano a 100 mm
const TIPO = tuberias[0].tipo;
const TUBO = tuberias.filter((t) => t.tipo === TIPO).sort((a, b) => Math.abs(a.diametro_interno_min_mm - 100) - Math.abs(b.diametro_interno_min_mm - 100))[0];
const D_TUBO = TUBO.diametro_interno_min_mm;

const { render } = await import("../js/views/calc-ocupacion-ductos.js");
await render(stage, {});

await seccion("vista: tarjetas de tubería y conductores", async () => {
  const titulos = $$(".form-section-title").map(texto);
  ok($$(".card.form-section").length === 2 && titulos[0].includes("Tubería") && titulos[1].includes("Conductores tipo 1") && !titulos[1].includes("—"), `dos tarjetas: «${titulos.join("» y «")}»`);
  ok($$(".form-section-title").every((t) => t.querySelector("svg.icon") && t.parentElement.classList.contains("card")), "cada título lleva su icono y va dentro de su tarjeta");
  ok($$(".grupo-block > .form-section-title > svg.icon").filter((i) => !i.closest(".btn-plegar")).every((i) => i.querySelectorAll("g circle").length === 7 && i.querySelectorAll(":scope > circle").length === 1), "las tarjetas «Conductores tipo N» llevan el icono de conductor cableado (aro con 7 hilos)");
  { const ico = $(".form-section-title svg.icon"), rb = ico.getBoundingClientRect(), otro = $$(".form-section-title svg.icon")[1].getBoundingClientRect();
    ok(getComputedStyle(ico).transform === "matrix(0, -1, 1, 0, 0, 0)" && getComputedStyle($$(".form-section-title svg.icon")[1]).transform === "none", "el icono de «Tubería» está girado 90° en sentido contrario a las manecillas (y el de conductores no)");
    ok(Math.abs(rb.width - otro.width) < 0.5 && Math.abs(rb.height - otro.height) < 0.5, "el giro no cambia el tamaño del icono ni la altura de la barra"); }
  ok($$(".card").every((c) => c.classList.contains("tarjeta-borde")), "las tarjetas llevan el borde marcado");
  ok($(".btn-tramo-quitar").hidden, "con un solo tipo de conductor no aparece «Quitar»");
  ok($$(".btn-row .btn").some((b) => texto(b) === "Agregar tipo de conductor") && !$(".grupo-block .btn-agregar-tramo"), "«Agregar tipo de conductor» está junto a «Calcular» (a su derecha), fuera de las tarjetas");
  ok(!$("#resumen-total") && !/Total de conductores/.test(texto($("#form-calc"))), "ya no hay la etiqueta «Total de conductores … Límite NTC-2050 aplicable» bajo las tarjetas");
  ok($$(".hint").length === 0, "no quedan textos de ayuda fijos (.hint) debajo de los campos");
  const tarjetas = $$(".form-section").map((c) => c.getBoundingClientRect());
  ok(Math.abs(tarjetas[1].top - tarjetas[0].bottom - 16) < 0.6, `las tarjetas Tubería y Conductores están separadas 16 px (${(tarjetas[1].top - tarjetas[0].bottom).toFixed(1)} px)`);

  // campos de cada tarjeta
  const tub = $$(".field > label:first-child", $$(".form-section")[0]).map(texto);
  ok(tub.join("|") === "Tipo de tubería|Diámetro nominal|Diámetro interno de la tubería (mm)", `campos de la tubería: ${tub.join(" | ")}`);
  const con = $$(".grupo-block .field > label:first-child").filter((l) => l.getClientRects().length).map(texto);
  ok(con.join("|") === "Número de conductores|Diámetro del conductor (mm)", `campos visibles de conductores: ${con.join(" | ")}`);
  ok(texto($("#f-diametro-0").closest(".input-with-toggle")).includes("Catálogo") && $("#f-diametro-0").closest(".input-with-toggle").querySelector('input[type="checkbox"]'), "a la derecha del diámetro hay una casilla «Catálogo»");
  const rd = $("#f-diametro-0").getBoundingClientRect();
  const rc = $("#chk-catalogo-0").getBoundingClientRect();
  ok(rc.left > rd.right && Math.abs(rc.top + rc.height / 2 - (rd.top + rd.height / 2)) < 6, "la casilla queda a la derecha del campo y a su misma altura");
  ok($(".catalogo-campos").hidden && $("#f-diametro-0").value === "30" && !$("#f-diametro-0").disabled, "por defecto: campos del catálogo ocultos y diámetro editable (30 mm)");
  ok($("#f-n-0").value === "3", "por defecto: 3 conductores");
});

await seccion("vista: tubería (catálogo y manual)", async () => {
  ok($("#f-interno").disabled && $("#f-interno").value === "", "el diámetro interno está bloqueado y vacío mientras no se elija tubería");
  elegir("#f-tipo", TIPO);
  ok(!$("#f-nominal").disabled, "al elegir el tipo se habilita el diámetro nominal");
  elegir("#f-nominal", TUBO.diametro_nominal);
  cerca(parseFloat($("#f-interno").value), D_TUBO, 1e-12, `el diámetro interno sale del catálogo (${TIPO} ${TUBO.diametro_nominal}: ${D_TUBO} mm)`);
  ok($("#f-interno").disabled, "bloqueado mientras no esté «Manual»");
  marcar("#chk-manual", true);
  ok(!$("#f-interno").disabled && !$("#f-tipo").required && !$("#f-nominal").required, "«Manual» habilita el diámetro interno y ya no exige tipo ni diámetro nominal");
  poner("#f-interno", "104.5");
  ok($("#f-interno").validity.valid, "el diámetro interno manual acepta decimales");
  marcar("#chk-manual", false);
  cerca(parseFloat($("#f-interno").value), D_TUBO, 1e-12, "al quitar «Manual» vuelve el valor del catálogo");
  ok($("#f-tipo").required && $("#f-nominal").required, "sin «Manual» tipo y diámetro nominal vuelven a ser obligatorios");
  elegir("#f-tipo", "");
  ok($("#f-interno").value === "" && $("#f-nominal").disabled, "al borrar el tipo se limpia el diámetro interno");
  elegir("#f-tipo", TIPO);
  elegir("#f-nominal", TUBO.diametro_nominal);
});

await seccion("vista: un tipo de conductor, cálculo y resultados", async () => {
  poner("#f-diametro-0", "30");
  calcular();
  const e = esperado(D_TUBO, [{ cantidad: 3, diametroMm: 30 }]);
  cerca(valorDe("Porcentaje de ocupación"), e.pct, 0.006, `resultado: ocupación ${e.pct.toFixed(3)} %`);
  cerca(valorDe("Porcentaje disponible"), 100 - e.pct, 0.006, "resultado: porcentaje disponible");
  const badge = $(".badge", metrica("Porcentaje de ocupación"));
  ok(badge && texto(badge) === (e.pct <= 40 ? "Cumple" : "No cumple"), `veredicto: «${texto(badge)}» (límite 40 %)`);
  ok(texto(metrica("Porcentaje de ocupación")).includes("límite 40.00%") || texto(metrica("Porcentaje de ocupación")).includes("límite 40"), "la etiqueta indica el límite aplicable");
  ok(!!$(".oc-resumen .oc-dona svg") && !$(".result-panel [style*='conic-gradient']"), "la dona de ocupación es ahora un gráfico SVG (dona con degradado y marca del límite)");
  const cols = $$(".oc-resumen > *");
  ok(cols.length === 3 && cols[0].classList.contains("oc-corte") && cols[1].classList.contains("oc-dona") && cols[2].classList.contains("oc-metricas"), "tres columnas en este orden: corte transversal | dona | cifras");
  const rC = cols[0].getBoundingClientRect(), rD = cols[1].getBoundingClientRect(), rM = cols[2].getBoundingClientRect();
  const ancha = window.innerWidth > 900; // con la ventana angosta (celular) las tres pasan a una sola columna
  ok(ancha ? rC.right <= rD.left + 1 && rD.right <= rM.left + 1 && Math.abs(rD.top - rC.top) < 200 : rC.bottom <= rD.top + 1 && rD.bottom <= rM.top + 1, ancha ? "quedan una junto a otra (el corte a la izquierda, luego la dona y las cifras)" : "en ventana angosta se apilan en una columna (corte, dona, cifras)");
  const cssApp = await (await fetch("../css/app.css")).text();
  ok(/\.oc-resumen\s*\{[^}]*grid-template-columns:\s*230px 230px auto/.test(cssApp) && /@media \(max-width: 900px\)\s*\{\s*\.oc-resumen\s*\{\s*grid-template-columns: 1fr/.test(cssApp), "el CSS define tres columnas y una sola por debajo de 900 px");
  ok(texto($(".oc-dona svg text")).length > 0 && /25\.8 %|%/.test($(".oc-dona").textContent) && $(".oc-dona").textContent.includes("40 %"), "la dona muestra la ocupación y el límite (40 %)");
  { // los conductores dibujados no se encimaban ni salen del ducto (para 3 × Ø30 y para dos tipos)
    const { asentarConductores } = await import("../js/util/graficos.js");
    for (const tipos of [[{ cantidad: 3, diametroMm: 30 }], [{ cantidad: 3, diametroMm: 28 }, { cantidad: 3, diametroMm: 18 }]]) {
      const cs = asentarConductores(102.3, tipos);
      let minHolgura = Infinity, dentro = true;
      cs.forEach((c, i) => {
        if (Math.hypot(c.x, c.y) + c.r > 102.3 / 2 + 0.01) dentro = false;
        for (let j = i + 1; j < cs.length; j++) minHolgura = Math.min(minHolgura, Math.hypot(c.x - cs[j].x, c.y - cs[j].y) - c.r - cs[j].r);
      });
      ok(dentro && minHolgura > -0.05, `corte: ${cs.length} conductores dentro del ducto y sin encimarse (holgura mínima ${minHolgura.toFixed(3)} mm)`);
    }
  }
  const sC = cols[0].querySelector("svg").getBoundingClientRect(), sD = cols[1].querySelector("svg").getBoundingClientRect();
  ok(Math.abs(sD.width - sC.width) < 1 && Math.abs(sD.height - sC.height) < 1, `la dona y el corte miden lo mismo (${sD.width.toFixed(0)} × ${sD.height.toFixed(0)} px)`);
  if (ancha) ok(rD.left - rC.right < 100 && rM.left - rD.right < 100, `las tres columnas quedan juntas, a la izquierda (${(rD.left - rC.right).toFixed(0)} y ${(rM.left - rD.right).toFixed(0)} px de separación)`);
  { // un conductor mas grueso que el ducto se dibuja «lleno» (con el diametro del ducto), no desaparece ni se sale
    const { asentarConductores, corteDuctoSvg } = await import("../js/util/graficos.js");
    const gordo = asentarConductores(102.3, [{ cantidad: 1, diametroMm: 200 }]);
    ok(gordo.length === 1 && Math.abs(gordo[0].r * 2 - 102.3) < 1e-9 && Math.hypot(gordo[0].x, gordo[0].y) + gordo[0].r <= 102.3 / 2 + 0.01, "un conductor de Ø200 en un ducto de Ø102.3 se dibuja de Ø102.3 (el del ducto), dentro del ducto y centrado");
    const varios = asentarConductores(102.3, [{ cantidad: 3, diametroMm: 150 }]);
    ok(varios.length === 3 && varios.every((c) => Math.abs(c.r * 2 - 102.3) < 1e-9 && Math.hypot(c.x, c.y) + c.r <= 102.3 / 2 + 0.01 && Number.isFinite(c.x) && Number.isFinite(c.y)), "con varios conductores más gruesos que el ducto todos se dibujan llenos y dentro del ducto");
    const svg = corteDuctoSvg({ diametroTuboMm: 102.3, tipos: [{ cantidad: 3, diametroMm: 150 }] });
    ok((svg.match(/oc-aparece/g) || []).length === 3 && !/NaN/.test(svg), "el dibujo tiene los 3 conductores y ningún valor inválido");
    const igual = asentarConductores(102.3, [{ cantidad: 1, diametroMm: 102.3 }]);
    ok(Math.abs(igual[0].r - gordo[0].r) < 1e-9, "un conductor más grueso se ve igual que uno del mismo diámetro que el ducto");
    const chico = asentarConductores(3, [{ cantidad: 1, diametroMm: 10 }]);
    ok(Math.abs(chico[0].r * 2 - 3) < 1e-9 && Number.isFinite(chico[0].x) && Number.isFinite(chico[0].y), "con un ducto muy pequeño (Ø3 mm) sigue dando un dibujo coherente (Ø3 mm)");
  }
  ok($$(".oc-corte svg .oc-aparece").length === 3 && /3 conductores/.test($(".oc-corte svg").getAttribute("aria-label")), "el corte transversal dibuja los 3 conductores");
  ok(!$$(".tabla-resultado").length, "con un solo tipo no hay tabla por tipo");
  const rc = metrica("Radio de curvatura (12D)");
  ok(!!rc && texto($(".value", rc)) === "360.00mm" && texto($(".label", rc)) === "Radio de curvatura (12D)", `con un solo tipo hay una métrica «Radio de curvatura (12D)»: ${texto($(".value", rc))} (12 × 30 mm)`);

  // no cumple
  poner("#f-diametro-0", "60");
  calcular();
  const b2 = $(".badge", metrica("Porcentaje de ocupación"));
  ok(texto(b2) === "No cumple" && b2.classList.contains("badge-danger"), "diámetro muy grande: «No cumple»");
  poner("#f-diametro-0", "30");

  // atascamiento
  poner("#f-diametro-0", String(D_TUBO / 3.1));
  calcular();
  ok(!!$("#resultado-wrap .callout-warning") && texto($("#resultado-wrap .callout-warning")).includes("atascamiento"), "razón ≈ 3.1 con 3 conductores: aviso de atascamiento");
  poner("#f-diametro-0", "30");

  // 1 conductor cambia el limite (y el total) que muestra la dona
  elegir("#f-n-0", "1");
  calcular();
  ok(/Total de conductores: 1/.test(texto($(".oc-dona svg"))) && /Límite NTC-2050: 53 %/.test(texto($(".oc-dona svg"))), "con 1 conductor la dona dice «Total de conductores: 1» y «Límite NTC-2050: 53 %»");
  elegir("#f-n-0", "3");
});

await seccion("vista: conductor del catálogo", async () => {
  marcar("#chk-catalogo-0", true);
  const vis = () => $$(".catalogo-campos .field > label:first-child").filter((l) => l.getClientRects().length).map(texto);
  ok(vis().join("|") === "Nivel de tensión|Nivel de aislamiento|Material del conductor|Pantalla|Calibre", `al marcar «Catálogo» aparecen: ${vis().join(" | ")}`);
  ok($("#f-diametro-0").disabled && $("#f-diametro-0").value === "", "el diámetro se bloquea y queda vacío hasta elegir calibre");
  ok($("#f-calibre-0").required && $("#f-calibre-0").value === "" && !$("#form-calc").checkValidity(), "sin elegir calibre el formulario no es válido");

  // filas y opciones esperadas segun el catalogo
  const opcionesDe = (id) => $$(`#${id} option`).map((o) => o.value).filter((v) => v !== "");
  const tensiones = [...new Set(xlpe.map((c) => c.nivel_tension_kv))].sort((a, b) => parseFloat(a) - parseFloat(b));
  ok(opcionesDe("f-tension-0").join("|") === tensiones.join("|") && $("#f-tension-0").value === tensiones[0], `tensiones: ${tensiones.join(", ")} (por defecto la primera)`);
  ok(opcionesDe("f-aislamiento-0").join("|") === "100|133", "15 kV: niveles de aislamiento 100 % y 133 %");
  ok(opcionesDe("f-material-0").join("|") === "Cobre|Aluminio", "materiales: Cobre y Aluminio");

  elegir("#f-aislamiento-0", "133");

  cerca(parseFloat($("#f-diametro-0").value), fila("15 kV", 133, "Cobre", "Cinta de cobre", "4/0").diametro_total_conductor_mm, 1e-12, "133 %: se conserva el calibre 4/0 y el diámetro se actualiza");
  elegir("#f-material-0", "Aluminio");

  const c175 = xlpe.filter((c) => c.nivel_tension_kv === "17.5 kV" && c.material_conductor === "Cobre");

  elegir("#f-calibre-0", c175[0].calibre_awg_kcmil);

await seccion("vista: estructura del reporte (se copia y se pega)", async () => {
  const leer = () => { calcular(); return $('[data-panel="reporte"] .report-block').textContent.split("\n"); };
  const LINEA = /^-{30}$/;
  const etiquetasEn = (l) => l.filter((x) => /^[A-ZÁÉÍÓÚÑ ]{4,}:?$/.test(x));
  const secciones = (l) => { const iRes = l.indexOf("RESULTADOS:"); return { iRes, params: l.slice(5, iRes - 2), res: l.slice(iRes + 2) }; };
  const tiene = (l, inicio) => l.some((x) => x.trim().startsWith(inicio));

  // un solo tipo
  $$(".btn-tramo-quitar").at(-1).click();
  const a = leer();
  const sa = secciones(a);
  ok(a[0] === "CÁLCULO DE OCUPACIÓN DE DUCTOS" && a[1] === "" && a[2] === "" && a[3] === "PARÁMETROS DE ENTRADA:" && LINEA.test(a[4]), "«CÁLCULO DE OCUPACIÓN DE DUCTOS», dos líneas en blanco, «PARÁMETROS DE ENTRADA:» y su línea divisoria DEBAJO");
  ok(sa.iRes > 5 && a[sa.iRes - 1] === "" && a[sa.iRes - 2] === "" && LINEA.test(a[sa.iRes + 1]), "«RESULTADOS:» con dos líneas en blanco antes y su línea divisoria DEBAJO");
  ok(!LINEA.test(a[3]) && !LINEA.test(a[sa.iRes - 1]) && !LINEA.test(a[5]) && !LINEA.test(a[sa.iRes + 2]), "encima de las etiquetas no hay línea y debajo de la línea sigue directamente el contenido");
  ok(etiquetasEn(a).join("|") === "CÁLCULO DE OCUPACIÓN DE DUCTOS|PARÁMETROS DE ENTRADA:|RESULTADOS:" && a.filter((x) => LINEA.test(x)).length === 2, "tres etiquetas y dos líneas divisorias");
  for (const inicio of ["Tipo de tubería:", "Diámetro nominal:", "Diámetro interno de la tubería:", "Conductores tipo 1:", "Número de conductores: 3", "Diámetro del conductor: 30.00 mm", "Origen del diámetro: Ingresado manualmente"]) {
    ok(tiene(sa.params, inicio), `parámetros de entrada incluye «${inicio}»`);
  }
  for (const inicio of ["Área", "Porcentaje", "Límite", "Cumple", "Número total"]) {
    ok(!tiene(sa.params, inicio), `«${inicio}…» NO está en los parámetros (es un resultado)`);
  }
  for (const inicio of ["Número total de conductores: 3", "Tipo 1:", "Área de un conductor", "Área total del tipo", "Radio de curvatura (12D): 360.00 mm", "Área total de conductores", "Área interna del ducto", "Porcentaje de ocupación", "Porcentaje disponible", "Límite aplicable (NTC-2050)", "Cumple:"]) {
    ok(tiene(sa.res, inicio), `resultados incluye «${inicio}»`);
  }
  ok(!tiene(sa.res, "Diámetro del conductor") && !tiene(sa.res, "Tipo de tubería") && !tiene(sa.res, "Diámetro interno"), "los datos de entrada no se repiten en los resultados");
  const negritas = $$('[data-panel="reporte"] .report-block strong');
  const pesos = negritas.map((e) => parseInt(getComputedStyle(e).fontWeight, 10));
  ok(negritas.map((e) => e.textContent).join("|") === "CÁLCULO DE OCUPACIÓN DE DUCTOS|PARÁMETROS DE ENTRADA:|RESULTADOS:" && pesos.every((w) => w >= 700), `las tres etiquetas están en negrita (${pesos.join(", ")}) y solo ellas`);

  // tuberia manual
  marcar("#chk-manual", true);
  poner("#f-interno", "104.5");
  const m = leer();
  const sm = secciones(m);
  ok(tiene(sm.params, "Tubería: ingresada manualmente") && tiene(sm.params, "Diámetro interno de la tubería: 104.50 mm") && !tiene(sm.params, "Tipo de tubería"), "tubería manual: el reporte lo indica y no lista tipo ni nominal");
  marcar("#chk-manual", false);

  // dos tipos, el segundo del catalogo
  $(".btn-agregar-tramo").click();
  const id = $$(".grupo-block").at(-1).querySelector('select[id^="f-n-"]').id.replace("f-n-", "");
  marcar(`#chk-catalogo-${id}`, true);
  elegir(`#f-calibre-${id}`, "2");
  const d = leer();
  const sd = secciones(d);
  ok(etiquetasEn(d).length === 3 && d.filter((x) => LINEA.test(x)).length === 2, "con dos tipos siguen siendo tres etiquetas y dos líneas");
  ok(sd.params.filter((x) => /^Conductores tipo \d:$/.test(x)).join() === "Conductores tipo 1:,Conductores tipo 2:" && sd.res.filter((x) => /^Tipo \d:$/.test(x)).join() === "Tipo 1:,Tipo 2:", "los dos tipos aparecen en los parámetros y en los resultados");
  ok(tiene(sd.params, "Origen del diámetro: Catálogo XLPE: 15 kV (100 %), Cobre, Cinta de cobre, calibre 2"), "el tipo del catálogo indica de dónde salió el diámetro");
  ok(sd.res.filter((x) => x.trim().startsWith("Radio de curvatura (12D): ")).length === 2, "con dos tipos, el reporte trae el radio de curvatura de cada uno");
  ok(tiene(sd.res, "Número total de conductores: 6") && d.at(-1).startsWith("Cumple:"), "el total de conductores va en los resultados y el reporte termina con «Cumple»");
  $$(".btn-tramo-quitar").at(-1).click();
});

// La pantalla se prueba tambien dentro de un iframe de ancho fijo: las media queries dependen del ancho de la ventana.
const cargarMarco = (ancho) => new Promise((resolve) => {
  const marco = document.createElement("iframe");
  marco.style.cssText = `position:fixed;left:-99999px;top:0;width:${ancho}px;height:3000px;border:0`;
  const alRecibir = (e) => {
    if (e.source !== marco.contentWindow || e.data !== "listo") return;
    window.removeEventListener("message", alRecibir);
    resolve(marco);
  };
  window.addEventListener("message", alRecibir);
  marco.srcdoc = `<!doctype html><html><head><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/app.css"></head><body><div id="c" class="content"></div><script type="module">window.__BASE_PATH__ = "../"; const { render } = await import("../js/views/calc-ocupacion-ductos.js"); const c = document.getElementById("c"); await render(c, {}); const ev = (s, v) => { const e = c.querySelector(s); e.value = v; e.dispatchEvent(new Event("change", { bubbles: true })); }; ev("#f-tipo", ${JSON.stringify(TIPO)}); ev("#f-nominal", ${JSON.stringify(TUBO.diametro_nominal)}); c.querySelector("#form-calc").requestSubmit(); parent.postMessage("listo", "*");<\/script></body></html>`;
  document.body.append(marco);
});

await seccion("vista: aspecto (barra de título, 16 px laterales y espaciado uniforme)", async () => {
  const medir = (marco) => {
    const d = marco.contentDocument;
    const izq = (e) => e.getBoundingClientRect().left;
    const sonda = d.createElement("div");
    d.body.append(sonda);
    const token = (v) => { sonda.style.backgroundColor = `var(${v})`; return d.defaultView.getComputedStyle(sonda).backgroundColor; };
    sonda.style.borderBottomColor = "color-mix(in srgb, var(--accent) 65%, var(--accent-soft))";
    const mezcla = d.defaultView.getComputedStyle(sonda).borderBottomColor;
    const suave = token("--accent-soft");
    const acento = token("--accent");
    sonda.remove();
    const cs = (e) => d.defaultView.getComputedStyle(e);
    const tarjetas = [...d.querySelectorAll(".form-section")];
    const res = d.querySelector("#resultado-wrap > .card");
    const panel = res.querySelector(".result-panel");
    const barras = tarjetas.map((card) => {
      const t = card.querySelector(".form-section-title");
      const rc = card.getBoundingClientRect();
      const rt = t.getBoundingClientRect();
      const svg = t.querySelector("svg");
      const ri = svg.getBoundingClientRect();
      return { llegaBordes: Math.abs(rt.left - (rc.left + 1)) <= 0.6 && Math.abs(rt.right - (rc.right - 1)) <= 0.6, arriba: rt.top - rc.top <= 1.6, fondo: cs(t).backgroundColor === suave, linea: cs(t).borderBottomColor === mezcla && cs(t).borderBottomWidth === "1px", icono: cs(svg).color === acento, centrado: Math.abs(ri.top + ri.height / 2 - (rt.top + (rt.height - 1) / 2)) <= 1, altura: Math.round(rt.height) };
    });
    const separaciones = tarjetas.map((card) => {
      const rects = [...card.querySelectorAll(".field")].filter((f) => f.getClientRects().length).map((f) => f.getBoundingClientRect());
      return rects.slice(1).map((r, i) => r.top - rects[i].bottom);
    });
    return {
      barras,
      separaciones,
      lateral: { tuberia: izq(tarjetas[0].querySelector("select, input")) - izq(tarjetas[0]), conductores: izq(tarjetas[1].querySelector("select, input")) - izq(tarjetas[1]), icono: izq(tarjetas[1].querySelector(".form-section-title svg")) - izq(tarjetas[1]), tabs: izq(res.querySelector(".tabs")) - izq(res), panel: izq(panel) - izq(res) },
    };
  };
  const angosto = await cargarMarco(600);
  const mAng = medir(angosto);
  angosto.remove();
  const ancho = await cargarMarco(1000);
  const mAnc = medir(ancho);
  ancho.remove();

  for (const [nombre, m] of [["600 px", mAng], ["1000 px", mAnc]]) {
    m.barras.forEach((b, i) => {
      const t = ["Tubería", "Conductores"][i];
      ok(b.llegaBordes && b.arriba && b.fondo && b.linea && b.icono && b.centrado, `ancho ${nombre}, «${t}»: barra de borde a borde con el color atenuado, línea 35 % menos intensa, icono en color pleno y centrado`);
    });
    ok(new Set(m.barras.map((b) => b.altura)).size === 1, `ancho ${nombre}: las barras tienen la misma altura`);
    const l = m.lateral;
    ok(Object.values(l).every((v) => v === 17), `ancho ${nombre}: 17 px del borde al contenido (1 + 16) en tarjetas, resultados y panel (${Object.values(l).join(", ")})`);
  }
  mAng.separaciones.forEach((s, i) => {
    ok(s.length >= 1 && s.every((v) => Math.abs(v - 16) <= 0.6), `ancho 600 px, tarjeta ${i + 1}: todos los campos a 16 px unos de otros (${s.map((v) => v.toFixed(0)).join(", ")})`);
  });
});

await seccion("vista: ayuda de los campos con botón de información", async () => {
  // etiquetas: con o sin boton deben medir lo mismo (todas las medidas juntas, antes de ok())
  const campos = $$("#form-calc .field").filter((f) => f.getClientRects().length && f.querySelector(":scope > label"));
  const medidas = campos.map((f) => {
    const label = f.querySelector(":scope > label");
    const control = f.querySelector("input, select");
    return { conInfo: !!label.querySelector(".info-btn"), alto: Math.round(label.getBoundingClientRect().height * 10) / 10, desfase: Math.round((control.getBoundingClientRect().top - f.getBoundingClientRect().top) * 10) / 10 };
  });
  ok(medidas.filter((m) => m.conInfo).length >= 3 && medidas.filter((m) => !m.conInfo).length >= 2, "se comparan campos con y sin botón de información");
  ok(new Set(medidas.map((m) => m.alto)).size === 1 && new Set(medidas.map((m) => m.desfase)).size === 1, `el botón no cambia la altura de las etiquetas ni la posición de las casillas (${[...new Set(medidas.map((m) => m.alto))].join(", ")} px)`);

  const botones = $$(".info-btn");
  const nombres = botones.map((b) => b.getAttribute("aria-label").replace("Más información sobre ", ""));
  ok(nombres.join("|") === "Diámetro interno de la tubería (mm)|Número de conductores|Diámetro del conductor (mm)|Nivel de aislamiento", `botones de información junto al nombre de: ${nombres.join(" | ")}`);
  ok(botones.every((b) => b.tagName === "BUTTON" && b.type === "button" && b.getAttribute("aria-expanded") === "false" && document.getElementById(b.getAttribute("aria-controls"))), "son botones reales, con aria-expanded y aria-controls");
  const b0 = botones[1];
  const campo = b0.closest(".field");
  const card = b0.closest(".card");
  const pop = document.getElementById(b0.getAttribute("aria-controls"));
  const antes = card.getBoundingClientRect().height;
  b0.click();
  const abierto = { oculto: pop.hidden, texto: texto(pop), abajo: pop.classList.contains("info-popover--abajo"), rp: pop.getBoundingClientRect(), rl: campo.querySelector("label").getBoundingClientRect(), card: card.getBoundingClientRect().height };
  b0.click();
  ok(!abierto.oculto && abierto.texto === "Cuántos conductores de este tipo van dentro del ducto.", `al pulsar el botón se abre el cuadro: «${abierto.texto}»`);
  ok(!abierto.abajo && abierto.rp.bottom <= abierto.rl.top + 0.5, "el cuadro se abre arriba de la etiqueta");
  ok(Math.abs(abierto.card - antes) < 0.5 && pop.hidden, "abrir el cuadro no mueve el formulario y un segundo clic lo cierra");
});

await seccion("service worker y otros archivos", async () => {
  const sw = await (await fetch("../sw.js")).text();
  const lista = [...sw.matchAll(/^\s*"([^"]+)",\s*$/gm)].map((m) => m[1]);
  ok(["js/calc/ocupacion-grupos.js", "js/calc/ocupacion-ductos.js", "js/views/calc-ocupacion-ductos.js", "js/util/info-campo.js", "js/util/resultados-ui.js"].every((f) => lista.includes(f)), "el service worker precachea los módulos que usa la pantalla");
  const existen = await Promise.all(lista.filter((f) => f !== "./").map((f) => fetch(`../${f}`, { method: "HEAD" }).then((r) => [f, r.ok])));
  const faltan = existen.filter(([, okk]) => !okk).map(([f]) => f);
  ok(faltan.length === 0, `todos los archivos del APP_SHELL existen${faltan.length ? ": " + faltan.join(", ") : ""}`);
  const tool = await (await fetch("../js/ai/tools.js")).text();
  ok(tool.includes('nombre: "calcular_ocupacion_ductos"') && tool.includes('from "../calc/ocupacion-grupos.js"') && !tool.includes('from "../calc/ocupacion-ductos.js"'), "la herramienta de la IA usa la lógica de varios tipos (ocupacion-grupos.js), que a su vez llama al motor original de ocupación sin cambios");
});

out.textContent += `\nRESULT: ${fallos ? "FAIL" : "OK"} (${total - fallos}/${total})\n`;
