<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>verify_perdidas</title>
<!--
  Pruebas de la pantalla de Pérdidas (js/views/calc-perdidas.js) y de su logica de varios tramos
  (js/calc/perdidas-tramos.js). Se ejecuta en el navegador, sin internet: la vista real se renderiza en un
  contenedor oculto y se maneja como lo haria una persona; los numeros se comparan con formulas escritas aqui
  de forma independiente (en kW, con otra forma algebraica que la del motor, que trabaja en MW).

  Uso (desde la raiz del proyecto):
    python -m http.server 8000
    abrir http://localhost:8000/tools/verify_perdidas.html   -> lista PASS/FAIL
  o en modo consola:
    msedge --headless --dump-dom --virtual-time-budget=15000 http://localhost:8000/tools/verify_perdidas.html
-->
<style>body{font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:12px}#stage{position:absolute;left:-9999px;width:1000px}</style>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<pre id="out"></pre>
<div id="stage"></div>
<script type="module">
window.__BASE_PATH__ = "../";
const out = document.getElementById("out");
let fallos = 0;
let total = 0;
function ok(cond, msg) {
  total++;
  if (!cond) fallos++;
  out.textContent += `${cond ? "PASS" : "FAIL"} ${msg}\n`;
}
function cerca(a, b, tol, msg) {
  ok(Math.abs(a - b) <= tol, `${msg} (obtenido ${a}, esperado ${b})`);
}
async function seccion(nombre, fn) {
  out.textContent += `\n== ${nombre}\n`;
  try {
    await fn();
  } catch (err) {
    fallos++;
    total++;
    out.textContent += `FAIL excepcion en "${nombre}": ${err && err.stack ? err.stack : err}\n`;
  }
}
const espera = (ms) => new Promise((r) => setTimeout(r, ms));

const motor = await import("../js/calc/perdidas.js");
const tr = await import("../js/calc/perdidas-tramos.js");
const desnudos = await (await fetch("../data/conductores-desnudos.json")).json();
const ACSR_4_0 = desnudos.find((c) => c.tipo === "ACSR" && c.calibre_awg_kcmil === "4/0");
const ACSR_1_0 = desnudos.find((c) => c.tipo === "ACSR" && c.calibre_awg_kcmil === "1/0");

// Formula independiente (en kW y con la otra forma algebraica): I = P/(V·fp·√3); % = √3·R·L·I·Fp / (10·V·fp)
function esperado({ V, Pmw, fp, fc, R, L }) {
  const I = (Pmw * 1000) / (V * fp * Math.sqrt(3));
  const Fp = 0.3 * fc + 0.7 * fc * fc;
  return { I, S: Pmw / fp, pct: (Math.sqrt(3) * R * L * I * Fp) / (10 * V * fp) };
}

await seccion("perdidas-tramos: logica", async () => {
  const base = { tensionLineaKv: 34.5, potenciaActivaMw: 19.9, factorPotencia: 0.9, factorCarga: 0.4 };
  const e1 = esperado({ V: 34.5, Pmw: 19.9, fp: 0.9, fc: 0.4, R: ACSR_4_0.r_ac_75c_ohm_km, L: 10 });

  const uno = tr.calcularPerdidasTramos(base, [{ resistenciaOhmKm: ACSR_4_0.r_ac_75c_ohm_km, longitudKm: 10, numConductoresPorFase: 1 }]);
  const directo = motor.calcularPerdidas({ ...base, resistenciaOhmKm: ACSR_4_0.r_ac_75c_ohm_km, longitudKm: 10 });
  ok(uno.perdidasPct === directo.perdidasPct && uno.corriente === directo.corriente && uno.potenciaS === directo.potenciaS && uno.potenciaQ === directo.potenciaQ, "un solo tramo: idéntico al motor original");
  cerca(uno.perdidasPct, e1.pct, 1e-9, "un solo tramo: % de pérdidas coincide con la fórmula independiente");
  cerca(uno.corriente, e1.I, 1e-9, "corriente coincide con la fórmula independiente");
  cerca(uno.perdidasMw, (e1.pct / 100) * 19.9, 1e-9, "pérdidas en MW = % · P");

  const dos = tr.calcularPerdidasTramos(base, [
    { resistenciaOhmKm: ACSR_4_0.r_ac_75c_ohm_km, longitudKm: 10, numConductoresPorFase: 1 },
    { resistenciaOhmKm: ACSR_1_0.r_ac_75c_ohm_km, longitudKm: 4, numConductoresPorFase: 1 },
  ]);
  const e2 = esperado({ V: 34.5, Pmw: 19.9, fp: 0.9, fc: 0.4, R: ACSR_1_0.r_ac_75c_ohm_km, L: 4 });
  cerca(dos.perdidasPct, e1.pct + e2.pct, 1e-9, "dos tramos: el % total es la suma de los % de cada tramo");
  cerca(dos.tramos[1].perdidasPct, e2.pct, 1e-9, "dos tramos: el % del segundo tramo coincide con la fórmula independiente");
  cerca(dos.perdidasMw, dos.tramos[0].perdidasMw + dos.tramos[1].perdidasMw, 1e-12, "pérdidas totales en MW = suma por tramo");
  ok(dos.corriente === uno.corriente && dos.potenciaS === uno.potenciaS && dos.potenciaQ === uno.potenciaQ, "corriente y potencias son las mismas con uno o varios tramos");

  const haz = tr.calcularPerdidasTramos(base, [{ resistenciaOhmKm: 0.4, longitudKm: 10, numConductoresPorFase: 2 }]);
  const sinHaz = tr.calcularPerdidasTramos(base, [{ resistenciaOhmKm: 0.4, longitudKm: 10, numConductoresPorFase: 1 }]);
  cerca(haz.tramos[0].resistenciaEfectivaOhmKm, 0.2, 1e-12, "2 conductores por fase: la resistencia efectiva es R/2");
  cerca(haz.perdidasPct, sinHaz.perdidasPct / 2, 1e-9, "2 conductores por fase: las pérdidas se reducen a la mitad");
  cerca(tr.calcularPerdidasTramos(base, [{ resistenciaOhmKm: 0.4, longitudKm: 10 }]).perdidasPct, sinHaz.perdidasPct, 1e-12, "sin indicar conductores por fase se asume 1");

  // dato de partida
  const V = 34.5, fp = 0.9;
  cerca(tr.potenciaActivaMw({ modo: "potencia", potenciaMw: 19.9, potenciaMva: 1, corrienteA: 1, tensionKv: V, factorPotencia: fp }), 19.9, 1e-12, "modo potencia activa: se usa tal cual");
  cerca(tr.potenciaActivaMw({ modo: "aparente", potenciaMva: 22.11, tensionKv: V, factorPotencia: fp }), 22.11 * 0.9, 1e-12, "modo potencia aparente: P = S·FP");
  const desdeI = tr.potenciaActivaMw({ modo: "corriente", corrienteA: 370, tensionKv: V, factorPotencia: fp });
  cerca(desdeI, (Math.sqrt(3) * 34.5 * 370 * 0.9) / 1000, 1e-12, "modo corriente: P = √3·V·I·FP / 1000");
  const ida = motor.calcularPerdidas({ ...base, potenciaActivaMw: desdeI, resistenciaOhmKm: 0.4, longitudKm: 10 });
  cerca(ida.corriente, 370, 1e-9, "ida y vuelta: con la P obtenida de 370 A el motor devuelve 370 A");
  const desdeS = tr.potenciaActivaMw({ modo: "aparente", potenciaMva: 22.11, tensionKv: V, factorPotencia: fp });
  cerca(motor.calcularPerdidas({ ...base, potenciaActivaMw: desdeS, resistenciaOhmKm: 0.4, longitudKm: 10 }).potenciaS, 22.11, 1e-9, "ida y vuelta: con la P obtenida de 22.11 MVA el motor devuelve 22.11 MVA");

  // referencias de diseño
  const c = (p) => tr.clasificarPerdidas(p).clave;
  ok(c(0.5) === "optimo" && c(1) === "optimo" && c(1.0001) === "aceptable" && c(3) === "aceptable" && c(3.0001) === "elevado", "etiquetas: ≤1 óptimo, ≤3 aceptable, >3 elevado");
  const etiquetas = [0.5, 2, 5].map((p) => tr.clasificarPerdidas(p).etiqueta);
  ok(etiquetas.join("|") === "Óptimo|Aceptable|Elevado", `textos de las etiquetas: ${etiquetas.join(" | ")} (por encima de 3 % dice «Elevado»)`);
  ok(!/norma/i.test(etiquetas.join(" ")), "ninguna etiqueta dice «norma»");

  // sugerencia de calibre
  const cand = [10, 6, 4, 3.5, 2.9, 2, 1.5, 1, 0.8].map((p, i) => ({ calibre: `c${i}`, area: i + 1, perdidasPct: p }));
  const s = tr.sugerirCalibre(cand, 3);
  ok(s.sugerido.calibre === "c4" && s.ventana.map((x) => x.calibre).join() === "c1,c2,c3,c4,c5,c6", "sugiere el primer calibre ≤ 3 % y una ventana de 3 a cada lado");
  const n = tr.sugerirCalibre(cand.map((x) => ({ ...x, perdidasPct: 5 + x.area })), 3);
  ok(n.sugerido === null && n.menor.calibre === "c0" && n.ventana.map((x) => x.calibre).join() === "c6,c7,c8", "si ninguno cumple: sin sugerido, indica el de menores pérdidas y muestra los últimos");
  ok(tr.sugerirCalibre(cand.map((x) => ({ ...x, perdidasPct: 0.5 })), 3).ventana.map((x) => x.calibre).join() === "c0,c1,c2", "si el primero ya cumple, la ventana no se sale del inicio");
  ok(tr.sugerirCalibre(cand, 3, 3, "c8").ventana.map((x) => x.calibre).join() === "c1,c2,c3,c4,c5,c6,c8", "el calibre actual siempre aparece, en su lugar por área, aunque quede fuera de la ventana");
  ok(tr.sugerirCalibre(cand, 3, 3, "c3").ventana.map((x) => x.calibre).join() === "c1,c2,c3,c4,c5,c6", "si el actual ya está en la ventana no se duplica");
});

const stage = document.getElementById("stage");
const $ = (s, r = stage) => r.querySelector(s);
const $$ = (s, r = stage) => [...r.querySelectorAll(s)];
const poner = (sel, v, ev = "input") => { const e = $(sel); e.value = v; e.dispatchEvent(new Event(ev, { bubbles: true })); };
const elegir = (sel, v) => poner(sel, v, "change");
const texto = (e) => (e ? e.textContent.replace(/\s+/g, " ").trim() : "");
const metrica = (etiqueta) => $$(".result-metric").find((m) => texto($(".label", m)).startsWith(etiqueta));
const valorDe = (etiqueta) => parseFloat(texto($(".value", metrica(etiqueta))));

const { render } = await import("../js/views/calc-perdidas.js");
await render(stage, {});

await seccion("vista: tarjetas y dato de partida", async () => {
  const titulos = $$(".form-section-title").map(texto);
  ok($$(".card.form-section").length === 2 && titulos[0].includes("Datos de la línea") && titulos[1].includes("Conductor tramo 1"), `dos tarjetas: «${titulos.join("» y «")}»`);
  ok($$(".form-section-title").every((t) => t.querySelector("svg.icon")), "cada título lleva su icono");
  ok($$(".form-section-title").every((t) => t.parentElement.classList.contains("card")), "los títulos van dentro de tarjetas");
  ok($(".btn-tramo-quitar").hidden, "con un solo tramo no aparece «Quitar»");
  ok($$(".btn-row .btn").some((b) => texto(b).includes("Agregar tramo")) && !$(".tramo-block .btn-agregar-tramo"), "«Agregar tramo» está junto a «Calcular» (a su derecha), fuera de las tarjetas");

  const visible = () => ["#wrap-potencia", "#wrap-aparente", "#wrap-corriente"].filter((s) => !$(s).hidden).join();
  ok(visible() === "#wrap-potencia" && $("#f-potencia").required && !$("#f-aparente").required, "por defecto: potencia activa (MW) visible y obligatoria");
  elegir("#f-modo", "aparente");
  ok(visible() === "#wrap-aparente" && $("#f-aparente").required && !$("#f-potencia").required, "potencia aparente: solo ese campo, y obligatorio");
  elegir("#f-modo", "corriente");
  ok(visible() === "#wrap-corriente" && $("#f-corriente").required && !$("#f-aparente").required, "corriente: solo ese campo, y obligatorio");
  elegir("#f-modo", "potencia");
  ok(visible() === "#wrap-potencia", "se puede volver a potencia activa");
  ok(texto($("#wrap-potencia label")).includes("MW") && texto($("#wrap-aparente label")).includes("MVA") && texto($("#wrap-corriente label")).includes("(A)"), "unidades: MW, MVA y A");
});

await seccion("vista: aspecto de las tarjetas", async () => {
  const sonda = document.createElement("div");
  stage.append(sonda);
  const resolver = (variable) => { sonda.style.backgroundColor = `var(${variable})`; return getComputedStyle(sonda).backgroundColor; };
  const suave = resolver("--accent-soft");
  const acento = resolver("--accent");
  sonda.style.borderBottomColor = "color-mix(in srgb, var(--accent) 65%, var(--accent-soft))";
  const mezcla = getComputedStyle(sonda).borderBottomColor;
  sonda.remove();
  ok(suave !== acento && suave !== "rgba(0, 0, 0, 0)", `colores del tema resueltos (${suave} / ${acento})`);

  const titulos = $$(".form-section-title");
  // Ojo: el contenedor de pruebas se desplaza cuando #out crece, asi que TODAS las medidas se toman antes de llamar a ok().
  const medidas = titulos.map((t) => {
    const card = t.closest(".card");
    const svg = t.querySelector("svg.icon");
    const cs = getComputedStyle(t);
    return {
      nombre: texto(t).replace("Quitar", "").trim(),
      rc: card.getBoundingClientRect(),
      rt: t.getBoundingClientRect(),
      ri: svg.getBoundingClientRect(),
      rTexto: t.querySelector(".tramo-titulo")?.getBoundingClientRect(),
      fondo: cs.backgroundColor,
      lineaColor: cs.borderBottomColor,
      lineaGrosor: cs.borderBottomWidth,
      colorIcono: getComputedStyle(svg).color,
      // fin del contenido: el ultimo elemento de la tarjeta (el «Agregar tramo» ya no esta dentro: va junto a «Calcular»)
      ultimoCampo: card.lastElementChild.getBoundingClientRect().bottom,
      tieneBoton: !!card.querySelector(".btn-agregar-tramo"),
    };
  });
  for (const m of medidas) {
    const { nombre, rc, rt, ri, rTexto } = m;
    const centroBarra = rt.top + (rt.height - 1) / 2; // descontando la linea inferior
    ok(Math.abs(rt.left - (rc.left + 1)) <= 0.6 && Math.abs(rt.right - (rc.right - 1)) <= 0.6, `«${nombre}»: la barra llega de borde a borde de la tarjeta`);
    ok(rt.top - rc.top <= 1.6, `«${nombre}»: la barra queda arriba, pegada al borde superior de la tarjeta`);
    ok(m.fondo === suave, `«${nombre}»: fondo con el color atenuado del tema`);
    ok(m.lineaGrosor === "1px" && m.lineaColor === mezcla && m.lineaColor !== acento, `«${nombre}»: línea inferior de 1px con el color del tema y 35 % menos de intensidad (${m.lineaColor})`);
    ok(m.colorIcono === acento, `«${nombre}»: el icono lleva el color pleno del tema`);
    ok(Math.abs(ri.top + ri.height / 2 - centroBarra) <= 1, `«${nombre}»: icono centrado verticalmente en la barra (${(ri.top + ri.height / 2 - centroBarra).toFixed(1)} px)`);
    if (rTexto) ok(Math.abs(rTexto.top + rTexto.height / 2 - centroBarra) <= 1.5, `«${nombre}»: texto centrado verticalmente en la barra (${(rTexto.top + rTexto.height / 2 - centroBarra).toFixed(1)} px)`);
    const espacio = rc.bottom - m.ultimoCampo;
    ok(espacio >= 8 && espacio <= 14, `«${nombre}»: margen compacto bajo el último elemento (${espacio.toFixed(0)} px)`);
    ok(!m.tieneBoton, `«${nombre}»: el botón «Agregar tramo» ya no está dentro de la tarjeta`);
  }
  ok(new Set(medidas.map((m) => Math.round(m.rt.height))).size === 1, "todas las barras de título tienen la misma altura");
  const iconos = titulos.map((t) => t.querySelector("svg.icon"));
  ok(iconos[0].querySelector("path").getAttribute("d").startsWith("M5 12a7 7 0 1 0 14 0") && iconos[1].querySelectorAll("g circle").length === 7 && iconos[1].querySelectorAll(":scope > circle").length === 1, "iconos: voltímetro de Tabler (línea) y conductor cableado, aro con 7 hilos (conductor)");
  const agregar = $$(".btn-agregar-tramo")[0];
  ok(texto(agregar) === "Agregar tramo", `el botón dice «${texto(agregar)}»`);
  const calcular = $("#form-calc button[type=submit]");
  const ra = agregar.getBoundingClientRect(), rcalc = calcular.getBoundingClientRect();
  const finCard = Math.max(...$$(".tramo-block").map((c) => c.getBoundingClientRect().bottom));
  ok(!agregar.closest(".card") && agregar.parentElement === calcular.parentElement && agregar.previousElementSibling === calcular, "«Agregar tramo» va en la misma fila que «Calcular», justo después (a su derecha) y fuera de las tarjetas");
  const rFila = calcular.parentElement.getBoundingClientRect();
  ok(ra.left > rcalc.right && Math.abs(ra.right - rFila.right) <= 1 && Math.abs(ra.top - rcalc.top) <= 1 && Math.abs(ra.height - rcalc.height) <= 1, `«Agregar tramo» mide lo mismo que «Calcular» y queda justificado a la derecha de la línea (${Math.round(rFila.right - ra.right)} px del borde derecho, alto ${Math.round(ra.height)} y ${Math.round(rcalc.height)})`);
  ok(ra.top > finCard, "y queda debajo de la última tarjeta");
});

// La pantalla se prueba tambien dentro de un iframe de ancho fijo: las media queries dependen del ancho de la ventana, no del contenedor.
const cargarMarco = (ancho, calcular = false, alto = 3000) => new Promise((resolve) => {
  const marco = document.createElement("iframe");
  marco.style.cssText = `position:fixed;left:-99999px;top:0;width:${ancho}px;height:${alto}px;border:0`;
  const alRecibir = (e) => {
    if (e.source !== marco.contentWindow || e.data !== "listo") return;
    window.removeEventListener("message", alRecibir);
    resolve(marco);
  };
  window.addEventListener("message", alRecibir);
  marco.srcdoc = `<!doctype html><html><head><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/app.css"></head><body><div id="c" class="content"></div><script type="module">window.__BASE_PATH__ = "../"; const { render } = await import("../js/views/calc-perdidas.js"); await render(document.getElementById("c"), {}); if (${calcular}) { const c = document.getElementById("c"); const ev = (s, v) => { const e = c.querySelector(s); e.value = v; e.dispatchEvent(new Event("change", { bubbles: true })); }; ev("#f-material-0", "ACSR"); ev("#f-calibre-0", "4/0"); c.querySelector("#form-calc").requestSubmit(); } parent.postMessage("listo", "*");<\/script></body></html>`;
  document.body.append(marco);
});

await seccion("vista: espaciado uniforme entre campos (pantalla angosta y ancha)", async () => {
  // Separacion vertical entre campos consecutivos de la misma tarjeta, medida dentro del iframe (todas las medidas antes de ok()).
  const separaciones = (marco) => {
    const d = marco.contentDocument;
    const porTarjeta = new Map();
    for (const f of d.querySelectorAll("#form-calc .field")) {
      if (!f.getClientRects().length) continue; // campos ocultos (p. ej. potencia aparente y corriente)
      const card = f.closest(".card");
      porTarjeta.set(card, [...(porTarjeta.get(card) || []), f.getBoundingClientRect()]);
    }
    return [...porTarjeta.values()].map((rects) => rects.slice(1).map((r, i) => r.top - rects[i].bottom));
  };
  const columnas = (marco) => marco.contentDocument.querySelector("#form-calc .grid-2").ownerDocument.defaultView.getComputedStyle(marco.contentDocument.querySelector("#form-calc .grid-2")).gridTemplateColumns.split(" ").length;

  const angosto = await cargarMarco(600);
  const sepAngosto = separaciones(angosto);
  const colAngosto = columnas(angosto);
  angosto.remove();
  const ancho = await cargarMarco(1000);
  const sepAncho = separaciones(ancho);
  const colAncho = columnas(ancho);
  ancho.remove();

  ok(colAngosto === 1, `ancho 600 px: los campos pasan a una sola columna (${colAngosto})`);
  sepAngosto.forEach((s, i) => {
    ok(s.length >= 3 && s.every((v) => Math.abs(v - 16) <= 0.6), `ancho 600 px, tarjeta ${i + 1}: todos los campos quedan a 16 px unos de otros (${s.map((v) => v.toFixed(0)).join(", ")})`);
  });
  ok(colAncho === 2, `ancho 1000 px: se mantienen las dos columnas (${colAncho})`);
  sepAncho.forEach((s, i) => {
    ok(s.every((v) => v >= 15.4 || v < 0), `ancho 1000 px, tarjeta ${i + 1}: sin cambios en el espaciado entre filas`);
  });
});

await seccion("vista: espacio lateral de 16 px en las tarjetas y el panel de resultados", async () => {
  // Distancias horizontales (borde exterior de la tarjeta → contenido) medidas dentro del iframe, a ancho angosto y ancho.
  const medir = (marco) => {
    const d = marco.contentDocument;
    const izq = (e) => e.getBoundingClientRect().left;
    const tarjeta = d.querySelector(".tramo-block");
    const datos = d.querySelector(".form-section");
    const res = d.querySelector("#resultado-wrap > .card");
    const panel = res.querySelector(".result-panel");
    const sondaCard = d.createElement("div");
    sondaCard.className = "card";
    const sondaPanel = d.createElement("div");
    sondaPanel.className = "result-panel";
    d.body.append(sondaCard, sondaPanel); // una .card y un .result-panel "normales", como los de otras calculadoras
    const r = {
      tramoACampo: izq(tarjeta.querySelector("select, input")) - izq(tarjeta),
      datosACampo: izq(datos.querySelector("select, input")) - izq(datos),
      tramoAIcono: izq(tarjeta.querySelector(".form-section-title svg")) - izq(tarjeta),
      datosAIcono: izq(datos.querySelector(".form-section-title svg")) - izq(datos),
      resATabs: izq(res.querySelector(".tabs")) - izq(res),
      resAPanel: izq(panel) - izq(res),
      panelATexto: izq(panel.querySelector(".result-metric .value")) - izq(panel),
      panelAEtiqueta: izq(panel.querySelector(".result-metric .label")) - izq(panel),
      cardNormal: getComputedStyle(sondaCard).paddingLeft,
      panelNormal: getComputedStyle(sondaPanel).paddingLeft,
    };
    sondaCard.remove();
    sondaPanel.remove();
    return r;
  };
  const angosto = await cargarMarco(600, true);
  const mAng = medir(angosto);
  angosto.remove();
  const ancho = await cargarMarco(1000, true);
  const mAnc = medir(ancho);
  ancho.remove();
  for (const [nombre, m] of [["600 px", mAng], ["1000 px", mAnc]]) {
    ok(m.tramoACampo === 17 && m.datosACampo === 17, `ancho ${nombre}: tarjetas de datos y de conductor: del borde de la tarjeta al campo 17 px (1 de borde + 16 de relleno) (${m.datosACampo} y ${m.tramoACampo})`);
    ok(m.resATabs === 17 && m.resAPanel === 17, `ancho ${nombre}: tarjeta de resultados: del borde a las pestañas y al panel 17 px (${m.resATabs} y ${m.resAPanel})`);

await seccion("vista: color de la fila sugerida en cada tema", async () => {
  const html = document.documentElement;
  const previo = html.getAttribute("data-theme");
  const rgb = (c) => {
    const n = c.match(/[\d.]+/g).map(Number).slice(0, 3);
    return c.startsWith("color(") ? n.map((v) => v * 255) : n; // "rgb(r, g, b)" o "color(srgb r g b)"
  };
  const brillo = (c) => rgb(c).reduce((a, b) => a + b, 0);
  // Todas las medidas de un tema se toman juntas (sin ok() en medio) y luego se restaura el tema.
  const medir = (tema) => {
    html.setAttribute("data-theme", tema);
    const sonda = document.createElement("div");
    stage.append(sonda);
    const token = (v) => { sonda.style.backgroundColor = `var(${v})`; return getComputedStyle(sonda).backgroundColor; };
    const r = {
      fila: getComputedStyle($(".tabla-resultado tr.match-row")).backgroundColor,
      panel: getComputedStyle($(".result-panel")).backgroundColor,
      tabla: getComputedStyle($(".tabla-resultado")).backgroundColor,
      exito: token("--success-soft"),
      acentoSuave: token("--accent-soft"),
      bordeTarjeta: getComputedStyle($(".card.tarjeta-borde")).borderTopColor,
      bordeTablas: token("--table-border"),
      bordeNormal: token("--border"),
    };
    sonda.remove();
    return r;
  };
  const claro = medir("light");
  const oscuro = medir("dark");
  if (previo === null) html.removeAttribute("data-theme");
  else html.setAttribute("data-theme", previo);

  ok($$(".card").length >= 3 && $$(".card").every((c) => c.classList.contains("tarjeta-borde")), "todas las tarjetas de la pantalla (datos, tramos y resultados) llevan el borde marcado");
  ok(claro.bordeTarjeta === claro.bordeTablas && claro.bordeTarjeta !== claro.bordeNormal, `tema claro: las tarjetas usan el borde marcado de las tablas, no el tenue de antes (${claro.bordeTarjeta} en vez de ${claro.bordeNormal})`);
  ok(oscuro.bordeTarjeta === oscuro.bordeNormal, `tema oscuro: el borde de las tarjetas no cambia (${oscuro.bordeTarjeta})`);
  ok(claro.fila === claro.exito, `tema claro: la fila sugerida conserva el verde suave (${claro.fila})`);
  const [r, g, b] = rgb(oscuro.fila);
  ok(oscuro.fila !== oscuro.exito && b > g && g > r, `tema oscuro: la fila sugerida ya no es verde, es azul (${oscuro.fila})`);
  ok(brillo(oscuro.fila) >= brillo(oscuro.panel) + 30, `tema oscuro: es más clara que el azul del panel de resultados (${oscuro.fila} frente a ${oscuro.panel})`);
  ok(oscuro.fila !== oscuro.panel && oscuro.fila !== oscuro.tabla, "tema oscuro: no se confunde con el panel ni con el fondo de la tabla");
  ok(brillo(oscuro.fila) < 400, "tema oscuro: sigue siendo un tono oscuro (el texto claro se lee bien)");
});

await seccion("vista: estructura del reporte (se copia y se pega)", async () => {
  const leer = () => { $("#form-calc").requestSubmit(); return $('[data-panel="reporte"] .report-block').textContent.split("\n"); };
  const LINEA = /^-{30}$/;
  const etiquetasEn = (l) => l.filter((x) => /^[A-ZÁÉÍÓÚÑ ]{4,}:?$/.test(x));
  const secciones = (l) => {
    const iRes = l.indexOf("RESULTADOS:");
    return { iRes, params: l.slice(5, iRes - 2), res: l.slice(iRes + 2) };
  };
  const tiene = (l, inicio) => l.some((x) => x.trim().startsWith(inicio));

  // --- un tramo, partiendo de la potencia activa
  elegir("#f-modo", "potencia");
  const a = leer();
  const sa = secciones(a);
  ok(a[0] === "CÁLCULO DE PÉRDIDAS" && a[1] === "" && a[2] === "", "primera etiqueta: «CÁLCULO DE PÉRDIDAS», seguida de dos líneas en blanco");
  ok(a[3] === "PARÁMETROS DE ENTRADA:" && LINEA.test(a[4]), "segunda etiqueta: «PARÁMETROS DE ENTRADA:» (con dos puntos) y la línea divisoria DEBAJO");
  ok(sa.iRes > 5 && a[sa.iRes - 1] === "" && a[sa.iRes - 2] === "" && LINEA.test(a[sa.iRes + 1]), "tercera etiqueta: «RESULTADOS:» (con dos puntos), dos líneas en blanco antes y la línea divisoria DEBAJO");
  ok(!LINEA.test(a[3]) && !LINEA.test(a[sa.iRes - 1]) && !LINEA.test(a[5]) && !LINEA.test(a[sa.iRes + 2]), "encima de las etiquetas no hay línea divisoria y debajo de la línea sigue directamente el contenido");
  ok(etiquetasEn(a).join("|") === "CÁLCULO DE PÉRDIDAS|PARÁMETROS DE ENTRADA:|RESULTADOS:" && a.filter((x) => LINEA.test(x)).length === 2, "son exactamente tres etiquetas y dos líneas divisorias");
  ok(a[sa.iRes + 2].startsWith("Factor de pérdidas (Fp = 0.3·Fc + 0.7·Fc²): 0.2320"), `el resultado arranca con el factor de pérdidas (${a[sa.iRes + 2]})`);
  // negrita: las tres etiquetas van en <strong> y el texto copiado no cambia
  const negritas = $$('[data-panel="reporte"] .report-block strong');
  const pesos = negritas.map((e) => parseInt(getComputedStyle(e).fontWeight, 10));
  ok(negritas.map((e) => e.textContent).join("|") === "CÁLCULO DE PÉRDIDAS|PARÁMETROS DE ENTRADA:|RESULTADOS:" && pesos.every((w) => w >= 700), `las tres etiquetas están en negrita (${pesos.join(", ")}) y solo ellas`);
  ok($('[data-panel="reporte"] .report-block').textContent.split("\n")[3] === "PARÁMETROS DE ENTRADA:", "el texto que se copia no lleva marcas de formato");
  for (const inicio of ["Tensión de línea", "Dato de partida", "Potencia activa", "Factor de potencia", "Factor de carga", "Tramo 1:", "Tipo de red", "Material/Tipo", "Calibre", "Resistencia AC a 75°C", "Conductores por fase", "Longitud del tramo"]) {
    ok(tiene(sa.params, inicio), `parámetros de entrada incluye «${inicio}»`);
  }
  for (const inicio of ["Factor de pérdidas", "Resistencia efectiva", "Porcentaje de pérdidas", "Pérdidas del tramo", "Pérdidas por efecto Joule", "Corriente", "Potencia aparente", "Potencia reactiva"]) {
    ok(!tiene(sa.params, inicio), `«${inicio}» NO está en los parámetros (es un resultado)`);
  }
  for (const inicio of ["Factor de pérdidas", "Corriente", "Potencia aparente", "Potencia reactiva", "Tramo 1:", "Resistencia efectiva", "Porcentaje de pérdidas del tramo", "Pérdidas del tramo", "Porcentaje de pérdidas:", "Pérdidas por efecto Joule"]) {
    ok(tiene(sa.res, inicio), `resultados incluye «${inicio}»`);
  }
  ok(!tiene(sa.res, "Tensión de línea") && !tiene(sa.res, "Calibre") && !tiene(sa.res, "Longitud del tramo"), "los datos de entrada no se repiten en los resultados");

  // --- partiendo de la potencia aparente: la potencia activa se calcula, asi que va en resultados
  elegir("#f-modo", "aparente");
  poner("#f-aparente", "22.11");
  const b = leer();
  const sb = secciones(b);
  ok(tiene(sb.params, "Dato de partida: Potencia aparente (22.11 MVA)") && !tiene(sb.params, "Potencia activa:"), "desde potencia aparente: en los parámetros solo el dato de partida");
  ok(tiene(sb.res, "Potencia activa: 19.90 MW"), "desde potencia aparente: la potencia activa calculada va en los resultados");
  ok(etiquetasEn(b).length === 3, "sigue habiendo tres etiquetas");
  elegir("#f-modo", "corriente");
  poner("#f-corriente", "370");
  const c = leer();
  const sc = secciones(c);
  ok(tiene(sc.params, "Dato de partida: Corriente (370.00 A)") && !tiene(sc.params, "Potencia activa:") && tiene(sc.res, "Potencia activa: 19.90 MW"), "desde corriente: igual, la potencia activa va en los resultados");
  elegir("#f-modo", "potencia");

  // --- dos tramos: cada tramo aparece en los parametros (lo que se dio) y en los resultados (lo que se calculó)
  $$(".btn-agregar-tramo")[0].click();
  const nueva = $$(".tramo-block").at(-1);
  const sel = (p) => nueva.querySelector(`select[id^="${p}"]`);
  sel("f-material-").value = "AAAC";
  sel("f-material-").dispatchEvent(new Event("change", { bubbles: true }));
  sel("f-calibre-").selectedIndex = 4;
  sel("f-calibre-").dispatchEvent(new Event("change", { bubbles: true }));
  const d = leer();
  const sd = secciones(d);
  ok(etiquetasEn(d).length === 3 && d.filter((x) => LINEA.test(x)).length === 2, "con dos tramos siguen siendo tres etiquetas y dos líneas");
  ok(sd.params.filter((x) => /^Tramo \d:$/.test(x)).join() === "Tramo 1:,Tramo 2:" && sd.res.filter((x) => /^Tramo \d:$/.test(x)).join() === "Tramo 1:,Tramo 2:", "los dos tramos aparecen en los parámetros y en los resultados");
  ok(sd.params.filter((x) => x.includes("Longitud del tramo")).length === 2 && sd.res.filter((x) => x.includes("Porcentaje de pérdidas del tramo")).length === 2, "cada tramo: su longitud en los parámetros y su % de pérdidas en los resultados");
  ok(tiene(sd.res, "Porcentaje de pérdidas total:") && d.at(-1).startsWith("Pérdidas por efecto Joule:"), "el reporte termina con el % total y las pérdidas de potencia");
  ok(sd.res.indexOf(sd.res.find((x) => x.startsWith("Porcentaje de pérdidas total"))) > sd.res.lastIndexOf("Tramo 2:"), "los totales van después del detalle de los tramos");
});

  ok(!caja.hidden && cc.display !== "none", "las fórmulas se muestran dentro de una subtarjeta");
  ok(cc.backgroundColor === cr.backgroundColor && cc.borderTopColor === cr.borderTopColor && cc.borderTopWidth === cr.borderTopWidth && cc.borderTopLeftRadius === cr.borderTopLeftRadius, `la subtarjeta tiene el fondo, borde y esquinas de la caja de Reporte (${cc.backgroundColor}, ${cc.borderTopLeftRadius})`);
  ok(cc.fontFamily !== cr.fontFamily && !cc.fontFamily.toLowerCase().includes("mono"), "la subtarjeta usa la letra normal (no la monoespaciada del reporte) para que KaTeX se vea bien");
  ok(dentro && ecuacionesEnCaja, "las 10 ecuaciones, los títulos y las notas quedan dentro de la subtarjeta");
  const lineaSec = $$("#formulas-katex > .result-subhead")[1];
  const sondaLinea = document.createElement("div");
  document.body.append(sondaLinea);
  sondaLinea.style.backgroundColor = "var(--table-border)";
  const colorTabla = getComputedStyle(sondaLinea).backgroundColor;
  sondaLinea.remove();
  ok(getComputedStyle(lineaSec).borderTopColor === colorTabla && getComputedStyle(lineaSec).borderTopColor !== getComputedStyle(caja).backgroundColor && parseFloat(getComputedStyle(lineaSec).borderTopWidth) >= 1, "la línea que separa las secciones de las fórmulas usa el borde marcado de las tablas (se ve también en el tema claro)");
  ok(primerTitulo.borderTopWidth === "0px", "el primer título no repite una línea sobre el borde de la subtarjeta");
  // Descripcion de las etiquetas: subtitulo + lista con viñetas (ya no una linea corrida)
  const subtitulos = $$("#formulas-katex > .result-subhead").map(texto);
  const items = $$("#formulas-katex ul.formula-etiquetas > li");
  const listaCS = getComputedStyle($("#formulas-katex ul.formula-etiquetas"));
  ok(subtitulos.includes("Descripción de las variables") && subtitulos.at(-1) === "Notas" && subtitulos.length === 5, `subtítulos de la subtarjeta: ${subtitulos.join(" | ")}`);
  // Linea divisoria entre la descripcion de las etiquetas y las notas: el subtitulo «Notas» (con su linea superior) va entre la lista y el texto.
  const tituloNotas = [...$$("#formulas-katex > .result-subhead")].find((e) => texto(e) === "Notas");
  const listaEt = $("#formulas-katex ul.formula-etiquetas");
  const notas = $("#formulas-katex > p.formula-vars");
  const rl = listaEt.getBoundingClientRect();
  const rt2 = tituloNotas.getBoundingClientRect();
  const rn = notas.getBoundingClientRect();
  const cn = getComputedStyle(tituloNotas);
  const ancho = $("#formulas-katex").getBoundingClientRect();
  ok(tituloNotas.previousElementSibling === listaEt && tituloNotas.nextElementSibling === notas, "el subtítulo «Notas» queda entre la lista de etiquetas y las notas");
  ok(rl.bottom <= rt2.top && rt2.bottom <= rn.top, "orden vertical: lista de etiquetas, línea y subtítulo «Notas», y luego las notas");
  ok(cn.borderTopWidth === "1px" && cn.borderTopStyle === "solid" && cn.borderTopColor === getComputedStyle($$("#formulas-katex > .result-subhead")[1]).borderTopColor, "«Notas» lleva la misma línea divisoria que los otros subtítulos");
  ok(rt2.left <= ancho.left + 17 && rt2.right >= ancho.right - 17, "la línea divisoria abarca todo el ancho útil de la subtarjeta");
  ok(rn.top - rt2.bottom <= 14, `las notas quedan pegadas a su subtítulo (${(rn.top - rt2.bottom).toFixed(0)} px)`);
  ok(items.length === 15 && listaCS.listStyleType === "disc", `la descripción es una lista con viñetas de ${items.length} etiquetas (${listaCS.listStyleType})`);
  ok(items.every((li) => li.querySelector(".formula-simbolo .katex") && texto(li.lastElementChild).length > 3), "cada viñeta lleva el símbolo dibujado con KaTeX y su descripción");
  ok(!texto($("#formulas-katex")).includes("P: potencia activa [MW] ·"), "ya no queda la línea corrida con puntos medios");
  const textoItems = items.map((li) => texto(li.lastElementChild));
  ok(["Potencia activa [MW]", "Potencia aparente [MVA]", "Tensión de línea [kV]", "Factor de pérdidas", "Resistencia efectiva del tramo [Ω/km]", "Pérdidas de potencia [MW]"].every((t) => textoItems.includes(t)), "las descripciones incluyen las magnitudes con sus unidades");
  const ul = $("#formulas-katex ul.formula-etiquetas").getBoundingClientRect();
  const rcaja = $("#formulas-katex").getBoundingClientRect();
  ok(ul.left >= rcaja.left && ul.right <= rcaja.right + 0.5, "la lista queda dentro de la subtarjeta");
  const izq = items.map((li) => li.lastElementChild.getBoundingClientRect().left);
  ok(Math.max(...izq) - Math.min(...izq) < 1, `los textos de todas las viñetas quedan alineados (dispersión ${(Math.max(...izq) - Math.min(...izq)).toFixed(1)} px)`);
  ok($$("#formulas-katex .katex-display").length === 10, "las ecuaciones se muestran en modo display");
  ok(texto($("#formulas-katex")).includes("Dato de partida") && texto($("#formulas-katex")).includes("Buller-Woodrow"), "incluye los títulos y la nota de fidelidad");
  ok(!!document.querySelector('link[href$="vendor/katex/katex.min.css"]'), "se cargó la hoja de estilos local de KaTeX");
  const fuentesOk = await Promise.all(["KaTeX_Main-Regular", "KaTeX_Math-Italic", "KaTeX_Size2-Regular"].map((f) => fetch(`../vendor/katex/fonts/${f}.woff2`).then((r) => r.ok)));
  ok(fuentesOk.every(Boolean), "las fuentes locales de KaTeX existen");
});

await seccion("vista: el botón de información no altera la altura de las etiquetas", async () => {
  // Todas las medidas juntas, antes de ok(). Cada campo: alto de su etiqueta y distancia del borde superior del campo a su casilla.
  const campos = $$("#form-calc .field").filter((f) => f.getClientRects().length && f.querySelector(":scope > label"));
  const medidas = campos.map((f) => {
    const label = f.querySelector(":scope > label");
    const control = f.querySelector("input, select");
    return { nombre: texto(label), conInfo: !!label.querySelector(".info-btn"), alto: Math.round(label.getBoundingClientRect().height * 10) / 10, desfase: Math.round((control.getBoundingClientRect().top - f.getBoundingClientRect().top) * 10) / 10 };
  });
  const conInfo = medidas.filter((m) => m.conInfo);
  const sinInfo = medidas.filter((m) => !m.conInfo);
  const altos = [...new Set(medidas.map((m) => m.alto))];
  const desfases = [...new Set(medidas.map((m) => m.desfase))];
  ok(conInfo.length >= 2 && sinInfo.length >= 3, `se comparan ${conInfo.length} campos con botón de información y ${sinInfo.length} sin él`);
  ok(altos.length === 1, `todas las etiquetas miden lo mismo, con o sin botón (${altos.join(", ")} px)`);
  ok(desfases.length === 1, `todas las casillas empiezan a la misma distancia bajo su nombre (${desfases.join(", ")} px)`);
});

await seccion("vista: ayuda de los campos con botón de información", async () => {
  const tramosN = $$(".tramo-block").length;
  const ESPERADOS = ["Factor de carga (Fc)", ...Array(tramosN).fill("Conductores por fase")];
  const botones = $$(".info-btn");
  const nombres = botones.map((b) => b.getAttribute("aria-label").replace("Más información sobre ", ""));
  ok(nombres.join("|") === ESPERADOS.join("|"), `botones de información junto al nombre de: ${nombres.join(" | ")}`);
  ok($$(".hint").length === 0, "ya no quedan textos de ayuda fijos debajo de los campos");
  ok(botones.every((b) => b.tagName === "BUTTON" && b.type === "button" && b.tabIndex >= 0 && b.getAttribute("aria-expanded") === "false" && document.getElementById(b.getAttribute("aria-controls"))), "son botones reales (se llegan con Tab), con aria-expanded y aria-controls");
  ok(new Set(botones.map((b) => b.getAttribute("aria-controls"))).size === botones.length, "cada botón controla su propio cuadro (ids únicos)");
  ok(botones.every((b) => b.querySelector('svg path[d^="M3 12a9 9 0 1 0 18 0"]') && b.closest("label") && !texto(b.closest("label")).includes("Más información")), "el botón lleva el icono info-circle de Tabler y el nombre visible del campo no cambia");

  // Todas las medidas de una accion se toman juntas (el contenedor de pruebas se desplaza cuando crece #out).
  const b0 = botones.at(-1);
  const campo = b0.closest(".field");
  const card = b0.closest(".card");
  const pop = document.getElementById(b0.getAttribute("aria-controls"));
  const antes = { card: card.getBoundingClientRect().height, campo: campo.getBoundingClientRect().height, input: campo.querySelector("input").getBoundingClientRect().top - campo.getBoundingClientRect().top };
  b0.click();
  const abierto = {
    oculto: pop.hidden, exp: b0.getAttribute("aria-expanded"), texto: texto(pop), info: campo.querySelector("label").dataset.info,
    pos: getComputedStyle(pop).position, z: getComputedStyle(pop).zIndex, abajo: pop.classList.contains("info-popover--abajo"),
    rp: pop.getBoundingClientRect(), rc: campo.getBoundingClientRect(), rl: campo.querySelector("label").getBoundingClientRect(),
    card: card.getBoundingClientRect().height, campoH: campo.getBoundingClientRect().height,
    input: campo.querySelector("input").getBoundingClientRect().top - campo.getBoundingClientRect().top,
  };
  b0.click();
  const cerrado = pop.hidden && b0.getAttribute("aria-expanded") === "false";
  b0.click();
  botones[0].click();
  const otro = { primeroCerrado: pop.hidden, otroAbierto: !document.getElementById(botones[0].getAttribute("aria-controls")).hidden, unSoloAbierto: $$(".info-popover").filter((p) => !p.hidden).length === 1 };
  $("#f-tension").click();
  const fuera = $$(".info-popover").every((p) => p.hidden) && botones.every((b) => b.getAttribute("aria-expanded") === "false");
  b0.click();
  document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
  const esc = $$(".info-popover").every((p) => p.hidden) && b0.getAttribute("aria-expanded") === "false";

  ok(!abierto.oculto && abierto.exp === "true" && abierto.texto === abierto.info && abierto.texto.length > 10, `al pulsar el botón se abre el cuadro con el texto de ayuda: «${abierto.texto}»`);
  ok(abierto.pos === "absolute" && abierto.z === "30", "el cuadro flota sobre el formulario (posición absoluta, por encima de los demás campos)");
  ok(Math.abs(abierto.card - antes.card) < 0.5 && Math.abs(abierto.campoH - antes.campo) < 0.5 && Math.abs(abierto.input - antes.input) < 0.5, "abrir el cuadro no mueve nada del formulario (ni la tarjeta, ni el campo, ni su casilla)");
  ok(!abierto.abajo && abierto.rp.bottom <= abierto.rl.top + 0.5 && abierto.rp.left >= abierto.rc.left - 0.5 && abierto.rp.right <= abierto.rc.right + 0.5, "el cuadro aparece ARRIBA del nombre del campo (no tapa la casilla que se va a llenar), dentro del ancho del campo");
  ok(cerrado, "un segundo clic sobre el botón lo cierra");
  ok(otro.primeroCerrado && otro.otroAbierto && otro.unSoloAbierto, "al abrir otro botón se cierra el anterior (solo uno abierto a la vez)");
  ok(fuera, "tocar fuera del cuadro lo cierra");
  ok(esc, "la tecla Esc lo cierra");

  // en pantalla angosta los cuadros no se salen de la ventana
  const marco = await cargarMarco(600);
  const d = marco.contentDocument;
  const dentro = [];
  for (const b of d.querySelectorAll(".info-btn")) {
    b.click();
    const r = d.getElementById(b.getAttribute("aria-controls")).getBoundingClientRect();
    dentro.push(r.width > 0 && r.left >= 0 && r.right <= 600 + 0.5);
    b.click();
  }
  marco.remove();
  ok(dentro.length >= 2 && dentro.every(Boolean), `en pantalla angosta (600 px) los ${dentro.length} cuadros quedan dentro de la ventana`);

  // arriba por defecto y volteo hacia abajo cuando arriba no cabe (iframe de poca altura para poder desplazarlo)
  const alto = 500;
  const marcoV = await cargarMarco(600, true, alto); // con resultados: la página es lo bastante alta para desplazarla
  const w = marcoV.contentWindow;
  const dv = marcoV.contentDocument;
  const botonV = dv.querySelector(".tramo-block .info-btn");
  const campoV = botonV.closest(".field");
  const popV = dv.getElementById(botonV.getAttribute("aria-controls"));
  const labelV = campoV.querySelector("label");
  const yCampo = campoV.getBoundingClientRect().top + w.scrollY;
  const colocar = (arribaDe) => { // desplaza para que el campo quede a `arribaDe` px del borde superior y abre el cuadro
    w.scrollTo(0, yCampo - arribaDe);
    botonV.click();
    const r = { arriba: !popV.classList.contains("info-popover--abajo"), rp: popV.getBoundingClientRect(), rl: labelV.getBoundingClientRect(), campoTop: campoV.getBoundingClientRect().top };
    botonV.click();
    return r;
  };
  const conEspacio = colocar(300);
  const sinEspacio = colocar(20);
  marcoV.remove();
  ok(conEspacio.arriba && conEspacio.rp.bottom <= conEspacio.rl.top + 0.5 && conEspacio.rp.top >= 56, `con espacio arriba (campo a ${Math.round(conEspacio.campoTop)} px del borde) el cuadro se abre ARRIBA de la etiqueta y bajo la barra superior`);
  ok(!sinEspacio.arriba && sinEspacio.rp.top >= sinEspacio.rl.bottom - 1 && sinEspacio.rp.top >= 0 && sinEspacio.rp.bottom <= alto, `sin espacio arriba (campo a ${Math.round(sinEspacio.campoTop)} px del borde) el cuadro se voltea y se abre ABAJO, dentro de la ventana`);
});

await seccion("service worker: archivos nuevos", async () => {
  const sw = await (await fetch("../sw.js")).text();
  const lista = [...sw.matchAll(/^\s*"([^"]+)",\s*$/gm)].map((m) => m[1]);
  const nuevos = ["js/calc/perdidas-tramos.js", "js/util/katex.js", "vendor/katex/katex.min.js", "vendor/katex/katex.min.css"];
  ok(nuevos.every((f) => lista.includes(f)), "el service worker precachea el módulo, el cargador y KaTeX");
  const fuentes = lista.filter((f) => f.startsWith("vendor/katex/fonts/"));
  ok(fuentes.length === 20, `precachea las 20 fuentes de KaTeX (${fuentes.length})`);
  const existen = await Promise.all(lista.filter((f) => f !== "./").map((f) => fetch(`../${f}`, { method: "HEAD" }).then((r) => [f, r.ok])));
  const faltan = existen.filter(([, okk]) => !okk).map(([f]) => f);
  ok(faltan.length === 0, `todos los archivos del APP_SHELL existen (cache.addAll falla completo si falta uno)${faltan.length ? ": " + faltan.join(", ") : ""}`);
});

out.textContent += `\nRESULT: ${fallos ? "FAIL" : "OK"} (${total - fallos}/${total})\n`;
