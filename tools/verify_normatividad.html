<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>verify_normatividad</title>
<!--
  Pruebas del visor de imagenes normativas (js/views/normativa-imagen.js), sobre todo del tema «Enterramiento de ductos», donde
  el numeral 3.20.6.3.g del RETIE 2026 pasó de imagen a nota al pie debajo del visor. Se ejecuta en el navegador, sin internet:
  la vista real se renderiza en un contenedor oculto y se maneja como lo haria una persona.

  Uso (desde la raiz del proyecto):
    python -m http.server 8000
    abrir http://localhost:8000/tools/verify_normatividad.html   -> lista PASS/FAIL
  o en modo consola:
    msedge --headless --dump-dom --virtual-time-budget=35000 http://localhost:8000/tools/verify_normatividad.html
-->
<style>body{font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:12px}#stage{position:absolute;left:-9999px;width:1000px}</style>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<pre id="out"></pre>
<div id="stage"></div>
<script type="module">
window.__BASE_PATH__ = "../";
const out = document.getElementById("out");
let fallos = 0;
let total = 0;
function ok(cond, msg) {
  total++;
  if (!cond) fallos++;
  out.textContent += `${cond ? "PASS" : "FAIL"} ${msg}\n`;
}
async function seccion(nombre, fn) {
  out.textContent += `\n== ${nombre}\n`;
  try {
    await fn();
  } catch (err) {
    fallos++;
    total++;
    out.textContent += `FAIL excepcion en "${nombre}": ${err && err.stack ? err.stack : err}\n`;
  }
}

const stage = document.getElementById("stage");
const $ = (s, r = stage) => r.querySelector(s);
const $$ = (s, r = stage) => [...r.querySelectorAll(s)];
const texto = (e) => (e ? e.textContent.replace(/\s+/g, " ").trim() : "");
const { render } = await import("../js/views/normativa-imagen.js");
const nav = await import("../js/nav.js");
const existe = async (ruta) => (await fetch(`../${ruta}`, { method: "HEAD" })).ok;
const cargarTema = async (tema) => { stage.innerHTML = ""; await render(stage, { tema }); };
const espera = (ms) => new Promise((r) => setTimeout(r, ms));
const esperarCarga = async (img, intentos = 100) => { for (let i = 0; i < intentos && !img.complete; i++) await new Promise((r) => setTimeout(r, 20)); };

await seccion("Distancias de seguridad: títulos «Tabla — descripción»", async () => {
  await cargarTema("distancias-seguridad");
  const esperados = [
    "Tabla 3.10.1.a — Distancias mínimas de seguridad en zonas con construcciones",
    "Tabla 3.10.2.a — Distancias mínimas de seguridad para diferentes situaciones",
    "Tabla 3.10.3.a — Distancias verticales mínimas en vanos de cruces o recorridos paralelos entre líneas de diferentes tensiones",
    "Tabla 3.10.4.a — Distancia horizontal entre conductores soportados en la misma estructura de apoyo",
    "Tabla 3.10.4.b — Distancia vertical mínima en metros entre conductores sobre la misma estructura",
    "Tabla 3.10.5.b — Distancias mínimas para trabajos en o cerca de partes energizadas en corriente alterna",
    "Tabla 3.10.5.c — Distancias mínimas para trabajos en o cerca de partes energizadas en corriente continua",
    "Tabla 3.22.1.c — Distancias de seguridad en el aire en subestaciones exteriores (Tabla 23.2 en RETIE 2013)",
  ];
  const actuales = $$("#sel-tabla option").map(texto);
  ok(actuales.length === 8 && actuales.every((t, i) => t === esperados[i]), "las 8 opciones llevan el numeral, el guión y la descripción de la app original de Power Apps");
  ok(actuales.every((t) => /^Tabla \d+\.\d+\.\d+\.[a-z] — \S/.test(t)), "todas siguen el formato «Tabla N.N.N.x — descripción», como las de Enterramiento de ductos");
  // cada opcion sigue mostrando su imagen
  const sel = $("#sel-tabla");
  const imgs = [];
  for (let i = 0; i < sel.options.length; i++) {
    sel.value = String(i);
    sel.dispatchEvent(new Event("change", { bubbles: true }));
    imgs.push($("#frame-imagen img").getAttribute("src").replace(/^\.\.\//, "")); // este arnes sirve las imagenes con window.__BASE_PATH__ ("../")
  }
  ok(imgs.join("|") === ["1-a", "2-a", "3-a", "4-a", "4-b", "5-b", "5-c"].map((n) => `assets/normativa/tabla-3-10-${n}.jpg`).concat("assets/normativa/tabla-3-22-1-c.jpg").join("|"), "cada título abre la imagen de su tabla");
});

await seccion("el selector de tabla / figura muestra los títulos completos", async () => {
  const lienzo = document.createElement("canvas").getContext("2d");
  const ancho = (sel, t) => { const cs = getComputedStyle(sel); lienzo.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`; return lienzo.measureText(t).width; };
  const util = (sel) => { const cs = getComputedStyle(sel); return sel.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 30; };

  // ventana ancha (1000 px): el campo llega hasta 960 px
  await cargarTema("distancias-seguridad");
  const sel = $("#sel-tabla");
  ok(sel.getBoundingClientRect().width <= 960.5 && sel.getBoundingClientRect().width > 700, `el campo es ancho pero no pasa de 960 px (${Math.round(sel.getBoundingClientRect().width)} px)`);
  const mayorDist = Math.max(...$$("option", sel).map((o) => ancho(sel, texto(o))));
  ok(mayorDist <= util(sel), `Distancias de seguridad: hasta el título más largo cabe entero (${Math.round(mayorDist)} px de ${Math.round(util(sel))} px útiles)`);
  // ya no se repite el título debajo del campo (ni en ventana ancha ni en angosta)
  ok(!$("#titulo-completo") && !$(".titulo-completo"), "no hay título repetido debajo del campo en ventana ancha");
  stage.innerHTML = "";
  const estrecho = document.createElement("div");
  estrecho.style.width = "360px";
  stage.append(estrecho);
  for (const tema of ["distancias-seguridad"]) {
    await render(estrecho, { tema });
    const selE = estrecho.querySelector("#sel-tabla");
    selE.value = String(selE.options.length - 1);
    selE.dispatchEvent(new Event("change", { bubbles: true }));
    ok(!estrecho.querySelector("#titulo-completo") && !estrecho.querySelector(".titulo-completo") && selE.nextElementSibling === null && selE.parentElement.nextElementSibling.classList.contains("zoom-barra") && selE.parentElement.nextElementSibling.nextElementSibling.id === "frame-imagen", `${tema}: en pantalla angosta tampoco hay título repetido; tras el campo van el zoom y la imagen`);
  }
  ok(!(await (await fetch("../css/app.css")).text()).includes("titulo-completo") && !(await (await fetch("../js/views/normativa-imagen.js")).text()).includes("titulo-completo"), "el código y el CSS de esa función ya no existen");
  stage.innerHTML = "";
});

await seccion("todos los visores ocupan el ancho disponible", async () => {
  await cargarTema("distancias-seguridad");
  ok(Math.abs($("#frame-imagen").getBoundingClientRect().width - $("#imagenes-wrap").getBoundingClientRect().width) < 1, "Distancias de seguridad: el visor ocupa todo el ancho");
  await cargarTema("corriente-ntc");
  const f = $(".tabla-partida").getBoundingClientRect();
  const w = $("#imagenes-wrap").getBoundingClientRect();
  ok(Math.abs(f.width - w.width) < 1 && Math.abs(f.left - w.left) < 1, `Corriente de conductores NTC 2050: el visor ocupa todo el ancho (${Math.round(f.width)} de ${Math.round(w.width)} px), igual que los otros`);
  ok(!$("#imagenes-wrap > .grid-2") && texto($(".section-title")) === "Capacidad de corriente de conductores" && !!$(".tabla-partida"), "sigue con su título y su tabla partida, sin la rejilla de 2 columnas");
});

await seccion("zoom de las imágenes (80 % al abrir, «−» y «+»)", async () => {
  const anchoUtil = (m) => m.clientWidth - parseFloat(getComputedStyle(m).paddingLeft) - parseFloat(getComputedStyle(m).paddingRight);
  // Distancias de seguridad: una imagen con selector
  await cargarTema("distancias-seguridad");
  const frame = $("#frame-imagen");
  const img = () => $("#frame-imagen img");
  await esperarCarga(img());
  const barra = $(".zoom-barra");
  ok(barra && barra.nextElementSibling === frame && $(".zoom-imagen-valor", barra).textContent === "80 %" && Math.abs(barra.querySelector('[data-zoom-paso="1"]').getBoundingClientRect().right - frame.getBoundingClientRect().right) < 2, "Distancias: «−» 80 % «+» arriba de la imagen, a la derecha");
  ok(img().style.width === "80%" && Math.abs(img().getBoundingClientRect().width - anchoUtil(frame) * 0.8) < 2, `la imagen arranca al 80 % del recuadro (${Math.round(img().getBoundingClientRect().width)} de ${Math.round(anchoUtil(frame))} px)`);
  const mas = barra.querySelector('[data-zoom-paso="1"]');
  mas.click(); mas.click();
  ok(img().style.width === "125%" && frame.scrollWidth > frame.clientWidth + 5 && frame.scrollHeight <= frame.clientHeight + 1, "«+» la agranda: el recuadro se desplaza a lo ancho, sin barra vertical");
  const sel = $("#sel-tabla");
  sel.value = "3";
  sel.dispatchEvent(new Event("change", { bubbles: true }));
  ok(img().style.width === "125%" && $(".zoom-imagen-valor", barra).textContent === "125 %", "al elegir otra tabla se conserva el zoom");

  // Corriente NTC: tabla partida (encabezado fijo + cuerpo)
  await cargarTema("corriente-ntc");
  const partida = $(".tabla-partida");
  const encImg = $(".tabla-partida__encabezado img");
  const cuerpoImg = $(".tabla-partida__cuerpo img");
  await esperarCarga(encImg);
  await espera(60);
  const cab = $(".zoom-cab");
  ok(cab && cab.querySelector(".section-title") && cab.querySelector(".zoom-imagen-valor").textContent === "80 %" && cab.nextElementSibling.contains(partida), "Corriente NTC: el zoom va a la derecha del título, arriba de la tabla");
  ok(encImg.style.width === "80%" && cuerpoImg.style.width === "80%", "encabezado y cuerpo arrancan al 80 %");
  const cuerpo = $(".tabla-partida__cuerpo");
  const recorte = () => $(".tabla-partida__encabezado").getBoundingClientRect().height / encImg.getBoundingClientRect().height;
  ok(Math.abs(recorte() - 0.3) < 0.02, `el encabezado sigue recortado en su fila de títulos (${recorte().toFixed(3)} del alto)`);
  const masN = cab.querySelector('[data-zoom-paso="1"]');
  for (let k = 0; k < 4; k++) masN.click(); // 80 → 100 → 125 → 150 → 200
  await espera(30);
  ok(encImg.style.width === "200%" && cuerpoImg.style.width === "200%" && Math.abs(recorte() - 0.3) < 0.02, `con zoom crecen las dos partes juntas y el recorte se vuelve a medir (${recorte().toFixed(3)})`);
  cuerpo.scrollLeft = 300;
  cuerpo.dispatchEvent(new Event("scroll"));
  const encWrap = $(".tabla-partida__encabezado");
  ok(cuerpo.scrollLeft > 0 && encWrap.scrollLeft === cuerpo.scrollLeft && Math.abs(encImg.getBoundingClientRect().left - cuerpoImg.getBoundingClientRect().left) < 1.5, `al desplazar el cuerpo a lo ancho, el encabezado lo sigue y las columnas siguen alineadas (${cuerpo.scrollLeft} px)`);
  stage.innerHTML = "";
});

await seccion("Resoluciones: ficha de detalle", async () => {
  const detalle = await import("../js/views/detalle-resolucion.js");
  const resoluciones = await (await fetch("../data/resoluciones.json")).json();
  stage.innerHTML = "";
  await detalle.render(stage, { id: String(resoluciones[0].id) });
  const grid = $(".detail-grid").getBoundingClientRect();
  const tarjeta = $(".card").getBoundingClientRect();
  ok(texto($(".page-title")) === resoluciones[0].resolucion && $$(".detail-item").length === 2 && texto($(".card .section-title")) === "Resumen", "la ficha muestra la resolución, el año y la tarjeta «Resumen»");
  ok(Math.abs(tarjeta.top - grid.bottom - 24) < 0.6, `entre «Resolución / Año» y la tarjeta «Resumen» hay 24 px (${(tarjeta.top - grid.bottom).toFixed(1)} px)`);
  // el mismo espacio en pantalla angosta (una columna)
  stage.innerHTML = "";
  const estrecho = document.createElement("div");
  estrecho.style.width = "360px";
  stage.append(estrecho);
  await detalle.render(estrecho, { id: String(resoluciones[0].id) });
  const g2 = estrecho.querySelector(".detail-grid").getBoundingClientRect();
  const t2 = estrecho.querySelector(".card").getBoundingClientRect();
  ok(Math.abs(t2.top - g2.bottom - 24) < 0.6, `también 24 px en pantalla angosta (${(t2.top - g2.bottom).toFixed(1)} px)`);
  stage.innerHTML = "";
});

await seccion("la imagen del numeral ya no existe", async () => {
  ok(!(await existe("assets/normativa/numeral-3-20-6-3-g.jpg")), "el archivo numeral-3-20-6-3-g.jpg ya no está en assets/normativa");
  const fuente = await (await fetch("../js/views/normativa-imagen.js")).text();
  ok(!fuente.includes("numeral-3-20-6-3-g"), "el visor ya no la referencia");
  const sw = await (await fetch("../sw.js")).text();
  ok(!sw.includes("numeral-3-20-6-3-g"), "el service worker ya no la precachea");
});

await seccion("los demás temas no cambian", async () => {
  await cargarTema("distancias-seguridad");
  ok($$("#sel-tabla option").length === 8 && !$(".nota-pie"), "Distancias de seguridad: 8 tablas y sin nota");
  await cargarTema("zona-servidumbre");
  ok(texto($(".empty-state h2")) === "Tema no encontrado", "Zona de servidumbre ya no es un tema del visor (pasó a la Biblioteca técnica)");
  await cargarTema("corriente-ntc");
  ok($$(".tabla-partida img").length === 2 && !$(".nota-pie"), "Corriente de conductores NTC 2050: tabla partida (2 copias de la imagen: encabezado + cuerpo) y sin nota");
  await cargarTema("no-existe");
  ok(texto($(".empty-state h2")) === "Tema no encontrado", "un tema desconocido sigue mostrando «Tema no encontrado»");
});

await seccion("Corriente NTC 2050: tabla partida (encabezado fijo + cuerpo con scroll)", async () => {
  const limpiar = await render(stage, { tema: "corriente-ntc" });
  ok(typeof limpiar === "function", "render() devuelve una función de limpieza (quita el listener de resize al salir de la pantalla)");

  const cont = $(".tabla-partida");
  ok(!!cont, "existe el contenedor .tabla-partida");
  ok(cont.getAttribute("data-lightbox").endsWith("assets/normativa/capacidad-corriente-conductores-ntc.jpg"), "data-lightbox del CONTENEDOR apunta a la imagen completa");

  const encImg = $(".tabla-partida__encabezado img");
  const cuerpoImg = $(".tabla-partida__cuerpo img");
  ok(!encImg.hasAttribute("data-lightbox") && !cuerpoImg.hasAttribute("data-lightbox"), "las imágenes internas NO llevan su propio data-lightbox: heredan el del contenedor, así que tocar cualquiera de las dos abre siempre la imagen COMPLETA (nunca un recorte)");
  ok(encImg.getAttribute("src").endsWith("capacidad-corriente-conductores-ntc.jpg") && cuerpoImg.getAttribute("src") === encImg.getAttribute("src"), "encabezado y cuerpo muestran la MISMA imagen (para que las columnas coincidan en escala)");

  await esperarCarga(encImg);
  await new Promise((r) => setTimeout(r, 80)); // deja correr el listener "load" -> ajustar()

  const encWrap = $(".tabla-partida__encabezado");
  const alturaEnc = encWrap.getBoundingClientRect().height;
  const alturaCompleta = encImg.getBoundingClientRect().height; // el <img> no se autorrecorta: su altura sigue siendo la de la imagen ENTERA
  ok(alturaEnc > 0 && alturaEnc < alturaCompleta, `el encabezado queda recortado (${Math.round(alturaEnc)} px) frente a la imagen completa (${Math.round(alturaCompleta)} px)`);
  ok(Math.abs(alturaEnc / alturaCompleta - 0.3) < 0.03, `la fracción recortada es ~30 %, medida sobre la línea real que separa el encabezado de la primera fila de datos (${(alturaEnc / alturaCompleta * 100).toFixed(1)} %)`);

  const cuerpo = $(".tabla-partida__cuerpo");
  ok(getComputedStyle(cuerpo).overflowY === "auto", "el cuerpo tiene scroll vertical propio");
  ok(cuerpo.getBoundingClientRect().height <= 420.5, `el cuerpo no pasa del alto fijo configurado, 420 px (mide ${Math.round(cuerpo.getBoundingClientRect().height)} px)`);

  const inner = $(".tabla-partida__cuerpo-inner");
  ok(inner.style.marginTop === `-${Math.round(alturaEnc)}px`, "el cuerpo se desplaza hacia arriba justo lo que mide el encabezado recortado: la primera fila visible al abrir es la primera fila de datos, no el título");

  // el ancho de la barra de scroll (si la hay) se compensa en el encabezado para que las columnas no queden mas angostas que las del cuerpo
  const anchoBarra = cuerpo.offsetWidth - cuerpo.clientWidth;
  ok(encWrap.style.paddingRight === `${anchoBarra}px`, `el encabezado compensa el ancho de la barra de scroll del cuerpo (${anchoBarra} px) con el mismo padding-right, así las columnas quedan alineadas`);
  const rEnc = encImg.getBoundingClientRect();
  const rCuerpo = cuerpoImg.getBoundingClientRect();
  ok(Math.abs(rEnc.width - rCuerpo.width) < 1 && Math.abs(rEnc.left - rCuerpo.left) < 1 && Math.abs(rEnc.right - rCuerpo.right) < 1, `encabezado y cuerpo renderizan la imagen exactamente al mismo ancho y en la misma posición horizontal (encabezado ${Math.round(rEnc.width)} px, cuerpo ${Math.round(rCuerpo.width)} px)`);

  // sin espacio/borde entre el encabezado y el cuerpo: deben quedar pegados, como si fuera una sola imagen
  const rEncWrap = encWrap.getBoundingClientRect();
  const rCuerpoWrap = cuerpo.getBoundingClientRect();
  ok(Math.abs(rCuerpoWrap.top - rEncWrap.bottom) < 0.5, `el cuerpo va PEGADO al encabezado, sin espacio entre los dos (separación ${(rCuerpoWrap.top - rEncWrap.bottom).toFixed(1)} px)`);

  // se puede subir hasta que la ULTIMA fila quede pegada arriba del cuerpo (no a medio viewport)
  cuerpo.scrollTop = cuerpo.scrollHeight;
  const alturaFilaEsperada = Math.round(alturaCompleta * 0.0266);
  const margenSobrante = cuerpo.scrollHeight - cuerpo.scrollTop - cuerpo.clientHeight;
  ok(Math.abs(margenSobrante) < 1, `el scroll llega hasta el final sin quedar corto (sobran ${margenSobrante.toFixed(1)} px)`);
  // en scrollTop, la fila de imagen que queda arriba del viewport es (scrollTop + alturaEnc): al final debe ser justo
  // donde empieza la ÚLTIMA fila (alturaCompleta - alturaFila), ni antes (se ve a medio viewport) ni después (ya no hay imagen)
  const filaEnElTope = cuerpo.scrollTop + alturaEnc;
  ok(Math.abs(filaEnElTope - (alturaCompleta - alturaFilaEsperada)) < 2, `al hacer scroll hasta el final, la ÚLTIMA fila queda pegada arriba del cuerpo (junto al encabezado), no varada a medio viewport (fila en el tope: ${Math.round(filaEnElTope)} px, se esperaba ${Math.round(alturaCompleta - alturaFilaEsperada)} px)`);

  ok(!$(".tabla-partida__aviso") && !/desplázate dentro de la tabla/.test(stage.textContent), "sin nota debajo de la tabla (el usuario la quitó el 2026-09-24: no hace falta la aclaración)");

  // llamar la limpieza no debe tronar (aunque se llame más de una vez, p. ej. si el router la invoca y luego se navega otra vez)
  limpiar();
  limpiar();
  ok(true, "la función de limpieza se puede llamar más de una vez sin error");
  stage.innerHTML = "";
});

await seccion("todas las imágenes existen y están precacheadas", async () => {
  const sw = await (await fetch("../sw.js")).text();
  const listaSw = [...sw.matchAll(/^\s*"([^"]+)",\s*$/gm)].map((m) => m[1]);
  const usadas = new Set();
  const sinBase = (src) => src.replace(/^\.\.\//, ""); // las imagenes se sirven con window.__BASE_PATH__ ("../") en este arnes; el APP_SHELL usa rutas relativas a la raiz
  for (const tema of ["distancias-seguridad", "corriente-ntc"]) {
    await cargarTema(tema);
    // se recorren todas las opciones del selector (si hay)
    const sel = $("#sel-tabla");
    if (sel) {
      for (let i = 0; i < sel.options.length; i++) {
        sel.value = String(i);
        sel.dispatchEvent(new Event("change", { bubbles: true }));
        usadas.add(sinBase($("#frame-imagen img").getAttribute("src")));
      }
    } else {
      $$(".image-frame img").forEach((im) => usadas.add(sinBase(im.getAttribute("src"))));
      $$(".tabla-partida img").forEach((im) => usadas.add(sinBase(im.getAttribute("src"))));
    }
  }
  // las de fábrica de la Biblioteca técnica (Zona de servidumbre y Enterramiento de ductos)
  const biblioteca = await (await fetch("../data/biblioteca.json")).json();
  biblioteca.forEach((r) => r.imagenes.forEach((i) => i.src && usadas.add(i.src)));
  const lista = [...usadas];
  const faltan = [];
  for (const r of lista) if (!(await existe(r))) faltan.push(r);
  ok(lista.length === 13 && faltan.length === 0, `las ${lista.length} imágenes del visor y de la Biblioteca técnica existen${faltan.length ? ": faltan " + faltan.join(", ") : ""}`);
  const sinCache = lista.filter((r) => !listaSw.includes(r));
  ok(sinCache.length === 0, `todas están en el APP_SHELL del service worker${sinCache.length ? ": faltan " + sinCache.join(", ") : ""}`);
  const existenSw = await Promise.all(listaSw.filter((f) => f !== "./").map((f) => fetch(`../${f}`, { method: "HEAD" }).then((r) => [f, r.ok])));
  const faltanSw = existenSw.filter(([, okk]) => !okk).map(([f]) => f);
  ok(faltanSw.length === 0, `todos los archivos del APP_SHELL existen${faltanSw.length ? ": " + faltanSw.join(", ") : ""}`);
  const hashes = nav.sectionMenus.normatividad.map((i) => i.hash);
  ok(hashes.indexOf("#/normatividad/biblioteca") === hashes.indexOf("#/normatividad/resoluciones") - 1 && !hashes.includes("#/normatividad/zona-servidumbre") && !hashes.includes("#/normatividad/enterramiento-ductos"), "el menú de Normatividad tiene «Biblioteca técnica» justo antes de Resoluciones, y ya no las tarjetas de Zona de servidumbre ni Enterramiento");
});

out.textContent += `\nRESULT: ${fallos ? "FAIL" : "OK"} (${total - fallos}/${total})\n`;
</script>
</body>
</html>
