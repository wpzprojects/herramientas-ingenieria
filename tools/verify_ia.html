<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>verify_ia</title>
<!--
  Arnes de pruebas de la capa de IA (js/ai/*), ejecutable en el navegador sin
  clave de API ni internet: el cliente de Gemini se reemplaza por un mock.

  Uso (desde la raiz del proyecto):
    python -m http.server 8000
    abrir http://localhost:8000/tools/verify_ia.html   -> lista PASS/FAIL
  o en modo consola:
    msedge --headless --dump-dom --virtual-time-budget=8000 http://localhost:8000/tools/verify_ia.html
-->
<style>body{font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:12px}#stage{display:none}</style>
</head>
<body>
<pre id="out"></pre>
<div id="stage"></div>
<script type="module">
window.__BASE_PATH__ = "../";
const out = document.getElementById("out");
let fallos = 0;
let total = 0;
function ok(cond, msg) {
  total++;
  if (!cond) fallos++;
  out.textContent += `${cond ? "PASS" : "FAIL"} ${msg}\n`;
}
function cerca(a, b, tol, msg) {
  ok(Math.abs(a - b) <= tol, `${msg} (obtenido ${a}, esperado ${b})`);
}
async function seccion(nombre, fn) {
  out.textContent += `\n== ${nombre}\n`;
  try {
    await fn();
  } catch (err) {
    fallos++;
    total++;
    out.textContent += `FAIL excepcion en "${nombre}": ${err && err.stack ? err.stack : err}\n`;
  }
}

const { markdownAHtml } = await import("../js/ai/markdown.js");
const gemini = await import("../js/ai/gemini.js");
const agentes = await import("../js/ai/agentes.js");
const config = await import("../js/ai/config.js");

await seccion("markdown", async () => {
  const h = markdownAHtml("# Titulo\n\nTexto con **negrita** y *cursiva* y `codigo`.\n\n- a\n- b\n  - b1\n\n1. uno\n2. dos\n\n| A | B |\n|---|---|\n| 1 | 2 |\n");
  ok(h.includes("<h2>Titulo</h2>"), "titulo # -> h2");
  ok(h.includes("<strong>negrita</strong>") && h.includes("<em>cursiva</em>") && h.includes("<code>codigo</code>"), "inline");
  ok(h.includes("<ul>") && h.includes("<ol>") && h.includes("<li>b1</li>"), "listas y anidada");
  ok(h.includes("<table>") && h.includes("<th class=\"wrap\">A</th>") && h.includes("<td class=\"wrap\">2</td>"), "tabla");
  // "<\/script>" evita que el parser HTML cierre este bloque <script> antes de tiempo
  const x = markdownAHtml("<script>alert(1)<\/script> [x](javascript:alert(1)) [ok](https://a.com)");
  ok(!x.includes("<script") && !x.includes("href=\"javascript"), "escapa HTML y bloquea javascript:");
  ok(x.includes('href="https://a.com"'), "enlace https permitido");
});

await seccion("gemini (mock)", async () => {
  gemini.usarMock(async ({ ruta, cuerpo }) => {
    if (ruta.startsWith("/models?")) {
      return { models: [
        { name: "models/gemini-2.5-flash", displayName: "F", supportedGenerationMethods: ["generateContent"] },
        { name: "models/gemini-2.5-flash-lite", supportedGenerationMethods: ["generateContent"] },
        { name: "models/gemini-3-pro-preview", supportedGenerationMethods: ["generateContent"] },
        { name: "models/gemini-2.5-flash-image", supportedGenerationMethods: ["generateContent"] },
        { name: "models/text-embedding-004", supportedGenerationMethods: ["embedContent"] },
      ] };
    }
    return { candidates: [{ finishReason: "STOP", content: { role: "model", parts: [
      { text: "hola " }, { text: "mundo" },
      { functionCall: { name: "f1", args: { a: 1 } } },
    ] } }], _eco: cuerpo };
  });
  const modelos = await gemini.listarModelos("k");
  ok(modelos.length === 4 && !modelos.some((m) => m.id.includes("embedding")), "lista solo modelos con generateContent");
  ok(gemini.elegirModeloPorDefecto(modelos) === "gemini-2.5-flash", `modelo por defecto = flash estable (${gemini.elegirModeloPorDefecto(modelos)})`);
  const r = await gemini.generar({ clave: "k", modelo: "m", contenidos: [], temperatura: 0.2 });
  ok(r.texto === "hola mundo" && r.llamadas.length === 1 && r.llamadas[0].name === "f1", "parsea texto y llamadas a funciones");
  ok(r.content.role === "model" && r.content.parts.length === 3, "conserva el turno completo del modelo");
  gemini.usarMock(async () => ({ candidates: [], promptFeedback: { blockReason: "SAFETY" } }));
  let err = null;
  try { await gemini.generar({ clave: "k", modelo: "m", contenidos: [] }); } catch (e) { err = e; }
  ok(err && err.tipo === "bloqueo", "bloqueo de seguridad -> ErrorGemini(bloqueo)");
  gemini.usarMock(null);
});

await seccion("agentes", async () => {
  const lista = agentes.AGENTES_POR_DEFECTO;
  ok(lista.length === 4 && lista.every((a) => a.predefinido), "4 agentes predeterminados");
  const s = agentes.construirSistema({ ...lista[0], ejemplos: [{ antes: "hola q tal", despues: "Hola, ¿cómo estás?" }] });
  ok(s.includes("Tono requerido: Profesional cordial") && s.includes("Ejemplo 1") && s.includes("sin formato Markdown"), "construirSistema arma tono, ejemplos y formato");
  const s2 = agentes.construirSistema({ ...lista[0], explicarCambios: true });
  ok(s2.includes("Cambios realizados"), "explicarCambios agrega seccion");
  let e1 = null;
  try { agentes.importarAgentesJson("no es json"); } catch (e) { e1 = e; }
  ok(!!e1, "importar JSON invalido lanza error");
  const imp = agentes.importarAgentesJson(agentes.exportarAgentesJson(lista));
  ok(imp.length === 4 && imp.every((a) => a.predefinido === false), "exportar/importar ida y vuelta");
});

await seccion("tools: esquema para Gemini", async () => {
  const decl = tools.declaraciones();
  ok(decl.length === 9, `9 herramientas declaradas (${decl.length})`);
  ok(decl.every((d) => d.name && d.description && d.parameters.type === "object" && Object.keys(d.parameters.properties).length > 0), "todas con descripcion y propiedades no vacias");
  ok(decl.every((d) => (d.parameters.required || []).every((r) => r in d.parameters.properties)), "required subconjunto de properties");
  const barrido = decl.find((d) => d.name === "barrer_parametro").parameters.properties;
  ok(barrido.valores.type === "array" && barrido.valores.items.type === "number" && barrido.valores_texto.items.type === "string", "arrays con items");
  ok(barrido.herramienta.enum.length === 6, "barrido: enum de 6 calculadoras");
});

await seccion("tools: pérdidas", async () => {
  const ctx = ctxNuevo();
  const r = await tools.ejecutarLlamada("calcular_perdidas", { ...LINEA, factor_carga: 0.564, red: "Aerea", material: "ACSR", calibre: "4/0" }, ctx);
  ok(r.ok === true, "ejecuta sin error");
  // formula independiente (factor de perdidas lineal 0.7*Fc+0.3, igual que la app original)
  const I = (9.9 * 1000) / (34.5 * 0.95 * Math.sqrt(3));
  const esperado = (Math.sqrt(3) * I * ACSR_4_0.r_ac_75c_ohm_km * 5.2 * (0.7 * 0.564 + 0.3) * 100) / (34.5 * 1000 * 0.95);
  cerca(salida(ctx, "perdidas_pct"), esperado, 1e-9, "pérdidas % coincide con fórmula independiente");
  cerca(salida(ctx, "corriente_a"), I, 1e-9, "corriente coincide");
  const ctx2 = ctxNuevo();
  await tools.ejecutarLlamada("calcular_perdidas", { ...LINEA, factor_carga: 0.564, resistencia_ohm_km: ACSR_4_0.r_ac_75c_ohm_km }, ctx2);
  cerca(salida(ctx2, "perdidas_pct"), esperado, 1e-9, "resistencia manual = catálogo");
  ok(ctx.log[0].entradas.some((e) => e.clave === "conductor") && ctx.log[0].supuestos.length === 0, "log: entradas con conductor y sin supuestos");
});

await seccion("tools: regulación", async () => {
  const ctx = ctxNuevo();
  const r = await tools.ejecutarLlamada("calcular_regulacion", { ...LINEA, red: "aérea", material: "acsr", calibre: "4/0" }, ctx);

    tensionLineaKv: 34.5, potenciaActivaMw: 9.9, factorPotencia: 0.95, longitudKm: 5.2,

  });
  cerca(salida(ctx, "caida_tension_pct"), directo.caidaTensionPct, 1e-9, "caída de tensión = motor con valores por defecto de la vista");

});

await seccion("tools: cortocircuito", async () => {
  const ctx = ctxNuevo();
  await tools.ejecutarLlamada("calcular_cortocircuito", { red: "Aerea", material: "ACSR", calibre: "4/0" }, ctx);
  const A = ACSR_4_0.area_seccion_aluminio_mm2;
  const esperado = (A * 224 * Math.sqrt(Math.log10((250 + 228) / (75 + 228)) / 0.3)) / 1000;
  cerca(salida(ctx, "capacidad_cc_ka"), esperado, 1e-9, "I_CC aérea (Aluminio, 75→250 °C, 0.3 s)");
  const ctx2 = ctxNuevo();
  const r = await tools.ejecutarLlamada("calcular_cortocircuito", { area_mm2: 100, material_electrico: "Cobre", temp_operacion_c: 90, temp_falla_c: 250, tiempo_s: 1 }, ctx2);
  cerca(salida(ctx2, "capacidad_cc_ka"), (100 * 341 * Math.sqrt(Math.log10((250 + 234) / (90 + 234)) / 1)) / 1000, 1e-9, "I_CC manual cobre");
  const r2 = await tools.ejecutarLlamada("calcular_cortocircuito", { area_mm2: 100, material_electrico: "Cobre", temp_operacion_c: 300, temp_falla_c: 250 }, ctxNuevo());
  ok(r2.ok === false, "temp de falla <= operación se rechaza");
});

await seccion("tools: ampacidad aérea", async () => {
  const ctx = ctxNuevo();
  await tools.ejecutarLlamada("calcular_ampacidad_aerea", { tipo: "ACSR", calibre: "4/0" }, ctx);
  const directo = engAmpAerea.calcularAmpacidadAerea({
    diametroMm: ACSR_4_0.diametro_cable_mm, rBajoOhmKm: ACSR_4_0.r_ac_25c_ohm_km, rAltoOhmKm: ACSR_4_0.r_ac_75c_ohm_km,
    epsilon: 0.5, alfa: 0.5, taC: 25, tcC: 75, vwMs: 0.61, anguloVientoDeg: 90, elevacionM: 0, qseWm2: 1000, thetaDeg: 90,
  });
  cerca(salida(ctx, "ampacidad_a"), directo.ampacidad, 1e-9, "ampacidad = motor con defectos de la vista");

  const calor = ctxNuevo();

    tempMaxC: 90, tempTerrenoC: 25, rhoSueloKmW: 1, uDuctoKmW: 0.3, separacionFasesM: 0.04, numCircuitos: 1, profundidadBancoM: 1, separacionDuctosM: 0.2,

await seccion("tools: ocupación de ductos", async () => {
  const ctx = ctxNuevo();
  await tools.ejecutarLlamada("calcular_ocupacion_ductos", { numero_conductores: 3, diametro_conductor_mm: 30, diametro_tubo_mm: 100 }, ctx);

await seccion("tools: validación y errores orientadores", async () => {
  const a = await tools.ejecutarLlamada("calcular_perdidas", { ...LINEA, factor_potencia: 1.5, factor_carga: 0.5, resistencia_ohm_km: 0.3 }, ctxNuevo());
  ok(a.ok === false && a.error.includes("factor_potencia"), "factor de potencia fuera de rango");
  const b = await tools.ejecutarLlamada("calcular_perdidas", { tension_kv: 34.5 }, ctxNuevo());
  ok(b.ok === false && b.error.includes("potencia_mw") && b.error.includes("longitud_km"), "lista los parámetros obligatorios faltantes");
  const c = await tools.ejecutarLlamada("calcular_perdidas", { ...LINEA, factor_carga: 0.5, red: "Aerea", material: "ACSR", calibre: "999" }, ctxNuevo());
  ok(c.ok === false && c.error.includes("Calibres disponibles"), "calibre inexistente lista los disponibles");
  const d = await tools.ejecutarLlamada("calcular_perdidas", { ...LINEA, factor_carga: 0.5 }, ctxNuevo());
  ok(d.ok === false && /red|material|calibre/.test(d.error), "sin conductor ni resistencia -> pide conductor");
  const e = await tools.ejecutarLlamada("no_existe", {}, ctxNuevo());
  ok(e.ok === false && e.error.includes("desconocida"), "herramienta desconocida");
  const f = await tools.ejecutarLlamada("calcular_perdidas", { ...LINEA, factor_carga: "0,5", resistencia_ohm_km: "0,3", basura: 1 }, ctxNuevo());
  ok(f.ok === true && f.notas.some((n) => n.includes("basura")), "acepta coma decimal e ignora parámetros desconocidos (con nota)");
});

await seccion("tools: barrido, presupuesto y consultas", async () => {
  const ctx = ctxNuevo();
  const base = { ...LINEA, red: "Aerea", material: "ACSR", calibre: "4/0" };
  delete base.longitud_km;
  const r = await tools.ejecutarLlamada("barrer_parametro", { herramienta: "calcular_regulacion", parametros_json: JSON.stringify({ ...base }), parametro: "longitud_km", desde: 2, hasta: 10, pasos: 5 }, ctx);
  ok(r.ok === true && r.puntos.length === 5, `barrido de 5 puntos (${r.error || "ok"})`);
  const caidas = ctx.log.map((x) => x.resultados.find((q) => q.clave === "caida_tension_pct").valor);
  ok(caidas.every((v, i) => i === 0 || v > caidas[i - 1]), "la caída crece con la longitud");
  cerca(caidas[4] / caidas[0], 5, 1e-9, "caída proporcional a la longitud (10 km / 2 km = 5)");
  ok(ctx.presupuesto.usado === 5 && ctx.log.every((x) => x.barrido), "presupuesto consumido y corridas marcadas como barrido");

  const rt = await tools.ejecutarLlamada("barrer_parametro", { herramienta: "calcular_perdidas", parametros_json: JSON.stringify({ ...LINEA, factor_carga: 0.56, red: "Aerea", material: "ACSR" }), parametro: "calibre", valores_texto: ["1/0", "4/0", "336.4"] }, ctxNuevo());
  ok(rt.ok && rt.puntos.length === 3 && rt.puntos[0].resultados.perdidas_pct > rt.puntos[2].resultados.perdidas_pct, "barrido de calibres: más calibre, menos pérdidas");

  const chico = ctxNuevo(3);
  const rl = await tools.ejecutarLlamada("barrer_parametro", { herramienta: "calcular_regulacion", parametros_json: JSON.stringify(base), parametro: "longitud_km", desde: 1, hasta: 5, pasos: 5 }, chico);
  ok(rl.ok === false && rl.error.includes("límite"), "excede el presupuesto de cálculos");
  const rp = await tools.ejecutarLlamada("barrer_parametro", { herramienta: "calcular_regulacion", parametros_json: "{no json", parametro: "longitud_km", desde: 1, hasta: 2 }, ctxNuevo());
  ok(rp.ok === false && rp.error.includes("JSON"), "parametros_json inválido");
  const rn = await tools.ejecutarLlamada("barrer_parametro", { herramienta: "calcular_regulacion", parametros_json: "{}", parametro: "inventado", desde: 1, hasta: 2 }, ctxNuevo());
  ok(rn.ok === false && rn.error.includes("no es un parámetro"), "parámetro a variar inexistente");

  const q1 = await tools.ejecutarLlamada("buscar_conductor", { familia: "desnudos" }, ctxNuevo());
  ok(q1.ok && q1.grupos.ACSR && q1.total === 342, "buscar_conductor sin filtros lista familias");
  const q2 = await tools.ejecutarLlamada("buscar_conductor", { familia: "desnudos", tipo_o_material: "ACSR", calibre: "4/0" }, ctxNuevo());
  ok(q2.ok && q2.filas.length > 0 && q2.filas[0].r_ac_75c_ohm_km === ACSR_4_0.r_ac_75c_ohm_km, "buscar_conductor con filtros devuelve resistencia de catálogo");
  const q3 = await tools.ejecutarLlamada("buscar_tuberia", {}, ctxNuevo());
  ok(q3.ok && q3.tipos.length === 6, "buscar_tuberia lista los 6 tipos");
});

await seccion("reporte: tablas de escenarios", async () => {
  const ctx = ctxNuevo();
  await tools.ejecutarLlamada("barrer_parametro", { herramienta: "calcular_regulacion", parametros_json: JSON.stringify({ ...LINEA, longitud_km: undefined, red: "Aerea", material: "ACSR", calibre: "4/0" }), parametro: "longitud_km", desde: 2, hasta: 6, pasos: 3 }, ctx);
  await tools.ejecutarLlamada("calcular_perdidas", { ...LINEA, factor_carga: 0.5, resistencia_ohm_km: 0.3 }, ctx);
  await tools.ejecutarLlamada("calcular_perdidas", { ...LINEA, factor_potencia: 5, factor_carga: 0.5, resistencia_ohm_km: 0.3 }, ctx); // error
  await tools.ejecutarLlamada("buscar_tuberia", {}, ctx); // consulta: no aparece
  const { tablas, errores } = reporte.armarTablas(ctx.log);
  ok(tablas.length === 2 && errores.length === 1, "2 tablas (regulación y pérdidas) y 1 error");
  const reg = tablas.find((t) => t.titulo === "Regulación");
  ok(reg.total === 3 && reg.colsVar.length === 1 && reg.colsVar[0].clave === "longitud_km", "regulación: solo la longitud varía");
  ok(reg.comunes.some((e) => e.clave === "tension_kv"), "regulación: la tensión es dato común");
  const md = reporte.escenariosMd(ctx.log);
  ok(md.includes("### Regulación — 3 escenarios") && md.includes("| 1 | 2 |"), "Markdown con tabla y fila inicial");
  const html = reporte.escenariosHtml(ctx.log);
  ok(html.includes("<table>") && html.includes("Cálculos con error (1)"), "HTML con tablas y sección de errores");
  ok(!/<script/i.test(reporte.escenariosHtml([{ id: 1, herramienta: "x", titulo: "<script>x<\/script>", entradas: [], resultados: [], supuestos: [], notas: [] }])), "escapa HTML en títulos");
  const full = reporte.reporteMd({ narrativa: "# Mi reporte\n\nTexto", log: ctx.log, fecha: "hoy", modelo: "m" });
  ok(full.startsWith("# Mi reporte") && full.includes("Reporte generado con asistencia de IA"), "reporte completo incluye narrativa y aviso");
});

await seccion("analisis: bucle con herramientas (Gemini simulado)", async () => {
  const ajustes = { modelo: "m", temperatura: 0.3, maxRondas: 4, maxCalculos: 60 };
  const conv = { contenidos: [] };
  const ctx = ctxNuevo();
  const eventos = [];
  let n = 0;
  gemini.usarMock(async ({ cuerpo }) => {
    n++;
    if (n === 1) {
      ok(cuerpo.tools[0].functionDeclarations.length === 9 && cuerpo.toolConfig.functionCallingConfig.mode === "AUTO" && !!cuerpo.systemInstruction, "1ª llamada: envía herramientas, modo AUTO e instrucciones de sistema");
      return { candidates: [{ content: { role: "model", parts: [
        { functionCall: { name: "calcular_perdidas", args: { ...LINEA, factor_carga: 0.5, resistencia_ohm_km: 0.3 } } },
        { functionCall: { name: "calcular_perdidas", args: { ...LINEA, factor_carga: 0.9, resistencia_ohm_km: 0.3 } } },
      ] } }] };
    }
    const partes = cuerpo.contents.at(-1).parts;
    ok(partes.length === 2 && partes.every((p) => p.functionResponse.response.ok === true), "2ª llamada: recibe 2 functionResponse (llamadas paralelas)");
    return { candidates: [{ content: { role: "model", parts: [{ text: "Resultado interpretado." }] } }] };
  });
  const r = await analisis.ejecutarTurno({ conv, texto: "compara", clave: "k", ajustes, ctx, onEvento: (e) => eventos.push(e.tipo) });
  ok(r.texto === "Resultado interpretado." && r.herramientas.length === 2 && !r.truncado, "devuelve texto final y herramientas usadas");
  ok(conv.contenidos.length === 4 && conv.contenidos.map((c) => c.role).join() === "user,model,user,model", "historial: user, model, user(functionResponse), model");
  ok(ctx.log.length === 2 && eventos.filter((t) => t === "herramienta-fin").length === 2, "log con 2 corridas y eventos de progreso");

  // rondas agotadas -> cierre forzado sin herramientas
  const conv2 = { contenidos: [] };
  const modos = [];
  gemini.usarMock(async ({ cuerpo }) => {
    modos.push(cuerpo.toolConfig?.functionCallingConfig?.mode);
    if (cuerpo.toolConfig.functionCallingConfig.mode === "NONE") return { candidates: [{ content: { role: "model", parts: [{ text: "Cierre." }] } }] };
    return { candidates: [{ content: { role: "model", parts: [{ functionCall: { name: "buscar_tuberia", args: {} } }] } }] };
  });
  const r2 = await analisis.ejecutarTurno({ conv: conv2, texto: "x", clave: "k", ajustes: { ...ajustes, maxRondas: 2 }, ctx: ctxNuevo() });
  ok(r2.truncado && r2.texto === "Cierre." && modos.at(-1) === "NONE" && modos.length === 3, `agota rondas y fuerza cierre (${modos.join(",")})`);

  // error de red -> se revierte el turno
  const conv3 = { contenidos: [{ role: "user", parts: [{ text: "previo" }] }, { role: "model", parts: [{ text: "ok" }] }] };
  const ctx3 = ctxNuevo();
  gemini.usarMock(async () => { throw new gemini.ErrorGemini("caída", { tipo: "red" }); });
  let err = null;
  try { await analisis.ejecutarTurno({ conv: conv3, texto: "nuevo", clave: "k", ajustes, ctx: ctx3 }); } catch (e) { err = e; }
  ok(err && err.tipo === "red" && conv3.contenidos.length === 2, "ante un error se revierte el historial del turno");
  gemini.usarMock(null);
});

const acceso = await import("../js/auth/backend.js");
const { crearBackendMock } = await import("../js/auth/backend-mock.js");
const YO = { email: "Yo@Gmail.com", nombre: "Yo", foto: "" };
const OTRO = { email: "otro@gmail.com", nombre: "Otro", foto: "" };
const EXTRAÑO = { email: "extrano@gmail.com", nombre: "X", foto: "" };
const semilla = () => [{ email: "yo@gmail.com", rol: "admin" }, { email: "otro@gmail.com", rol: "usuario" }];
const falla = async (fn, tipo) => { try { await fn(); return false; } catch (e) { return e instanceof acceso.ErrorAcceso && (!tipo || e.tipo === tipo); } };

await seccion("acceso: sin Firebase configurado no hay backend (el simulado nunca se elige solo)", async () => {
  ok((await acceso.obtenerBackend()) === null, "obtenerBackend() = null mientras firebaseConfig sea null");
});

await seccion("acceso: perfil y lista (reglas)", async () => {
  const b = crearBackendMock({ usuarios: semilla(), sesion: YO });
  ok((await b.obtenerPerfil()).rol === "admin" && (await b.obtenerPerfil()).email === "yo@gmail.com", "el correo se normaliza a minúsculas y se reconoce al admin");
  ok((await esperarSesionOk(b)) === YO, "esperarSesion devuelve la sesión inicial");
  b._entrarComo(OTRO);
  ok((await b.obtenerPerfil()).rol === "usuario", "usuario normal");
  b._entrarComo(EXTRAÑO);
  ok((await b.obtenerPerfil()) === null, "correo fuera de la lista => sin acceso (null)");
  ok(await falla(() => b.listarUsuarios(), "permiso"), "no autorizado no puede listar usuarios");
  ok(await falla(() => b.leerClaveCompartida(), "permiso"), "no autorizado no puede leer la clave compartida");
  b._entrarComo(null);
  ok((await b.obtenerPerfil()) === null, "sin sesión => null");
  async function esperarSesionOk(x) { return acceso.esperarSesion(x); }
});

await seccion("acceso: gestión de usuarios (solo admin)", async () => {
  const b = crearBackendMock({ usuarios: semilla(), sesion: YO });
  await b.guardarUsuario("  Nuevo@Gmail.COM ", "usuario");
  ok((await b.listarUsuarios()).some((u) => u.email === "nuevo@gmail.com" && u.rol === "usuario" && u.agregadoPor === "yo@gmail.com"), "admin agrega (correo en minúsculas, registra quién lo agregó)");
  ok(await falla(() => b.guardarUsuario("no-es-correo", "usuario"), "invalido"), "rechaza correo inválido");
  ok(await falla(() => b.guardarUsuario("a@b.co", "superadmin"), "invalido"), "rechaza rol inválido");
  await b.guardarUsuario("nuevo@gmail.com", "admin");
  ok((await b.listarUsuarios()).find((u) => u.email === "nuevo@gmail.com").rol === "admin", "admin cambia el rol de otro");
  await b.quitarUsuario("nuevo@gmail.com");
  ok(!(await b.listarUsuarios()).some((u) => u.email === "nuevo@gmail.com"), "admin quita a otro");
  ok(await falla(() => b.quitarUsuario("yo@gmail.com"), "permiso"), "un admin no puede quitarse a sí mismo (siempre queda un admin)");
  ok(await falla(() => b.guardarUsuario("yo@gmail.com", "usuario"), "permiso"), "un admin no puede bajarse el rol a sí mismo");
  b._entrarComo(OTRO);
  ok(await falla(() => b.guardarUsuario("z@z.co", "usuario"), "permiso"), "un usuario normal NO puede agregar");
  ok(await falla(() => b.quitarUsuario("yo@gmail.com"), "permiso"), "un usuario normal NO puede quitar");
  ok((await b.listarUsuarios()).length === 2, "un usuario normal sí puede ver la lista");
});

await seccion("acceso: claves de Gemini en el servidor", async () => {
  const b = crearBackendMock({ usuarios: semilla(), sesion: YO, claveCompartida: null });
  await b.guardarClaveCompartida("CLAVE-COMPARTIDA");
  b._entrarComo(OTRO);
  ok((await b.leerClaveCompartida()) === "CLAVE-COMPARTIDA", "un usuario autorizado lee la clave compartida");
  ok(await falla(() => b.guardarClaveCompartida("otra"), "permiso"), "solo un admin cambia la compartida");
  await b.guardarClavePersonal("CLAVE-DE-OTRO");
  ok((await b.leerClavePersonal()) === "CLAVE-DE-OTRO", "guarda y lee su clave personal");
  b._entrarComo(YO);
  ok((await b.leerClavePersonal()) === null, "la clave personal de otro NO es visible (ni siquiera para un admin)");
  await b.guardarClavePersonal("CLAVE-MIA");
  b._entrarComo(OTRO);
  ok((await b.leerClavePersonal()) === "CLAVE-DE-OTRO", "cada usuario conserva la suya");
  await b.guardarClavePersonal(null);
  ok((await b.leerClavePersonal()) === null, "borrar la clave personal");
  b._entrarComo(YO);
  await b.guardarClaveCompartida(null);
  ok((await b.leerClaveCompartida()) === null, "el admin borra la compartida");
  b._entrarComo(EXTRAÑO);
  ok(await falla(() => b.leerClavePersonal(), "permiso"), "no autorizado no lee claves");
});

await seccion("acceso: login, logout y conexión", async () => {
  const b = crearBackendMock({ usuarios: semilla(), cuentaAlIniciar: OTRO });
  ok((await acceso.esperarSesion(b)) === null, "arranca sin sesión");
  const u = await b.iniciarSesion();
  ok(u.email === "otro@gmail.com" && (await b.obtenerPerfil()).rol === "usuario", "iniciarSesion deja la sesión activa");
  await b.cerrarSesion();
  ok((await b.obtenerPerfil()) === null, "cerrarSesion");
  const c = crearBackendMock({ usuarios: semilla(), sesion: YO });
  c._conexion(false);
  ok(await falla(() => c.listarUsuarios(), "offline"), "sin conexión => error 'offline'");
  const cancel = crearBackendMock({ usuarios: semilla(), cuentaAlIniciar: null });
  ok(await falla(() => cancel.iniciarSesion(), "cancelado"), "login cancelado => error 'cancelado'");
});

out.textContent += `\nRESULT: ${fallos ? "FAIL" : "OK"} (${total - fallos}/${total})\n`;
document.title = fallos ? "FAIL" : "OK";
</script>
