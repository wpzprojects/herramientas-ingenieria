<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>verify_ia</title>
<!--
  Arnes de pruebas de la capa de IA (js/ai/*), ejecutable en el navegador sin
  clave de API ni internet: el cliente de Gemini se reemplaza por un mock.

  Uso (desde la raiz del proyecto):
    python -m http.server 8000
    abrir http://localhost:8000/tools/verify_ia.html   -> lista PASS/FAIL
  o en modo consola:
    msedge --headless --dump-dom --virtual-time-budget=8000 http://localhost:8000/tools/verify_ia.html
-->
<style>body{font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:12px}#stage{display:none}</style>
</head>
<body>
<pre id="out"></pre>
<div id="stage"></div>
<script type="module">
window.__BASE_PATH__ = "../";
const out = document.getElementById("out");
let fallos = 0;
let total = 0;
function ok(cond, msg) {
  total++;
  if (!cond) fallos++;
  out.textContent += `${cond ? "PASS" : "FAIL"} ${msg}\n`;
}
function cerca(a, b, tol, msg) {
  ok(Math.abs(a - b) <= tol, `${msg} (obtenido ${a}, esperado ${b})`);
}
async function seccion(nombre, fn) {
  out.textContent += `\n== ${nombre}\n`;
  try {
    await fn();
  } catch (err) {
    fallos++;
    total++;
    out.textContent += `FAIL excepcion en "${nombre}": ${err && err.stack ? err.stack : err}\n`;
  }
}

await seccion("markdown", async () => {
  const h = markdownAHtml("# Titulo\n\nTexto con **negrita** y *cursiva* y `codigo`.\n\n- a\n- b\n  - b1\n\n1. uno\n2. dos\n\n| A | B |\n|---|---|\n| 1 | 2 |\n");
  ok(h.includes("<h2>Titulo</h2>"), "titulo # -> h2");
  ok(h.includes("<strong>negrita</strong>") && h.includes("<em>cursiva</em>") && h.includes("<code>codigo</code>"), "inline");
  ok(h.includes("<ul>") && h.includes("<ol>") && h.includes("<li>b1</li>"), "listas y anidada");
  ok(h.includes("<table>") && h.includes("<th class=\"wrap\">A</th>") && h.includes("<td class=\"wrap\">2</td>"), "tabla");
  // "<\/script>" evita que el parser HTML cierre este bloque <script> antes de tiempo
  const x = markdownAHtml("<script>alert(1)<\/script> [x](javascript:alert(1)) [ok](https://a.com)");
  ok(!x.includes("<script") && !x.includes("href=\"javascript"), "escapa HTML y bloquea javascript:");
  ok(x.includes('href="https://a.com"'), "enlace https permitido");
});

await seccion("gemini (mock)", async () => {
  gemini.usarMock(async ({ ruta, cuerpo }) => {
    if (ruta.startsWith("/models?")) {
      return { models: [
        { name: "models/gemini-2.5-flash", displayName: "F", supportedGenerationMethods: ["generateContent"] },
        { name: "models/gemini-2.5-flash-lite", supportedGenerationMethods: ["generateContent"] },
        { name: "models/gemini-3-pro-preview", supportedGenerationMethods: ["generateContent"] },
        { name: "models/gemini-2.5-flash-image", supportedGenerationMethods: ["generateContent"] },
        { name: "models/text-embedding-004", supportedGenerationMethods: ["embedContent"] },
      ] };
    }
    return { candidates: [{ finishReason: "STOP", content: { role: "model", parts: [
      { text: "hola " }, { text: "mundo" },
      { functionCall: { name: "f1", args: { a: 1 } } },
    ] } }], _eco: cuerpo };
  });
  const modelos = await gemini.listarModelos("k");
  ok(modelos.length === 4 && !modelos.some((m) => m.id.includes("embedding")), "lista solo modelos con generateContent");
  ok(gemini.elegirModeloPorDefecto(modelos) === "gemini-2.5-flash", `modelo por defecto = flash estable (${gemini.elegirModeloPorDefecto(modelos)})`);
  const r = await gemini.generar({ clave: "k", modelo: "m", contenidos: [], temperatura: 0.2 });
  ok(r.texto === "hola mundo" && r.llamadas.length === 1 && r.llamadas[0].name === "f1", "parsea texto y llamadas a funciones");
  ok(r.content.role === "model" && r.content.parts.length === 3, "conserva el turno completo del modelo");
  gemini.usarMock(async () => ({ candidates: [], promptFeedback: { blockReason: "SAFETY" } }));
  let err = null;
  try { await gemini.generar({ clave: "k", modelo: "m", contenidos: [] }); } catch (e) { err = e; }
  ok(err && err.tipo === "bloqueo", "bloqueo de seguridad -> ErrorGemini(bloqueo)");
  gemini.usarMock(null);
});

await seccion("openai (mock)", async () => {
  openai.usarMock(async ({ ruta, cuerpo }) => {
    if (ruta.startsWith("/models")) {
      return { data: [{ id: "gpt-5-mini" }, { id: "gpt-5" }, { id: "gpt-4.1-preview" }, { id: "whisper-1" }, { id: "text-embedding-3-large" }] };
    }
    return {
      choices: [{ finish_reason: "tool_calls", message: { content: "hola mundo", tool_calls: [{ id: "x", type: "function", function: { name: "f1", arguments: '{"a":1}' } }] } }],
      _eco: cuerpo,
    };
  });
  const modelos = await openai.listarModelos("k");
  ok(modelos.length === 3 && !modelos.some((m) => m.id.includes("whisper") || m.id.includes("embedding")), "lista solo modelos de chat, sin whisper/embeddings");
  ok(openai.elegirModeloPorDefecto(modelos) === "gpt-5-mini", `modelo por defecto = mini estable (${openai.elegirModeloPorDefecto(modelos)})`);
  const r = await openai.generar({ clave: "k", modelo: "m", contenidos: [], temperatura: 0.2 });
  ok(r.texto === "hola mundo" && r.llamadas.length === 1 && r.llamadas[0].name === "f1" && r.llamadas[0].args.a === 1, "parsea texto y llamadas a funciones (forma Gemini)");
  ok(r.content.role === "model" && r.content.parts.length === 2, "reconstruye el turno en forma neutra (texto + functionCall)");
  openai.usarMock(async () => ({ choices: [{ finish_reason: "content_filter", message: {} }] }));
  let err = null;
  try { await openai.generar({ clave: "k", modelo: "m", contenidos: [] }); } catch (e) { err = e; }
  ok(err && err.tipo === "bloqueo", "content_filter -> ErrorOpenAI(bloqueo)");
  openai.usarMock(async () => { throw new openai.ErrorOpenAI("clave invalida", { tipo: "clave", status: 401 }); });
  err = null;
  try { await openai.generar({ clave: "k", modelo: "m", contenidos: [] }); } catch (e) { err = e; }
  ok(err && err.tipo === "clave" && !(err instanceof gemini.ErrorGemini), "propaga ErrorOpenAI (no ErrorGemini) con su tipo");
  openai.usarMock(null);
});

await seccion("anthropic (mock)", async () => {
  anthropic.usarMock(async ({ ruta, cuerpo }) => {
    if (ruta.startsWith("/models")) {
      return { data: [{ id: "claude-sonnet-4-5", display_name: "Sonnet" }, { id: "claude-haiku-4-5" }, { id: "claude-opus-4-1" }], has_more: false };
    }
    return { stop_reason: "tool_use", content: [{ type: "text", text: "hola mundo" }, { type: "tool_use", id: "x", name: "f1", input: { a: 1 } }], _eco: cuerpo };
  });
  const modelos = await anthropic.listarModelos("k");
  ok(modelos.length === 3, "lista los modelos del catálogo");
  ok(anthropic.elegirModeloPorDefecto(modelos) === "claude-sonnet-4-5", `modelo por defecto = sonnet estable (${anthropic.elegirModeloPorDefecto(modelos)})`);
  const r = await anthropic.generar({ clave: "k", modelo: "m", contenidos: [], maxTokens: 1024 });
  ok(r.texto === "hola mundo" && r.llamadas.length === 1 && r.llamadas[0].name === "f1" && r.llamadas[0].args.a === 1, "parsea texto y tool_use (forma Gemini)");
  ok(r.content.role === "model" && r.content.parts.length === 2, "reconstruye el turno en forma neutra (texto + functionCall)");
  anthropic.usarMock(async () => ({ content: [{ type: "tool_use", id: "x", name: "f1", input: {} }] }));
  const sinTexto = await anthropic.generar({ clave: "k", modelo: "m", contenidos: [], maxTokens: 1024 });
  ok(sinTexto.texto === "" && sinTexto.llamadas.length === 1, "solo tool_use, sin bloque de texto: texto vacío y 1 llamada");
  anthropic.usarMock(async () => { throw new anthropic.ErrorAnthropic("saturado", { tipo: "servidor", status: 529 }); });
  let err = null;
  try { await anthropic.generar({ clave: "k", modelo: "m", contenidos: [], maxTokens: 1024 }); } catch (e) { err = e; }
  ok(err && err.tipo === "servidor", "529 (overloaded) -> ErrorAnthropic(servidor)");
  anthropic.usarMock(null);
});

await seccion("agentes", async () => {
  const lista = agentes.AGENTES_POR_DEFECTO;
  ok(lista.length === 4 && lista.every((a) => a.predefinido), "4 agentes predeterminados");
  const s = agentes.construirSistema({ ...lista[0], ejemplos: [{ antes: "hola q tal", despues: "Hola, ¿cómo estás?" }] });
  ok(s.includes("Tono requerido: Profesional cordial") && s.includes("Ejemplo 1") && s.includes("sin formato Markdown"), "construirSistema arma tono, ejemplos y formato");
  const s2 = agentes.construirSistema({ ...lista[0], explicarCambios: true });
  ok(s2.includes("Cambios realizados"), "explicarCambios agrega seccion");
  const sSin = agentes.construirSistema({ ...lista[0], tono: "" });
  ok(!sSin.includes("Tono requerido") && sSin.includes(lista[0].instrucciones), "sin tono: no se agrega la línea de tono y se conservan las instrucciones");
  ok(agentes.nuevoAgenteVacio().tono === "", "un agente nuevo empieza sin tono");
  const impSin = agentes.importarAgentesJson(agentes.exportarAgentesJson([{ ...lista[0], tono: "" }, { ...lista[0], tono: "Inventado" }]));
  ok(impSin[0].tono === "" && impSin[1].tono === "Profesional cordial", "importar conserva «sin tono» y normaliza un tono desconocido");
  let e1 = null;
  try { agentes.importarAgentesJson("no es json"); } catch (e) { e1 = e; }
  ok(!!e1, "importar JSON invalido lanza error");
  const imp = agentes.importarAgentesJson(agentes.exportarAgentesJson(lista));
  ok(imp.length === 4 && imp.every((a) => a.predefinido === false), "exportar/importar ida y vuelta");
});

await seccion("openai/anthropic: envuelven el mismo esquema de tools.js sin perder required/enum", async () => {
  const decl = tools.declaraciones();
  const original = decl.find((d) => d.name === "barrer_parametro");

  // openai.js no expone la traduccion de herramientas como funcion publica (vive dentro de generar);
  // se verifica mandando un mock que hace eco del cuerpo enviado.
  let cuerpoOpenAI = null;
  openai.usarMock(async ({ cuerpo }) => {
    cuerpoOpenAI = cuerpo;
    return { choices: [{ finish_reason: "stop", message: { content: "ok" } }] };
  });
  await openai.generar({ clave: "k", modelo: "m", contenidos: [], herramientas: decl, modoHerramientas: "AUTO" });
  const wOpenAI = cuerpoOpenAI.tools.find((t) => t.function.name === "barrer_parametro");
  ok(wOpenAI.type === "function" && wOpenAI.function.parameters === original.parameters, "OpenAI: {type:'function', function:{name, description, parameters}} con el mismo JSON Schema");
  ok(cuerpoOpenAI.tool_choice === "auto", "OpenAI: modoHerramientas AUTO -> tool_choice 'auto'");
  openai.usarMock(null);

  let cuerpoAnthropic = null;
  anthropic.usarMock(async ({ cuerpo }) => {
    cuerpoAnthropic = cuerpo;
    return { content: [{ type: "text", text: "ok" }] };
  });
  await anthropic.generar({ clave: "k", modelo: "m", contenidos: [], herramientas: decl, modoHerramientas: "NONE", maxTokens: 100 });
  const wAnthropic = cuerpoAnthropic.tools.find((t) => t.name === "barrer_parametro");
  ok(wAnthropic.input_schema === original.parameters, "Anthropic: {name, description, input_schema} con el mismo JSON Schema (sin copiar/perder campos)");
  ok(wAnthropic.input_schema.properties.herramienta.enum.length === 6 && (wAnthropic.input_schema.required || []).every((r) => r in wAnthropic.input_schema.properties), "conserva enum del barrido y required valido");
  ok(cuerpoAnthropic.tool_choice.type === "none", "Anthropic: modoHerramientas NONE -> tool_choice {type:'none'}");
  anthropic.usarMock(null);
});

await seccion("tools: Varios (conversión de unidades y de coordenadas)", async () => {
  const { convertirCoordenadas, SISTEMAS } = await import("../js/calc/coordenadas.js");
  const { convertirUnidad } = await import("../js/calc/unidades.js");
  const tabla = await (await fetch("../data/factores-conversion.json")).json();
  const unid = (o, ctx = ctxNuevo()) => tools.ejecutarLlamada("convertir_unidades", o, ctx);
  const coor = (o, ctx = ctxNuevo()) => tools.ejecutarLlamada("convertir_coordenadas", o, ctx);
  const decl = tools.declaraciones().filter((d) => d.name.startsWith("convertir_"));
  ok(decl.length === 2 && decl.every((d) => d.description && Object.keys(d.parameters.properties).length >= 4), "ambas se declaran con descripción y parámetros");

  // --- unidades
  const cats = [...new Set(tabla.map((r) => r.categoria))];
  const dUnid = decl.find((d) => d.name === "convertir_unidades").description;
  ok(cats.every((c) => dUnid.includes(c)), `la descripción menciona las ${cats.length} categorías de la tabla (si cambia el JSON, actualizarla)`);
  ok(cats.every((c) => { const us = [...new Set(tabla.filter((r) => r.categoria === c).flatMap((r) => [r.unidad_origen, r.unidad_destino]))]; return new Set(us.map((u) => u.toLowerCase())).size === us.length; }), "ninguna categoría tiene unidades que difieran solo en mayúsculas (la comparación tolerante no es ambigua)");

  const ctx1 = ctxNuevo();
  const u1 = await unid({ categoria: "Longitud", unidad_origen: "m", unidad_destino: "ft", valor: 10 }, ctx1);
  const esperado1 = convertirUnidad(tabla, { categoria: "Longitud", unidadOrigen: "m", unidadDestino: "ft", valor: 10 });
  cerca(u1.resultados[0].valor, esperado1, 1e-4, "10 m → ft coincide con el motor");
  ok(u1.ok === true && ctx1.log.at(-1).resultados[0].dec === undefined && ctx1.log.at(-1).entradas.map((e) => e.clave).join() === "categoria,unidad_origen,unidad_destino,valor", "entradas de la corrida: categoría, unidades y valor; resultado sin decimales fijos");
  cerca((await unid({ categoria: "Temperatura", unidad_origen: "C", unidad_destino: "F", valor: 100 })).resultados[0].valor, 212, 1e-9, "100 °C = 212 °F (factor con offset)");
  cerca((await unid({ categoria: "Temperatura", unidad_origen: "F", unidad_destino: "C", valor: 212 })).resultados[0].valor, 100, 1e-3, "212 °F = 100 °C (conversión inversa de la tabla)");
  cerca((await unid({ categoria: "longitud", unidad_origen: "M", unidad_destino: "FT", valor: 1 })).resultados[0].valor, 1 / 0.3048, 1e-9, "mayúsculas/minúsculas tolerantes en categoría y unidades");
  const e1 = await unid({ categoria: "longitud", unidad_origen: "M", unidad_destino: "FT", valor: 1 });
  ok(e1.entradas_usadas.find((e) => e.nombre === "Unidad de destino").valor === "ft", "las entradas muestran el nombre canónico de la unidad");
  const m1 = await unid({ categoria: "Inventada", unidad_origen: "kg", unidad_destino: "lb", valor: 1 });
  ok(m1.ok === false && m1.error.includes("Categorías:") && m1.error.includes("Longitud"), "categoría inexistente: error que lista las categorías");
  const m2 = await unid({ categoria: "Fuerza", unidad_origen: "m", unidad_destino: "N", valor: 1 });
  ok(m2.ok === false && m2.error.includes("Fuerza") && m2.error.includes("kgf"), "unidad inexistente en la categoría: error que lista sus unidades");
  const m3 = await unid({ categoria: "Longitud", unidad_origen: "mm", unidad_destino: "km", valor: 5 });
  ok(m3.ok === true && Math.abs(m3.resultados[0].valor - 5e-6) < 1e-15, "con el catálogo completo cualquier unidad se convierte a cualquier otra (mm → km, que no estaba en la tabla de pares)");
  ok((await unid({ categoria: "Longitud", unidad_origen: "m", unidad_destino: "ft" })).ok === false, "falta el valor: error de parámetro");

  // --- coordenadas
  const dCoor = decl.find((d) => d.name === "convertir_coordenadas");
  ok(dCoor.parameters.properties.sistema_origen.enum === undefined && SISTEMAS.every((s) => dCoor.description.includes(s.label)), "la descripción lista los 7 sistemas principales del motor y el código EPSG ya no es un enum (acepta ~500 códigos)");
  const sys = (epsg) => SISTEMAS.find((s) => s.epsg === epsg);
  const c2 = ctxNuevo();
  const k1 = await coor({ sistema_origen: "4326", sistema_destino: "9377", este_o_longitud: -74.0721, norte_o_latitud: 4.7110 }, c2);
  const esp = convertirCoordenadas(sys(4326), sys(9377), -74.0721, 4.7110);
  cerca(k1.resultados.find((r) => r.nombre === "Este").valor, esp.xOut, 1e-3, "WGS84 → Origen Único: Este coincide con el motor");
  cerca(k1.resultados.find((r) => r.nombre === "Norte").valor, esp.yOut, 1e-3, "WGS84 → Origen Único: Norte coincide con el motor");
  ok(c2.log.at(-1).resultados.map((r) => r.clave).join() === "este,norte" && c2.log.at(-1).entradas.map((e) => e.etiqueta).join() === "Sistema de entrada,Sistema de salida,Longitud,Latitud", "entradas etiquetadas según el sistema de origen y resultados según el de destino");
  const k2 = await coor({ sistema_origen: 9377, sistema_destino: 4326, este_o_longitud: esp.xOut, norte_o_latitud: esp.yOut });
  cerca(k2.resultados.find((r) => r.nombre === "Longitud").valor, -74.0721, 1e-6, "ida y vuelta: longitud recuperada (el código EPSG puede llegar como número)");
  cerca(k2.resultados.find((r) => r.nombre === "Latitud").valor, 4.7110, 1e-6, "ida y vuelta: latitud recuperada");
  cerca(k2.entradas_usadas.find((e) => e.nombre === "Este").valor, esp.xOut, 1e-3, "el eco de las entradas conserva la precisión al metro (no se redondea a 6 cifras)");
  const r1 = await coor({ sistema_origen: "4326", sistema_destino: "3116", este_o_longitud: 4.711, norte_o_latitud: -74.07 });
  ok(r1.ok === true, "longitud y latitud intercambiadas pero dentro de rango no se detectan (por eso los nombres de los parámetros son explícitos)");
  const r2 = await coor({ sistema_origen: "4326", sistema_destino: "3116", este_o_longitud: 4.7, norte_o_latitud: -200 });
  ok(r2.ok === false && r2.error.includes("latitud"), "latitud fuera de -90..90: error");
  const r3 = await coor({ sistema_origen: "4326", sistema_destino: "3116", este_o_longitud: 500, norte_o_latitud: 4 });
  ok(r3.ok === false && r3.error.includes("longitud"), "longitud fuera de -180..180: error");
  const r4 = await coor({ sistema_origen: "1234", sistema_destino: "3116", este_o_longitud: 1, norte_o_latitud: 1 });
  ok(r4.ok === false && r4.error.includes("uno de"), "código EPSG desconocido: error que lista los válidos");
  const r5 = await coor({ sistema_origen: "3116", sistema_destino: "4326", este_o_longitud: -74.07, norte_o_latitud: 4.71 });
  ok(r5.ok === true && (r5.notas || []).some((n) => n.includes("parecen grados")), "valores en grados con sistema proyectado: se agrega una nota de advertencia");

  // el barrido no ofrece las de Varios
  const enumBarrido = tools.declaraciones().find((d) => d.name === "barrer_parametro").parameters.properties.herramienta.enum;
  ok(!enumBarrido.includes("convertir_unidades") && !enumBarrido.includes("convertir_coordenadas"), "el barrido de parámetros no incluye las herramientas de Varios");
});

await seccion("tools: conversión de coordenadas con códigos EPSG, varios puntos y avisos", async () => {
  const eps = await import("../js/calc/coordenadas-epsg.js");
  const { cargarProj4 } = await import("../js/util/proj4.js");
  const proj4 = await cargarProj4();
  const catalogo = await (await fetch("../data/sistemas-epsg.json")).json();
  const coor = (o, ctx = ctxNuevo()) => tools.ejecutarLlamada("convertir_coordenadas", o, ctx);
  const dato = (r, nombre) => r.resultados.find((x) => x.nombre === nombre)?.valor;

  // sistema fuera de los 7: UTM 17N (EPSG 32617) -> MAGNA Bogotá (3116), igual que el motor EPSG de la pantalla
  const esp = eps.convertirEntreSistemas(proj4, catalogo, "4326", "32617", -79.5, 8.9);
  const a = await coor({ sistema_origen: "4326", sistema_destino: "32617", este_o_longitud: -79.5, norte_o_latitud: 8.9 });
  ok(a.ok === true, `WGS84 → UTM 17N (fuera de los 7): ${a.error || "ok"}`);
  cerca(dato(a, "Este"), esp.x, 1e-6, "UTM 17N: Este = motor EPSG de la pantalla");
  cerca(dato(a, "Norte"), esp.y, 1e-6, "UTM 17N: Norte = motor EPSG de la pantalla");
  const vuelta = await coor({ sistema_origen: "32617", sistema_destino: "4326", este_o_longitud: esp.x, norte_o_latitud: esp.y });
  cerca(dato(vuelta, "Longitud"), -79.5, 1e-7, "ida y vuelta por EPSG: longitud recuperada");
  cerca(dato(vuelta, "Latitud"), 8.9, 1e-7, "ida y vuelta por EPSG: latitud recuperada");

  // formatos del código y nombres en las entradas
  const ctx = ctxNuevo();
  const b = await coor({ sistema_origen: "EPSG:4326", sistema_destino: 32617, este_o_longitud: -79.5, norte_o_latitud: 8.9 }, ctx);
  ok(b.ok === true && ctx.log.at(-1).entradas.some((e) => e.etiqueta === "Sistema de salida" && String(e.valor).startsWith("32617 - ")), "acepta «EPSG:4326» y un número; la entrada muestra «código - nombre»");

  // 7 sistemas: siguen dando lo del motor original, y con aviso de area de uso
  const sys = (epsg) => SISTEMAS.find((s) => s.epsg === epsg);
  const { convertirCoordenadas: conv, SISTEMAS } = await import("../js/calc/coordenadas.js");
  const orig = conv(sys(4326), sys(3116), -74.07, 4.71);
  const c = await coor({ sistema_origen: "4326", sistema_destino: "3116", este_o_longitud: -74.07, norte_o_latitud: 4.71 });
  cerca(dato(c, "Este"), orig.xOut, 1e-6, "entre los 7 sistemas se usa el motor original (Este)");
  ok(!(c.notas || []).some((n) => n.includes("área de uso")), "un punto de Bogotá en 3116: sin aviso de área de uso");
  const fuera = await coor({ sistema_origen: "4326", sistema_destino: "3116", este_o_longitud: 2.35, norte_o_latitud: 48.85 });
  ok(fuera.ok === true && (fuera.notas || []).some((n) => n.includes("área de uso")), "un punto de París en un sistema de Colombia: aviso de área de uso");
  const fuera2 = await coor({ sistema_origen: "4326", sistema_destino: "32617", este_o_longitud: 2.35, norte_o_latitud: 48.85 });
  ok((fuera2.notas || []).some((n) => n.includes("área de uso")), "también con un sistema EPSG fuera de los 7");

  // varios puntos
  const ctxP = ctxNuevo();
  const p = await coor({ sistema_origen: "4326", sistema_destino: "9377", puntos: [{ este_o_longitud: -74.07, norte_o_latitud: 4.71 }, { este_o_longitud: -75.57, norte_o_latitud: 6.25 }] }, ctxP);
  const o1 = conv(sys(4326), sys(9377), -74.07, 4.71);
  const o2 = conv(sys(4326), sys(9377), -75.57, 6.25);
  ok(p.ok === true && p.resultados.length === 4, "dos puntos: cuatro resultados");
  cerca(dato(p, "Punto 1 — Este"), o1.xOut, 1e-4, "punto 1: Este");
  cerca(dato(p, "Punto 2 — Norte"), o2.yOut, 1e-4, "punto 2: Norte");
  ok(ctxP.log.at(-1).resultados.map((r) => r.clave).join() === "punto1_este,punto1_norte,punto2_este,punto2_norte", "claves punto1_*, punto2_*");
  const p3 = await coor({ sistema_origen: "4326", sistema_destino: "9377", puntos: [{ este_o_longitud: -74, norte_o_latitud: 4 }, { este_o_longitud: -74 }] });
  ok(p3.ok === false && p3.error.includes("punto 2"), "a un punto le falta una coordenada: el error dice cuál");
  const many = Array.from({ length: 51 }, () => ({ este_o_longitud: -74, norte_o_latitud: 4 }));
  ok((await coor({ sistema_origen: "4326", sistema_destino: "9377", puntos: many })).ok === false, "más de 50 puntos: error");
  const sinNada = await coor({ sistema_origen: "4326", sistema_destino: "9377" });
  ok(sinNada.ok === false && sinNada.error.includes("puntos"), "sin coordenadas: el error pide el punto o la lista");

  // errores
  const e1 = await coor({ sistema_origen: "99999", sistema_destino: "3116", este_o_longitud: 1, norte_o_latitud: 1 });
  ok(e1.ok === false && e1.error.includes("99999") && e1.error.includes("3116"), "código EPSG que no está: el error lo dice y lista los principales");
  const e2 = await coor({ sistema_origen: "hola", sistema_destino: "3116", este_o_longitud: 1, norte_o_latitud: 1 });
  ok(e2.ok === false, "código con formato inválido: error");
});

  // el bloqueo lo hace el codigo, aunque el modelo pida una herramienta no habilitada
  const ctx = ctxNuevo();

  ok(a.ok === false && a.error.includes("no está habilitada") && a.error.includes("calcular_perdidas") && ctx.log.length === 0, "llamada a una herramienta no habilitada: error y sin corrida");
  const b = await tools.ejecutarLlamada("calcular_perdidas", { ...LINEA, factor_carga: 0.5, resistencia_ohm_km: 0.3 }, ctx);
  ok(b.ok === true && ctx.log.length === 1, "la herramienta habilitada sigue funcionando");
  const c = await tools.ejecutarLlamada("barrer_parametro", { herramienta: "calcular_regulacion", parametros_json: "{}", parametro: "longitud_km", desde: 1, hasta: 2 }, ctx);
  ok(c.ok === false && !c.puntos, "barrido de una calculadora no habilitada (y del propio barrido): error");
  ctx.permitidas.add("barrer_parametro");
  const d = await tools.ejecutarLlamada("barrer_parametro", { herramienta: "calcular_regulacion", parametros_json: "{}", parametro: "longitud_km", desde: 1, hasta: 2 }, ctx);
  ok(d.ok === false && d.error.includes("no está habilitada") && ctx.presupuesto.usado === 1, "barrido con calculadora no habilitada: error y no consume presupuesto");
});

await seccion("tools: pérdidas", async () => {
  const ctx = ctxNuevo();
  const r = await tools.ejecutarLlamada("calcular_perdidas", { ...LINEA, factor_carga: 0.564, red: "Aerea", material: "ACSR", calibre: "4/0" }, ctx);
  ok(r.ok === true, "ejecuta sin error");
  // formula independiente (factor de perdidas cuadratico de Buller-Woodrow, 0.3*Fc+0.7*Fc^2)
  const I = (9.9 * 1000) / (34.5 * 0.95 * Math.sqrt(3));
  const esperado = (Math.sqrt(3) * I * ACSR_4_0.r_ac_75c_ohm_km * 5.2 * (0.3 * 0.564 + 0.7 * 0.564 * 0.564) * 100) / (34.5 * 1000 * 0.95);
  cerca(salida(ctx, "perdidas_pct"), esperado, 1e-9, "pérdidas % coincide con fórmula independiente");
  cerca(salida(ctx, "corriente_a"), I, 1e-9, "corriente coincide");
  const ctx2 = ctxNuevo();
  await tools.ejecutarLlamada("calcular_perdidas", { ...LINEA, factor_carga: 0.564, resistencia_ohm_km: ACSR_4_0.r_ac_75c_ohm_km }, ctx2);
  cerca(salida(ctx2, "perdidas_pct"), esperado, 1e-9, "resistencia manual = catálogo");
  ok(ctx.log[0].entradas.some((e) => e.clave === "conductor") && ctx.log[0].supuestos.length === 0, "log: entradas con conductor y sin supuestos");
});

await seccion("tools: conductor económico", async () => {
  const engEconomico = await import("../js/calc/conductor-economico.js");
  const ACSR_1_0 = desnudos.find((c) => c.tipo === "ACSR" && c.calibre_awg_kcmil === "1/0");
  const base = { tension_kv: 34.5, potencia_mw: 9.9, factor_potencia: 0.95, longitud_km: 5.2, factor_carga: 0.4, anios: 25, tasa_descuento_pct: 10, precio_kwh: 450, escalada_energia_pct: 2.5 };
  const opciones = [
    { red: "Aerea", material: "ACSR", calibre: "1/0", costo_conductor_km: 9e6, costo_instalacion_km: 60e6 },
    { red: "Aerea", material: "ACSR", calibre: "4/0", costo_conductor_km: 14e6, costo_instalacion_km: 60e6 },
  ];
  const ctx = ctxNuevo();
  const r = await tools.ejecutarLlamada("calcular_conductor_economico", { ...base, opciones }, ctx);
  ok(r.ok === true, "ejecuta sin error");

  const baseMotor = { tensionLineaKv: 34.5, potenciaActivaMw: 9.9, factorPotencia: 0.95, longitudKm: 5.2, factorCarga: 0.4, anios: 25, tasaDescuentoPct: 10, precioKwh: 450, escaladaEnergiaPct: 2.5, crecimientoDemandaPct: 0 };
  const opA = { resistenciaOhmKm: ACSR_1_0.r_ac_75c_ohm_km, numConductoresPorFase: 1, costoConductorKm: 9e6, costoInstalacionKm: 60e6 };
  const opB = { resistenciaOhmKm: ACSR_4_0.r_ac_75c_ohm_km, numConductoresPorFase: 1, costoConductorKm: 14e6, costoInstalacionKm: 60e6 };
  const directo = engEconomico.compararOpciones(baseMotor, [opA, opB]);
  cerca(salida(ctx, "opcion1_costo_total"), directo.opciones[0].costoTotal, 1e-3, "opción 1: costo total = motor");
  cerca(salida(ctx, "opcion2_costo_total"), directo.opciones[1].costoTotal, 1e-3, "opción 2: costo total = motor");
  ok(salida(ctx, "opcion_menor_costo").includes(`Opción ${directo.mejor + 1}`), "opción de menor costo coincide con el motor");

  const pocas = await tools.ejecutarLlamada("calcular_conductor_economico", { ...base, opciones: [opciones[0]] }, ctxNuevo());
  ok(pocas.ok === false && /entre 2 y 5/.test(pocas.error), "menos de 2 opciones: error claro");
  const muchas = await tools.ejecutarLlamada("calcular_conductor_economico", { ...base, opciones: Array(6).fill(opciones[0]) }, ctxNuevo());
  ok(muchas.ok === false && /entre 2 y 5/.test(muchas.error), "más de 5 opciones: error claro");

  const sinCosto = await tools.ejecutarLlamada("calcular_conductor_economico", { ...base, opciones: [opciones[0], { red: "Aerea", material: "ACSR", calibre: "4/0" }] }, ctxNuevo());
  ok(sinCosto.ok === false && /costo_conductor_km/.test(sinCosto.error), "falta costo_conductor_km en una opción: error claro");

  const rManual = await tools.ejecutarLlamada(
    "calcular_conductor_economico",
    { ...base, opciones: [{ resistencia_ohm_km: ACSR_1_0.r_ac_75c_ohm_km, costo_conductor_km: 9e6 }, { resistencia_ohm_km: ACSR_4_0.r_ac_75c_ohm_km, costo_conductor_km: 14e6 }] },
    ctxNuevo()
  );
  ok(rManual.ok === true, "acepta resistencia manual sin catálogo (y costo de instalación vacío)");

  ok(ctx.log[0].notas.some((n) => n.includes("valor residual")), "nota de alcance (sin valor residual ni O&M)");
  ok(tools.HERRAMIENTAS_ESTANDAR.includes("calcular_conductor_economico"), "está en el agente estándar (2026-09-23, pedido del usuario)");

  // sensibilidad al costo de instalacion (2026-09-23): solo aparece si falta el dato en alguna opcion
  const tieneCampo = (c, clave) => c.log.at(-1).resultados.some((r) => r.clave === clave);
  ok(!tieneCampo(ctx, "opcion1_umbral_instalacion_km") && !tieneCampo(ctx, "opcion2_umbral_instalacion_km") && !ctx.log.at(-1).notas.some((n) => n.includes("umbral_instalacion_km")), "con costo de instalación indicado en ambas opciones, no aparece el umbral ni su nota");

  const ctxSinInst = ctxNuevo();
  const opcionesSinInst = [
    { red: "Aerea", material: "ACSR", calibre: "1/0", costo_conductor_km: 9e6 },
    { red: "Aerea", material: "ACSR", calibre: "4/0", costo_conductor_km: 14e6 },
  ];
  const rSinInst = await tools.ejecutarLlamada("calcular_conductor_economico", { ...base, opciones: opcionesSinInst }, ctxSinInst);
  ok(rSinInst.ok === true, "sin costo de instalación en ninguna opción: igual calcula");
  const directoSinInst = engEconomico.compararOpciones(baseMotor, [{ ...opA, costoInstalacionKm: 0 }, { ...opB, costoInstalacionKm: 0 }]);
  const filasInst = engEconomico.sensibilidadInstalacion(directoSinInst, baseMotor.longitudKm, [false, false]);
  const perdedora = filasInst[0].opcion + 1;
  cerca(salida(ctxSinInst, `opcion${perdedora}_umbral_instalacion_km`), filasInst[0].umbralKm, 1e-3, "opcionN_umbral_instalacion_km coincide con sensibilidadInstalacion del motor");
  ok(!tieneCampo(ctxSinInst, `opcion${directoSinInst.mejor + 1}_umbral_instalacion_km`), "la opción ganadora no lleva su propio umbral (se compara contra ella, no consigo misma)");
  ok(ctxSinInst.log.at(-1).notas.some((n) => n.includes("umbral_instalacion_km") && n.includes("DIFERENCIA") && n.includes("no dice cuál instalación sería más cara")), "la nota aclara que es una diferencia neutral, no una estimación ni una dirección");
});

await seccion("tools: ampacidad subterránea con corriente circulante / tensión inducida en la pantalla", async () => {
  const pant = await import("../js/calc/ampacidad-subterranea-pantalla.js");
  const val = (ctx, clave) => ctx.log.at(-1).resultados.find((x) => x.clave === clave)?.valor;
  const cable = cables.find((c) => c.material === "Cobre" && c.calibre_awg_kcmil === "1/0 AWG" && c.tipo_pantalla === "Hilos" && c.nivel_aislamiento_kv === 15 && c.nivel_aislamiento_pct === 100);
  const datos = (puestaTierra, tipoCable = "Monopolar") => ({
    tipoCable, cable, tipoPantalla: "Hilos", nivelAislamientoKv: 15, puestaTierra, tensionSistemaKv: 34.5, frecuenciaHz: 60,
    tempMaxC: 90, tempTerrenoC: 25, rhoSueloKmW: 1, uDuctoKmW: 0.3, separacionFasesM: 0.04, numCircuitos: 1, profundidadBancoM: 1, separacionDuctosM: 0.2,
  });
  const base = { material: "Cobre", calibre: "1/0", tipo_pantalla: "Hilos", nivel_aislamiento_kv: 15 };

  // ambos extremos: corriente circulante
  let ctx = ctxNuevo();
  await tools.ejecutarLlamada("calcular_ampacidad_subterranea", { ...base, puesta_tierra: "Ambos Extremos" }, ctx);
  const amp = val(ctx, "ampacidad_a");
  const esp = pant.calcularPantalla(datos("Ambos Extremos"), amp);
  ok(esp.tipo === "circulante", "el motor de pantalla da corriente circulante con ambos extremos");
  cerca(val(ctx, "corriente_circulante_pantalla_a"), esp.corrienteA, 1e-9, "corriente circulante = la de la pantalla de la app");
  ok(val(ctx, "tension_inducida_pantalla_v_km") === undefined, "ambos extremos: no se informa tensión inducida");
  ok(val(ctx, "corriente_circulante_pantalla_a") > 0 && val(ctx, "corriente_circulante_pantalla_a") < amp, "la corriente circulante es positiva y menor que la ampacidad");

  // unipuntual y cross-bonding: tension inducida
  for (const pt of ["Unipuntual", "Cross-bonding"]) {
    ctx = ctxNuevo();
    await tools.ejecutarLlamada("calcular_ampacidad_subterranea", { ...base, puesta_tierra: pt }, ctx);
    const e = pant.calcularPantalla(datos(pt), val(ctx, "ampacidad_a"));
    cerca(val(ctx, "tension_inducida_pantalla_v_km"), e.tensionVKm, 1e-9, `${pt}: tensión inducida (V/km) = la de la pantalla de la app`);
    ok(val(ctx, "corriente_circulante_pantalla_a") === undefined && ctx.log.at(-1).notas.some((n) => n.includes("no circula corriente")), `${pt}: sin corriente circulante y con nota explicativa`);
  }

  // tripolar: no aplica
  ctx = ctxNuevo();
  await tools.ejecutarLlamada("calcular_ampacidad_subterranea", { ...base, tipo_cable: "Tripolar" }, ctx);
  ok(val(ctx, "corriente_circulante_pantalla_a") === undefined && val(ctx, "tension_inducida_pantalla_v_km") === undefined && val(ctx, "ampacidad_a") > 0, "tripolar: no se calcula la pantalla (la ampacidad sí)");

  // la ampacidad no cambia con lo agregado
  ctx = ctxNuevo();
  await tools.ejecutarLlamada("calcular_ampacidad_subterranea", base, ctx);
  cerca(val(ctx, "ampacidad_a"), engAmpSubt.calcularAmpacidadSubterranea(datos("Unipuntual")).ampacidad, 1e-9, "la ampacidad sigue igual al motor");
});

await seccion("tools: pérdidas y regulación con varios tramos, dato de partida y haz", async () => {
  const pt = await import("../js/calc/perdidas-tramos.js");
  const rt = await import("../js/calc/regulacion-tramos.js");
  const r4 = ACSR_4_0.r_ac_75c_ohm_km;
  const rmg4 = ACSR_4_0.radio_medio_geometrico_mm;
  const val = (ctx, clave) => ctx.log.at(-1).resultados.find((x) => x.clave === clave)?.valor;
  const base = { tension_kv: 34.5, factor_potencia: 0.95, factor_carga: 0.564, red: "Aerea", material: "ACSR", calibre: "4/0" };

  // --- dato de partida
  let ctx = ctxNuevo();
  const a = await tools.ejecutarLlamada("calcular_perdidas", { ...base, potencia_mva: 10, longitud_km: 5 }, ctx);
  const pAct = 10 * 0.95;
  const espA = pt.calcularPerdidasTramos({ tensionLineaKv: 34.5, potenciaActivaMw: pAct, factorPotencia: 0.95, factorCarga: 0.564 }, [{ resistenciaOhmKm: r4, longitudKm: 5 }]);
  ok(a.ok === true, "pérdidas con potencia aparente (MVA) como dato de partida");
  cerca(val(ctx, "perdidas_pct"), espA.perdidasPct, 1e-9, "MVA: pérdidas % = potencia activa S·cosφ en el motor de tramos");
  cerca(val(ctx, "potencia_activa_mw"), pAct, 1e-9, "MVA: la potencia activa sale en los resultados");
  ctx = ctxNuevo();
  await tools.ejecutarLlamada("calcular_perdidas", { ...base, corriente_a: 200, longitud_km: 5 }, ctx);
  cerca(val(ctx, "potencia_activa_mw"), (Math.sqrt(3) * 34.5 * 200 * 0.95) / 1000, 1e-9, "corriente en A: potencia activa √3·V·I·cosφ");
  cerca(val(ctx, "corriente_a"), 200, 1e-9, "corriente en A: la corriente calculada vuelve a dar 200 A");
  ctx = ctxNuevo();
  const b = await tools.ejecutarLlamada("calcular_perdidas", { ...base, potencia_mw: 9, corriente_a: 100, longitud_km: 5 }, ctx);
  ok(b.ok === false && b.error.includes("solo UN dato de partida"), "dos datos de partida: error claro");
  const c = await tools.ejecutarLlamada("calcular_regulacion", { ...base, longitud_km: 5 }, ctxNuevo());
  ok(c.ok === false && c.error.includes("potencia_mva") && c.error.includes("corriente_a"), "sin dato de partida: el error lista las tres opciones");

  // --- varios tramos en serie
  ctx = ctxNuevo();
  const m = await tools.ejecutarLlamada("calcular_perdidas", { ...base, potencia_mw: 9.9, tramos: [{ longitud_km: 3 }, { longitud_km: 2, calibre: "1/0" }] }, ctx);
  const r1_0 = desnudos.find((c) => c.tipo === "ACSR" && c.calibre_awg_kcmil === "1/0").r_ac_75c_ohm_km;
  const espM = pt.calcularPerdidasTramos({ tensionLineaKv: 34.5, potenciaActivaMw: 9.9, factorPotencia: 0.95, factorCarga: 0.564 }, [{ resistenciaOhmKm: r4, longitudKm: 3 }, { resistenciaOhmKm: r1_0, longitudKm: 2 }]);
  ok(m.ok === true, "pérdidas con dos tramos (el segundo cambia de calibre)");
  cerca(val(ctx, "perdidas_pct"), espM.perdidasPct, 1e-9, "dos tramos: el % total es la suma de los tramos");
  cerca(val(ctx, "tramo1_perdidas_pct"), espM.tramos[0].perdidasPct, 1e-9, "dos tramos: pérdidas del tramo 1");
  cerca(val(ctx, "tramo2_perdidas_pct"), espM.tramos[1].perdidasPct, 1e-9, "dos tramos: pérdidas del tramo 2 (calibre propio)");
  cerca(val(ctx, "perdidas_mw"), espM.perdidasMw, 1e-9, "dos tramos: pérdidas totales en MW");
  ok(ctx.log.at(-1).entradas.some((e) => e.etiqueta.startsWith("Tramo 2 — ")), "las entradas del log llevan «Tramo N —» cuando hay varios");
  ok(val(ctx, "clasificacion") === pt.clasificarPerdidas(espM.perdidasPct).etiqueta, "la clasificación es la de la pantalla (Óptimo / Aceptable / Elevado)");
  ok(ctx.log.at(-1).notas.some((n) => n.includes("NO son límite normativo") && n.includes("1 %") && n.includes("3 %")), "una nota entrega las referencias de diseño (1 % / 3 %) y aclara que no son norma");
  const sinLong = await tools.ejecutarLlamada("calcular_perdidas", { ...base, potencia_mw: 9.9, tramos: [{ longitud_km: 3 }, {}] }, ctxNuevo());
  ok(sinLong.ok === false && sinLong.error.includes("tramo 2"), "tramo sin longitud: el error dice cuál");
  const malo = await tools.ejecutarLlamada("calcular_perdidas", { ...base, potencia_mw: 9.9, tramos: [{ longitud_km: -1 }] }, ctxNuevo());
  ok(malo.ok === false && malo.error.includes("tramos[1]") && malo.error.includes("longitud_km"), "dato inválido dentro de un tramo: el error dice tramos[1]");

  // --- conductores por fase (haz)
  ctx = ctxNuevo();
  await tools.ejecutarLlamada("calcular_perdidas", { ...base, potencia_mw: 9.9, longitud_km: 5, conductores_por_fase: 2 }, ctx);
  const esp2 = pt.calcularPerdidasTramos({ tensionLineaKv: 34.5, potenciaActivaMw: 9.9, factorPotencia: 0.95, factorCarga: 0.564 }, [{ resistenciaOhmKm: r4, longitudKm: 5, numConductoresPorFase: 2 }]);
  cerca(val(ctx, "perdidas_pct"), esp2.perdidasPct, 1e-9, "2 conductores por fase: resistencia R/2 (pérdidas a la mitad)");

  // --- regulación
  ctx = ctxNuevo();
  await tools.ejecutarLlamada("calcular_regulacion", { tension_kv: 34.5, factor_potencia: 0.95, potencia_mw: 9.9, red: "Aerea", material: "ACSR", calibre: "4/0", tramos: [{ longitud_km: 3 }, { longitud_km: 2, dab_m: 1.5, dac_m: 1.5, dbc_m: 1.5 }] }, ctx);
  const espR = rt.calcularRegulacionTramos({ tensionLineaKv: 34.5, potenciaActivaMw: 9.9, factorPotencia: 0.95 }, [
    { resistenciaOhmKm: r4, rmgMm: rmg4, longitudKm: 3, dabM: 2, dacM: 2.84, dbcM: 0.84 },
    { resistenciaOhmKm: r4, rmgMm: rmg4, longitudKm: 2, dabM: 1.5, dacM: 1.5, dbcM: 1.5 },
  ]);
  cerca(val(ctx, "caida_tension_pct"), espR.caidaTensionPct, 1e-9, "regulación con dos tramos: caída total = suma (cada uno con su disposición de fases)");
  cerca(val(ctx, "tramo2_caida_tension_pct"), espR.tramos[1].caidaTensionPct, 1e-9, "regulación: caída del tramo 2 con sus propias distancias");
  ok(val(ctx, "clasificacion") === rt.clasificarRegulacion(espR.caidaTensionPct).etiqueta, "regulación: clasificación de la pantalla");
  ctx = ctxNuevo();
  const h = await tools.ejecutarLlamada("calcular_regulacion", { tension_kv: 34.5, factor_potencia: 0.95, corriente_a: 250, red: "Aerea", material: "ACSR", calibre: "4/0", longitud_km: 8, conductores_por_fase: 2, separacion_haz_m: 0.4 }, ctx);
  const espH = rt.calcularRegulacionTramos({ tensionLineaKv: 34.5, potenciaActivaMw: (Math.sqrt(3) * 34.5 * 250 * 0.95) / 1000, factorPotencia: 0.95 }, [{ resistenciaOhmKm: r4, rmgMm: rmg4, longitudKm: 8, dabM: 2, dacM: 2.84, dbcM: 0.84, numConductoresPorFase: 2, separacionHazM: 0.4 }]);
  ok(h.ok === true, "regulación con haz de 2 conductores y dato de partida en A");
  cerca(val(ctx, "caida_tension_pct"), espH.caidaTensionPct, 1e-9, "haz: caída igual al motor de tramos (R/N y RMG del haz)");
  cerca(val(ctx, "rmg_efectivo_mm"), espH.tramos[0].rmgEfectivoMm, 1e-9, "haz: se informa el RMG equivalente");
  const sinSep = await tools.ejecutarLlamada("calcular_regulacion", { tension_kv: 34.5, factor_potencia: 0.95, potencia_mw: 5, red: "Aerea", material: "ACSR", calibre: "4/0", longitud_km: 8, conductores_por_fase: 2 }, ctxNuevo());
  ok(sinSep.ok === false && sinSep.error.includes("separacion_haz_m"), "haz sin separación: el error la pide");

  // --- esquema para Gemini y barrido
  const dPer = tools.declaraciones().find((d) => d.name === "calcular_perdidas").parameters;
  ok(dPer.properties.tramos.type === "array" && dPer.properties.tramos.items.type === "object" && "longitud_km" in dPer.properties.tramos.items.properties, "el esquema de Gemini declara «tramos» como lista de objetos");
  ok(!(dPer.required || []).includes("potencia_mw") && !(dPer.required || []).includes("longitud_km"), "potencia_mw y longitud_km ya no son obligatorios a nivel superior (los cubre el dato de partida / los tramos)");
  ctx = ctxNuevo();
  const bar = await tools.ejecutarLlamada("barrer_parametro", { herramienta: "calcular_perdidas", parametros_json: JSON.stringify({ ...base, potencia_mw: 9.9, tramos: [{ longitud_km: 2 }, { longitud_km: 3 }] }), parametro: "factor_carga", valores: [0.4, 0.8] }, ctx);
  ok(bar.ok === true && bar.puntos.length === 2 && bar.puntos.every((p) => p.resultados && Number.isFinite(p.resultados.perdidas_pct)), "el barrido funciona con calculadoras de varios tramos");
  ok(bar.puntos[1].resultados.perdidas_pct > bar.puntos[0].resultados.perdidas_pct, "el barrido de Fc sobre 2 tramos crece con el factor de carga");
});

await seccion("tools: cortocircuito con corriente de falla a soportar", async () => {
  const cc = await import("../js/calc/cortocircuito-calibre.js");
  const eng = await import("../js/calc/cortocircuito.js");
  const val = (ctx, clave) => ctx.log.at(-1).resultados.find((x) => x.clave === clave)?.valor;
  const A = ACSR_4_0.area_seccion_aluminio_mm2;
  const capa = eng.calcularCortocircuito({ material: "Aluminio", areaMm2: A, tempOperacionC: 75, tempFallaC: 250, tiempoS: 0.3 }).capacidadCcKa;

  // sin el campo: igual que antes (un solo resultado)
  let ctx = ctxNuevo();
  await tools.ejecutarLlamada("calcular_cortocircuito", { red: "Aerea", material: "ACSR", calibre: "4/0" }, ctx);
  ok(ctx.log.at(-1).resultados.length === 1, "sin corriente a soportar el resultado es solo la capacidad, como antes");

  // el calibre no alcanza: sugiere otro
  ctx = ctxNuevo();
  const objetivo = capa * 1.5;
  const r = await tools.ejecutarLlamada("calcular_cortocircuito", { red: "Aerea", material: "ACSR", calibre: "4/0", corriente_falla_ka: objetivo }, ctx);
  ok(r.ok === true, "ejecuta con corriente a soportar");
  ok(val(ctx, "cumple_corriente") === false, "4/0 no soporta 1.5 veces su capacidad: No cumple");
  cerca(val(ctx, "margen_ka"), capa - objetivo, 1e-9, "margen = capacidad − corriente a soportar");
  const cand = [];
  const vistos = new Set();
  for (const f of desnudos) if (f.tipo === "ACSR" && f.calibre_awg_kcmil && f.area_seccion_aluminio_mm2 != null && !vistos.has(f.calibre_awg_kcmil)) { vistos.add(f.calibre_awg_kcmil); cand.push({ calibre: f.calibre_awg_kcmil, area: f.area_seccion_aluminio_mm2 }); }
  const esp = cc.compararCalibres(cand, { material: "Aluminio", tempOperacionC: 75, tempFallaC: 250, tiempoS: 0.3 }, objetivo, "4/0");
  cerca(val(ctx, "area_minima_mm2"), esp.areaMinimaMm2, 1e-9, "área mínima = la de la pantalla");
  ok(val(ctx, "calibre_sugerido") === esp.sugerido.calibre, `calibre sugerido = el de la pantalla (${esp.sugerido.calibre})`);
  ok(esp.sugerido.area > A, "el sugerido tiene más área que el 4/0");
  cerca(val(ctx, "capacidad_calibre_sugerido_ka"), esp.sugerido.capacidadCcKa, 1e-9, "capacidad del calibre sugerido");
  ok(esp.sugerido.capacidadCcKa >= objetivo, "el sugerido sí soporta la corriente");

  // el calibre alcanza
  ctx = ctxNuevo();
  await tools.ejecutarLlamada("calcular_cortocircuito", { red: "Aerea", material: "ACSR", calibre: "4/0", corriente_falla_ka: capa * 0.5 }, ctx);
  ok(val(ctx, "cumple_corriente") === true, "con la mitad de su capacidad: Cumple");
  ok(val(ctx, "calibre_sugerido") !== undefined && val(ctx, "area_minima_mm2") < A, "el área mínima es menor que la del calibre elegido");

  // ningún calibre alcanza
  ctx = ctxNuevo();
  await tools.ejecutarLlamada("calcular_cortocircuito", { red: "Aerea", material: "ACSR", calibre: "4/0", corriente_falla_ka: 900 }, ctx);
  ok(ctx.log.at(-1).resultados.some((x) => x.clave === "calibre_sugerido" && x.etiqueta.startsWith("Ningún calibre")), "ningún calibre alcanza: lo dice y da el de mayor capacidad");

  // área manual: veredicto y área mínima, sin calibre
  ctx = ctxNuevo();
  await tools.ejecutarLlamada("calcular_cortocircuito", { area_mm2: 100, material_electrico: "Cobre", temp_operacion_c: 90, temp_falla_c: 250, tiempo_s: 1, corriente_falla_ka: 20 }, ctx);
  const capM = (100 * 341 * Math.sqrt(Math.log10((250 + 234) / (90 + 234)) / 1)) / 1000;
  ok(val(ctx, "cumple_corriente") === (capM >= 20) && val(ctx, "calibre_sugerido") === undefined, "área manual: veredicto sin calibre sugerido");
  cerca(val(ctx, "area_minima_mm2"), (20 / capM) * 100, 1e-9, "área mínima = corriente / capacidad por mm²");
  ok(ctx.log.at(-1).notas.some((n) => n.includes("área manual")), "área manual: nota explicando que no se sugiere calibre");

  // subterránea
  ctx = ctxNuevo();
  const s = await tools.ejecutarLlamada("calcular_cortocircuito", { red: "Subterranea", material: "Cobre", calibre: "4/0", corriente_falla_ka: 30 }, ctx);
  ok(s.ok === true && val(ctx, "area_minima_mm2") > 0, "subterránea (XLPE): también entrega área mínima y veredicto");

  const mala = await tools.ejecutarLlamada("calcular_cortocircuito", { red: "Aerea", material: "ACSR", calibre: "4/0", corriente_falla_ka: -3 }, ctxNuevo());
  ok(mala.ok === false && mala.error.includes("corriente_falla_ka"), "corriente a soportar negativa: error");
});

await seccion("tools: ocupación de ductos con varios tipos de conductor y radio de curvatura", async () => {
  const gr = await import("../js/calc/ocupacion-grupos.js");
  const xlpe = await cargar("conductores-xlpe");
  const val = (ctx, clave) => ctx.log.at(-1).resultados.find((x) => x.clave === clave)?.valor;

  // un solo tipo: radio de curvatura 12D
  let ctx = ctxNuevo();
  await tools.ejecutarLlamada("calcular_ocupacion_ductos", { numero_conductores: 3, diametro_conductor_mm: 30, diametro_tubo_mm: 100 }, ctx);
  cerca(val(ctx, "radio_curvatura_mm"), 360, 1e-9, "un tipo de 30 mm: radio de curvatura 12 × 30 = 360 mm");

  // dos tipos, diametros manuales
  ctx = ctxNuevo();
  const r = await tools.ejecutarLlamada("calcular_ocupacion_ductos", { diametro_tubo_mm: 150, grupos: [{ numero_conductores: 3, diametro_conductor_mm: 30 }, { numero_conductores: 3, diametro_conductor_mm: 20 }] }, ctx);
  const esp = gr.calcularOcupacionGrupos(150, [{ cantidad: 3, diametroMm: 30 }, { cantidad: 3, diametroMm: 20 }]);
  ok(r.ok === true, "ocupación con dos tipos de conductor");
  cerca(val(ctx, "ocupacion_pct"), esp.ocupacionPct, 1e-9, "dos tipos: ocupación total = la de la pantalla");
  ok(val(ctx, "limite_pct") === esp.limitePct && val(ctx, "total_conductores") === 6, `dos tipos: el límite NTC-2050 usa el total de conductores (6 → ${esp.limitePct} %)`);
  ok(val(ctx, "cumple") === esp.cumple, "dos tipos: veredicto Cumple igual al de la pantalla");
  cerca(val(ctx, "grupo1_radio_curvatura_mm"), 360, 1e-9, "tipo 1: radio de curvatura 360 mm");
  cerca(val(ctx, "grupo2_radio_curvatura_mm"), 240, 1e-9, "tipo 2: radio de curvatura 240 mm");
  cerca(val(ctx, "grupo2_ocupacion_pct"), esp.grupos[1].ocupacionPct, 1e-9, "tipo 2: % del ducto");
  ok(val(ctx, "riesgo_atascamiento") === undefined, "con 6 conductores no se evalúa el atascamiento");
  ok(ctx.log.at(-1).entradas.some((e) => e.etiqueta.startsWith("Tipo 2 — ")), "las entradas del log llevan «Tipo N —» cuando hay varios");

  // tres conductores iguales repartidos en dos tipos: si evalua atascamiento
  ctx = ctxNuevo();
  await tools.ejecutarLlamada("calcular_ocupacion_ductos", { diametro_tubo_mm: 100, grupos: [{ numero_conductores: 2, diametro_conductor_mm: 30 }, { numero_conductores: 1, diametro_conductor_mm: 30 }] }, ctx);
  ok(val(ctx, "jamming_ratio") !== undefined, "3 conductores del mismo diámetro (en dos tipos): se evalúa el atascamiento");

  // catalogo XLPE
  const fila = xlpe.find((c) => c.material_conductor === "Cobre" && c.calibre_awg_kcmil === "4/0" && c.nivel_tension_kv === "15 kV" && c.porcentaje_aislamiento_pct === 100 && c.pantalla === "Hilos de cobre");
  ctx = ctxNuevo();
  const c = await tools.ejecutarLlamada("calcular_ocupacion_ductos", { diametro_tubo_mm: 200, grupos: [{ numero_conductores: 3, material: "cobre", calibre: "4/0", nivel_tension_kv: "15 kV", porcentaje_aislamiento_pct: 100, pantalla: "hilos" }, { numero_conductores: 1, diametro_conductor_mm: 25 }] }, ctx);
  ok(c.ok === true && !!fila, `tipo del catálogo XLPE (Cobre 4/0, 15 kV, hilos): ${c.error || "ok"}`);
  cerca(val(ctx, "grupo1_radio_curvatura_mm"), 12 * fila.diametro_total_conductor_mm, 1e-9, "catálogo XLPE: el diámetro es el exterior total y el radio 12D");
  ctx = ctxNuevo();
  await tools.ejecutarLlamada("calcular_ocupacion_ductos", { diametro_tubo_mm: 200, numero_conductores: 3, material: "Cobre", calibre: "4/0" }, ctx);
  ok(ctx.log.at(-1).notas.some((n) => n.includes("se usó el primero")), "un solo tipo del catálogo: si hay varios cables con ese calibre, lo dice");

  // errores
  const e1 = await tools.ejecutarLlamada("calcular_ocupacion_ductos", { diametro_tubo_mm: 100, grupos: [{ numero_conductores: 3, diametro_conductor_mm: 30 }, { diametro_conductor_mm: 20 }] }, ctxNuevo());
  ok(e1.ok === false && e1.error.includes("numero_conductores") && e1.error.includes("tipo de conductor 2"), "tipo sin número de conductores: el error dice cuál");
  const e2 = await tools.ejecutarLlamada("calcular_ocupacion_ductos", { diametro_tubo_mm: 100, numero_conductores: 3 }, ctxNuevo());
  ok(e2.ok === false && e2.error.includes("diametro_conductor_mm") && e2.error.includes("material"), "sin diámetro ni catálogo: el error explica las dos formas");
  const e3 = await tools.ejecutarLlamada("calcular_ocupacion_ductos", { diametro_tubo_mm: 100, grupos: [{ numero_conductores: 3, material: "Cobre", calibre: "999" }] }, ctxNuevo());
  ok(e3.ok === false && e3.error.includes("Calibres disponibles"), "calibre XLPE inexistente: lista los disponibles");
  const dOcu = tools.declaraciones().find((d) => d.name === "calcular_ocupacion_ductos").parameters;
  ok(dOcu.properties.grupos.type === "array" && dOcu.properties.grupos.items.type === "object" && "numero_conductores" in dOcu.properties.grupos.items.properties && !(dOcu.required || []).length, "el esquema declara «grupos» y ya no hay campos obligatorios a nivel superior");
});

await seccion("herramientas de diseño: dimensionar, verificar y buscar valor límite", async () => {
  const NUEVAS = ["dimensionar_conductor", "verificar_conductor", "resolver_valor_limite"];
  const cat = tools.catalogoHerramientas();
  ok(NUEVAS.every((n) => cat.find((h) => h.nombre === n)?.grupo === "Análisis"), "las tres aparecen en el catálogo de herramientas, en el grupo «Análisis»");
  ok(NUEVAS.every((n) => !tools.HERRAMIENTAS_ESTANDAR.includes(n)) && tools.HERRAMIENTAS_ESTANDAR.length === 10, "son opcionales: NO están en el agente estándar (siguen sus 10 herramientas)");
  ok(tools.declaraciones(tools.HERRAMIENTAS_ESTANDAR).length === 10 && NUEVAS.every((n) => tools.declaraciones().some((d) => d.name === n)), "el estándar no las declara; con todas habilitadas sí");
  const soloNuevas = tools.declaraciones(NUEVAS);
  ok(soloNuevas.length === 0, "sin calculadoras habilitadas no se ofrecen (necesitan las calculadoras que usan)");
  const conCalc = tools.declaraciones([...NUEVAS, "calcular_perdidas", "calcular_regulacion"]);
  ok(NUEVAS.every((n) => conCalc.some((d) => d.name === n)), "con al menos una calculadora habilitada sí se ofrecen");
  const dl = conCalc.find((d) => d.name === "resolver_valor_limite").parameters.properties.herramienta.enum;
  ok(dl.join() === "calcular_perdidas,calcular_regulacion", "el solucionador solo ofrece las calculadoras habilitadas");

  const CASO = { ...LINEA, factor_carga: 0.56, dab_m: 1.5, dac_m: 1.5, dbc_m: 1.5 };

  // --- dimensionar: se compara con un barrido calibre por calibre hecho aparte con la calculadora de pérdidas
  const ctx = ctxNuevo();
  const d = await tools.ejecutarLlamada("dimensionar_conductor", { red: "Aerea", material: "ACSR", ...CASO, perdidas_max_pct: 1 }, ctx);
  ok(d.ok === true && !!d.conductor_recomendado && d.calibres_evaluados.length > 5, `dimensionar responde y evalúa varios calibres (${d.calibres_evaluados?.length})`);
  const ordenados = d.calibres_evaluados;
  const areas = ordenados.map((c) => c.area_mm2);
  ok(areas.every((a, i) => i === 0 || a >= areas[i - 1]), "los calibres se evalúan de menor a mayor área");
  // referencia independiente: el primero (menor área) cuyas pérdidas por la calculadora sean <= 1 %
  const ctxRef = ctxNuevo();
  let esperado = null;
  for (const c of ordenados) {
    const cal = c.conductor.split(" ")[1];
    const r = await tools.ejecutarLlamada("calcular_perdidas", { ...LINEA, factor_carga: 0.56, red: "Aerea", material: "ACSR", calibre: cal }, ctxRef);
    if (r.resultados.find((x) => x.nombre === "Pérdidas").valor <= 1) { esperado = c.conductor; break; }
  }
  ok(esperado && d.conductor_recomendado.conductor === esperado, `el conductor recomendado (${d.conductor_recomendado?.conductor}) es el primero que cumple según un barrido independiente (${esperado})`);
  ok(d.calibres_evaluados.filter((c) => c.cumple).length >= 1 && d.calibres_evaluados.filter((c) => !c.cumple).every((c) => c.incumple.length >= 1), "los que no cumplen dicen qué criterio incumplen");
  ok(ctx.log.length === d.calibres_evaluados.length && ctx.log.every((r) => r.herramienta === "dimensionar_conductor" && r.barrido), "el reporte recibe una fila por calibre evaluado");
  ok(ctx.presupuesto.usado === 1, "cuenta como UN cálculo del presupuesto por pregunta");

  // varios criterios a la vez (aérea): pérdidas + regulación + ampacidad + cortocircuito
  const d2 = await tools.ejecutarLlamada("dimensionar_conductor", { red: "Aerea", material: "ACSR", ...CASO, corriente_falla_ka: 8 }, ctxNuevo());
  ok(d2.ok && d2.criterios_usados.length === 4 && d2.calibres_evaluados.every((c) => "ampacidad_a" in c.valores && "capacidad_cc_ka" in c.valores && "caida_tension_pct" in c.valores), `con todos los datos usa 4 criterios (${d2.criterios_usados?.length})`);

  // subterránea (XLPE): sin ampacidad
  const d3 = await tools.ejecutarLlamada("dimensionar_conductor", { red: "Subterranea", material: "Cobre", ...CASO, perdidas_max_pct: 3 }, ctxNuevo());
  ok(d3.ok && d3.criterios_usados.length >= 2 && d3.calibres_evaluados.length > 3, "también dimensiona cables XLPE");

  // errores claros
  const sinCriterio = await tools.ejecutarLlamada("dimensionar_conductor", { red: "Aerea", material: "ACSR" }, ctxNuevo());
  ok(sinCriterio.ok === false && /criterio/.test(sinCriterio.error), "sin datos para ningún criterio: error claro");
  const faltan = await tools.ejecutarLlamada("dimensionar_conductor", { red: "Aerea", material: "ACSR", ...LINEA, perdidas_max_pct: 1 }, ctxNuevo());
  ok(faltan.ok === false && /factor_carga/.test(faltan.error), "límite de pérdidas sin factor de carga: dice qué falta");
  const malMat = await tools.ejecutarLlamada("dimensionar_conductor", { red: "Aerea", material: "XYZ", ...CASO }, ctxNuevo());
  ok(malMat.ok === false && /no existe/.test(malMat.error), "material inexistente: error con las opciones");
  const ctxPerm = ctxNuevo();
  ctxPerm.permitidas = new Set(["dimensionar_conductor", "calcular_perdidas"]);
  const sinReg = await tools.ejecutarLlamada("dimensionar_conductor", { red: "Aerea", material: "ACSR", ...CASO }, ctxPerm);
  ok(sinReg.ok === false && /calcular_regulacion/.test(sinReg.error) && /no está habilitada/.test(sinReg.error), "si falta habilitar una calculadora que necesita, lo dice");

  // --- verificar
  const ctxV = ctxNuevo();
  const v = await tools.ejecutarLlamada("verificar_conductor", { red: "Aerea", material: "ACSR", calibre: "4/0", ...CASO, perdidas_max_pct: 0.5, corriente_falla_ka: 8 }, ctxV);
  const pCalc = await tools.ejecutarLlamada("calcular_perdidas", { ...LINEA, factor_carga: 0.56, red: "Aerea", material: "ACSR", calibre: "4/0" }, ctxNuevo());
  const perdidasRef = pCalc.resultados.find((x) => x.nombre === "Pérdidas").valor;
  const kp = v.criterios?.find((k) => k.criterio === "Pérdidas");
  ok(v.ok && kp && Math.abs(kp.valor - perdidasRef) < 1e-6 && kp.cumple === false && v.cumple_todos === false, `verificar 4/0: pérdidas ${kp?.valor} % (la calculadora dice ${perdidasRef}) no cumple el 0.5 %`);
  ok(v.criterios.length === 4 && v.criterios.every((k) => typeof k.margen === "number" && /[≤≥]/.test(k.limite)), "entrega valor, límite, margen y veredicto de los 4 criterios");
  ok(ctxV.log.length === 1 && ctxV.log[0].herramienta === "verificar_conductor", "queda UNA fila en el reporte");
  const vNo = await tools.ejecutarLlamada("verificar_conductor", { red: "Aerea", material: "ACSR", calibre: "9999", ...CASO }, ctxNuevo());
  ok(vNo.ok === false && /no existe/.test(vNo.error), "calibre inexistente: error con los disponibles");

  // --- solucionador inverso: longitud máxima para una caída de tensión de 5 %
  const base = { tension_kv: 34.5, potencia_mw: 9.9, factor_potencia: 0.95, red: "Aerea", material: "ACSR", calibre: "4/0", dab_m: 1.5, dac_m: 1.5, dbc_m: 1.5 };
  const ctxS = ctxNuevo();
  const s = await tools.ejecutarLlamada("resolver_valor_limite", { herramienta: "calcular_regulacion", parametros_json: JSON.stringify(base), parametro: "longitud_km", resultado: "caida_tension_pct", valor_objetivo: 5, minimo: 0.1, maximo: 500 }, ctxS);
  ok(s.ok === true && s.valor_encontrado > 0.1 && s.valor_encontrado < 500, `encuentra una longitud máxima (${s.valor_encontrado} km)`);
  const chk = await tools.ejecutarLlamada("calcular_regulacion", { ...base, longitud_km: s.valor_encontrado }, ctxNuevo());
  const caida = chk.resultados.find((x) => x.nombre === "Caída de tensión").valor;
  ok(Math.abs(caida - 5) < 0.005, `con esa longitud la calculadora da ${caida} % (objetivo 5 %)`);
  ok(ctxS.log.length === 1 && ctxS.log[0].herramienta === "calcular_regulacion" && ctxS.presupuesto.usado === 1, "el resultado queda como una fila de la calculadora y cuenta como un cálculo");
  const fuera = await tools.ejecutarLlamada("resolver_valor_limite", { herramienta: "calcular_regulacion", parametros_json: JSON.stringify(base), parametro: "longitud_km", resultado: "caida_tension_pct", valor_objetivo: 5, minimo: 0.1, maximo: 1 }, ctxNuevo());
  ok(fuera.ok === false && /no está dentro del rango/.test(fuera.error), "si el objetivo no está entre los extremos del rango lo avisa (con los resultados en los extremos)");
  const malRes = await tools.ejecutarLlamada("resolver_valor_limite", { herramienta: "calcular_regulacion", parametros_json: JSON.stringify(base), parametro: "longitud_km", resultado: "no_existe", valor_objetivo: 5, minimo: 0.1, maximo: 500 }, ctxNuevo());
  ok(malRes.ok === false && /Resultados:/.test(malRes.error), "resultado inexistente: lista las claves válidas");
  const malPar = await tools.ejecutarLlamada("resolver_valor_limite", { herramienta: "calcular_regulacion", parametros_json: JSON.stringify(base), parametro: "calibre", resultado: "caida_tension_pct", valor_objetivo: 5, minimo: 0.1, maximo: 500 }, ctxNuevo());
  ok(malPar.ok === false && /numérico/.test(malPar.error), "un parámetro que no es numérico se rechaza");
  // otra calculadora: potencia máxima para 3 % de pérdidas
  const pm = await tools.ejecutarLlamada("resolver_valor_limite", { herramienta: "calcular_perdidas", parametros_json: JSON.stringify({ tension_kv: 34.5, factor_potencia: 0.95, factor_carga: 0.56, longitud_km: 5.2, red: "Aerea", material: "ACSR", calibre: "4/0" }), parametro: "potencia_mw", resultado: "perdidas_pct", valor_objetivo: 3, minimo: 0.5, maximo: 100 }, ctxNuevo());
  ok(pm.ok && Math.abs(pm.resultado_en_ese_valor - 3) < 0.005, `potencia máxima para 3 % de pérdidas: ${pm.valor_encontrado} MW`);
  // el reporte dibuja la tabla del dimensionamiento con las filas registradas
  const reporte = await import("../js/ai/reporte.js");
  const { tablas } = reporte.armarTablas(ctx.log);
  const tb = tablas.find((x) => x.titulo === "Dimensionar conductor");
  ok(tb && tb.colsVar.some((c) => c.etiqueta === "Conductor") && tb.colsRes.some((c) => c.etiqueta === "Cumple todos los criterios") && tb.filas.length === d.calibres_evaluados.length && tb.filas.some((f) => f.res.includes("Sí")) && tb.filas.some((f) => f.res.includes("No")), "en el reporte sale una tabla «Dimensionar conductor»: una fila por calibre, con «Sí / No» de cumplimiento");
});

await seccion("herramienta: ficha del proyecto (guardar_ficha_proyecto)", async () => {
  const cat = tools.catalogoHerramientas();
  ok(cat.find((h) => h.nombre === "guardar_ficha_proyecto")?.grupo === "Análisis", "aparece en el catálogo, grupo «Análisis»");
  ok(!tools.HERRAMIENTAS_ESTANDAR.includes("guardar_ficha_proyecto") && tools.HERRAMIENTAS_TODAS.includes("guardar_ficha_proyecto"), "es opcional (no está en el estándar) pero sí en HERRAMIENTAS_TODAS");

  const ctx = ctxNuevo();
  ok(Array.isArray(ctx.ficha) && ctx.ficha.length === 0, "crearContexto ya trae ctx.ficha como arreglo vacío");

  const p1 = { clave: "tension_kv", etiqueta: "Tensión nominal", valor: "34.5", unidad: "kV", origen: "usuario" };
  const r1 = await tools.ejecutarLlamada("guardar_ficha_proyecto", { categoria: "Sistema", parametros: [p1] }, ctx);
  ok(r1.ok === true && r1.categoria === "Sistema" && r1.parametros_guardados === 1, "primera llamada crea la categoría");
  ok(ctx.ficha.length === 1 && ctx.ficha[0].categoria === "Sistema" && ctx.ficha[0].parametros.length === 1, "queda en ctx.ficha");
  ok(ctx.presupuesto.usado === 0, "no gasta presupuesto (como una consulta)");
  ok(ctx.log.length === 1 && ctx.log[0].ficha === true && !ctx.log[0].entradas && !ctx.log[0].resultados, "deja un marcador minimo en ctx.log, sin entradas/resultados");

  // segunda categoria, y actualizar un parametro existente + agregar uno nuevo a "Sistema"
  const r2 = await tools.ejecutarLlamada("guardar_ficha_proyecto", { categoria: "Conductor", parametros: [{ clave: "material", etiqueta: "Material", valor: "ACSR", origen: "usuario" }] }, ctx);
  ok(r2.ok && ctx.ficha.length === 2, "una categoria nueva se agrega sin tocar la anterior");
  const r3 = await tools.ejecutarLlamada(
    "guardar_ficha_proyecto",
    { categoria: "Sistema", parametros: [{ ...p1, valor: "13.2" }, { clave: "frecuencia_hz", etiqueta: "Frecuencia", valor: "60", unidad: "Hz", origen: "defecto" }] },

await seccion("reporte en Word (.docx): paquete válido", async () => {
  const { crc32, crearZip } = await import("../js/util/zip.js");
  ok(crc32(new TextEncoder().encode("123456789")) === 0xcbf43926, "el CRC-32 de «123456789» es el valor de referencia 0xCBF43926");
  const { crearDocx } = await import("../js/ai/docx.js");
  const ctx = ctxNuevo();
  await tools.ejecutarLlamada("barrer_parametro", { herramienta: "calcular_perdidas", parametros_json: JSON.stringify({ ...LINEA, factor_carga: 0.56 }), parametro: "calibre", valores_texto: ["4/0", "266.8"] }, ctx);
  const narrativa = [
    "# Título & <prueba>", "## Objetivo", "Texto con **negrita**, *cursiva* y `código`.", "",
    "| A | B |", "|---|---|", "| 1 | 2 |", "",
    "- uno", "  - anidado", "", "1. primero", "2. segundo", "",
    "## Conclusiones", "El conductor adecuado es **ACSR 266.8**.", "## Recomendaciones", "Verificar.",
  ].join(String.fromCharCode(10));
  const bytes = crearDocx({ narrativa, log: ctx.log, fecha: "20 de septiembre de 2026", modelo: "m", agente: "Agente estándar" });
  ok(bytes[0] === 0x50 && bytes[1] === 0x4b && bytes[2] === 3 && bytes[3] === 4, "empieza con la firma de un ZIP (PK)");
  // se lee el directorio central del ZIP: nombres, tamaños y CRC de cada archivo
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const n = dv.getUint16(bytes.length - 22 + 10, true);
  let pos = dv.getUint32(bytes.length - 22 + 16, true);
  const partes = {};
  for (let i = 0; i < n; i++) {
    const tam = dv.getUint32(pos + 24, true), crc = dv.getUint32(pos + 16, true), ln = dv.getUint16(pos + 28, true), off = dv.getUint32(pos + 42, true);
    const nombre = new TextDecoder().decode(bytes.subarray(pos + 46, pos + 46 + ln));
    const dat = bytes.subarray(off + 30 + dv.getUint16(off + 26, true), off + 30 + dv.getUint16(off + 26, true) + tam);
    partes[nombre] = { dat, crcOk: crc32(dat) === crc, texto: new TextDecoder().decode(dat) };
    pos += 46 + ln;
  }
  const esperados = ["[Content_Types].xml", "_rels/.rels", "docProps/core.xml", "word/document.xml", "word/_rels/document.xml.rels", "word/styles.xml", "word/numbering.xml", "word/footer1.xml"];
  ok(esperados.every((p) => partes[p]) && Object.keys(partes).length === esperados.length, "trae las 8 partes del documento");
  ok(Object.values(partes).every((p) => p.crcOk), "el CRC de cada parte coincide con el del directorio (contenido íntegro)");
  const malas = Object.entries(partes).filter(([, p]) => new DOMParser().parseFromString(p.texto, "application/xml").querySelector("parsererror"));
  ok(!malas.length, `todo el XML está bien formado${malas.length ? ": " + malas.map((m) => m[0]).join(", ") : ""}`);
  const doc = partes["word/document.xml"].texto;
  ok(doc.includes('w:w="12240" w:h="15840"') && doc.includes("w:footerReference"), "hoja Carta vertical (12240 x 15840) y pie de página");
  ok(doc.includes('w:val="Title"') && doc.includes('w:val="Heading1"') && doc.includes("<w:tbl>") && doc.includes("<w:tblHeader/>"), "usa estilos de Título y Encabezado, tablas y cabecera repetida");
  ok(doc.includes("Título &amp; &lt;prueba&gt;") && !doc.includes("<prueba>"), "los caracteres especiales quedan escapados");
  ok(doc.includes('w:fill="F2F2F2"') && /Conclusiones/.test(doc), "«Conclusiones» va sombreada");
  ok(partes["word/footer1.xml"].texto.includes("PAGE") && partes["word/footer1.xml"].texto.includes("NUMPAGES"), "el pie tiene «Página X de Y»");
  ok(doc.includes("Cálculos ejecutados") && doc.includes("Agente estándar"), "trae las tablas de cálculos y el agente en el encabezado");
  const sinTabla = crearDocx({ narrativa: "", log: [], fecha: "f", modelo: "m", agente: "a" });
  ok(sinTabla.length > 500, "sin reporte de la IA ni cálculos también genera un documento");
});

await seccion("reporte: la nota de referencia ambigua se actualiza si el grupo usa varias", async () => {
  // Caso reportado por el usuario: ACSR 477 tiene 4 referencias; primero se calcula sin indicarla (usa la

  ok(!ctx.log[1].notas?.length, "segunda corrida (referencia explícita, Hawk): no genera nota (no es ambigua)");

  ok(amp.notas.some((n) => /varias referencias/.test(n) && /Pelican \(18\/1\)/.test(n) && /Hawk \(26\/7\)/.test(n)), `en su lugar, una nota nombra las 2 referencias realmente usadas: ${JSON.stringify(amp.notas)}`);

  // si las dos corridas terminan usando la MISMA referencia (aunque una fue ambigua), la nota original se conserva tal cual
  const ctx2 = ctxNuevo();

  ok(amp2.notas.some((n) => /se usó la primera \(Pelican/.test(n)) && !amp2.notas.some((n) => /varias referencias/.test(n)), "si todas las corridas terminan con la misma referencia, la nota original (sin reescribir) sigue siendo exacta");
});

await seccion("analisis: bucle con herramientas (Gemini simulado)", async () => {
  const ajustes = { modelo: "m", temperatura: 0.3, maxRondas: 4, maxCalculos: 60 };
  const conv = { contenidos: [] };
  const ctx = ctxNuevo();
  const eventos = [];
  let n = 0;
  gemini.usarMock(async ({ cuerpo }) => {
    n++;
    if (n === 1) {
      ok(cuerpo.tools[0].functionDeclarations.length === 10 && cuerpo.toolConfig.functionCallingConfig.mode === "AUTO" && !!cuerpo.systemInstruction, "1ª llamada: envía herramientas, modo AUTO e instrucciones de sistema");
      return { candidates: [{ content: { role: "model", parts: [
        { functionCall: { name: "calcular_perdidas", args: { ...LINEA, factor_carga: 0.5, resistencia_ohm_km: 0.3 } } },
        { functionCall: { name: "calcular_perdidas", args: { ...LINEA, factor_carga: 0.9, resistencia_ohm_km: 0.3 } } },
      ] } }] };
    }
    const partes = cuerpo.contents.at(-1).parts;
    ok(partes.length === 2 && partes.every((p) => p.functionResponse.response.ok === true), "2ª llamada: recibe 2 functionResponse (llamadas paralelas)");
    return { candidates: [{ content: { role: "model", parts: [{ text: "Resultado interpretado." }] } }] };
  });
  const r = await analisis.ejecutarTurno({ conv, texto: "compara", clave: "k", ajustes, ctx, onEvento: (e) => eventos.push(e.tipo) });
  ok(r.texto === "Resultado interpretado." && r.herramientas.length === 2 && !r.truncado, "devuelve texto final y herramientas usadas");
  ok(conv.contenidos.length === 4 && conv.contenidos.map((c) => c.role).join() === "user,model,user,model", "historial: user, model, user(functionResponse), model");
  ok(ctx.log.length === 2 && eventos.filter((t) => t === "herramienta-fin").length === 2, "log con 2 corridas y eventos de progreso");

  // rondas agotadas -> cierre forzado sin herramientas
  const conv2 = { contenidos: [] };
  const modos = [];
  gemini.usarMock(async ({ cuerpo }) => {
    modos.push(cuerpo.toolConfig?.functionCallingConfig?.mode);
    if (cuerpo.toolConfig.functionCallingConfig.mode === "NONE") return { candidates: [{ content: { role: "model", parts: [{ text: "Cierre." }] } }] };
    return { candidates: [{ content: { role: "model", parts: [{ functionCall: { name: "buscar_tuberia", args: {} } }] } }] };
  });
  const r2 = await analisis.ejecutarTurno({ conv: conv2, texto: "x", clave: "k", ajustes: { ...ajustes, maxRondas: 2 }, ctx: ctxNuevo() });
  ok(r2.truncado && r2.texto === "Cierre." && modos.at(-1) === "NONE" && modos.length === 3, `agota rondas y fuerza cierre (${modos.join(",")})`);

  // calculos agotados (no las rondas) -> queda marcado aunque el modelo conteste sin mas llamadas
  const conv4 = { contenidos: [] };
  let n4 = 0;
  gemini.usarMock(async () => {
    n4++;
    if (n4 === 1) {
      return { candidates: [{ content: { role: "model", parts: [
        { functionCall: { name: "calcular_perdidas", args: { ...LINEA, factor_carga: 0.5, resistencia_ohm_km: 0.3 } } },
        { functionCall: { name: "calcular_perdidas", args: { ...LINEA, factor_carga: 0.9, resistencia_ohm_km: 0.3 } } },
      ] } }] };
    }
    return { candidates: [{ content: { role: "model", parts: [{ text: "Resumen con lo obtenido." }] } }] };
  });
  const ctx4 = ctxNuevo();
  const r4 = await analisis.ejecutarTurno({ conv: conv4, texto: "y", clave: "k", ajustes: { ...ajustes, maxCalculos: 1 }, ctx: ctx4 });
  ok(r4.presupuestoAgotado === true && !r4.truncado && r4.texto === "Resumen con lo obtenido.", "se acaban los cálculos (no las rondas): queda marcado presupuestoAgotado");

  // error de red -> se revierte el turno
  const conv3 = { contenidos: [{ role: "user", parts: [{ text: "previo" }] }, { role: "model", parts: [{ text: "ok" }] }] };
  const ctx3 = ctxNuevo();
  gemini.usarMock(async () => { throw new gemini.ErrorGemini("caída", { tipo: "red" }); });
  let err = null;
  try { await analisis.ejecutarTurno({ conv: conv3, texto: "nuevo", clave: "k", ajustes, ctx: ctx3 }); } catch (e) { err = e; }
  ok(err && err.tipo === "red" && conv3.contenidos.length === 2, "ante un error se revierte el historial del turno");

  // prompt de sistema: el del agente si se pasa; si no, el estandar
  const sistemas = [];
  gemini.usarMock(async ({ cuerpo }) => {
    sistemas.push(cuerpo.systemInstruction.parts[0].text);
    return { candidates: [{ content: { role: "model", parts: [{ text: "ok" }] } }] };
  });
  await analisis.ejecutarTurno({ conv: { contenidos: [] }, texto: "a", clave: "k", ajustes, ctx: ctxNuevo() });
  await analisis.ejecutarTurno({ conv: { contenidos: [] }, texto: "b", clave: "k", ajustes, ctx: ctxNuevo(), sistema: "PROMPT PROPIO" });
  ok(sistemas[0] === analisis.SISTEMA_ANALISIS && sistemas[1] === "PROMPT PROPIO", "usa el prompt del agente si se pasa y el estándar por defecto");

  // herramientas permitidas: se declaran solo esas y las demas se rechazan aunque el modelo las pida
  const declaradas = [];
  let respuestaTuberia = null;
  gemini.usarMock(async ({ cuerpo }) => {
    declaradas.push(cuerpo.tools[0].functionDeclarations.map((d) => d.name).join());
    if (declaradas.length === 1) return { candidates: [{ content: { role: "model", parts: [{ functionCall: { name: "buscar_tuberia", args: {} } }] } }] };
    respuestaTuberia = cuerpo.contents.at(-1).parts[0].functionResponse.response;
    return { candidates: [{ content: { role: "model", parts: [{ text: "ok" }] } }] };
  });
  const rp = await analisis.ejecutarTurno({ conv: { contenidos: [] }, texto: "q", clave: "k", ajustes, ctx: ctxNuevo(), permitidas: ["calcular_perdidas", "calcular_regulacion"] });
  ok(declaradas[0] === "calcular_perdidas,calcular_regulacion", "el turno declara solo las herramientas permitidas del agente");
  ok(respuestaTuberia && respuestaTuberia.ok === false && respuestaTuberia.error.includes("no está habilitada") && rp.herramientas.length === 1 && rp.herramientas[0].ok === false, "una herramienta no permitida que el modelo pida se rechaza y se informa como error");

  // Varios: fuera del estandar (por defecto la IA no las tiene), disponibles si el agente las habilita
  const pedirConversion = async (extra) => {
    let respuesta = null;
    let nDecl = 0;
    let vuelta = 0;
    gemini.usarMock(async ({ cuerpo }) => {
      if (++vuelta === 1) {
        nDecl = cuerpo.tools[0].functionDeclarations.length;
        return { candidates: [{ content: { role: "model", parts: [{ functionCall: { name: "convertir_unidades", args: { categoria: "Longitud", unidad_origen: "m", unidad_destino: "ft", valor: 100 } } }] } }] };
      }
      respuesta = cuerpo.contents.at(-1).parts[0].functionResponse.response;
      return { candidates: [{ content: { role: "model", parts: [{ text: "ok" }] } }] };
    });
    const r = await analisis.ejecutarTurno({ conv: { contenidos: [] }, texto: "convierte", clave: "k", ajustes, ctx: ctxNuevo(), ...extra });
    return { respuesta, nDecl, r };
  };
  const porDefecto = await pedirConversion({});
  ok(porDefecto.nDecl === 10 && porDefecto.respuesta.ok === false && porDefecto.respuesta.error.includes("no está habilitada"), "por defecto (agente estándar) la IA no tiene las herramientas de Varios: se declaran 10 y una llamada a convertir_unidades se rechaza");
  const conVarios = await pedirConversion({ permitidas: [...tools.HERRAMIENTAS_ESTANDAR, "convertir_unidades"] });
  ok(conVarios.nDecl === 11 && conVarios.respuesta.ok === true && Math.abs(conVarios.respuesta.resultados[0].valor - 100 / 0.3048) < 1e-6 && conVarios.r.herramientas[0].titulo === "Conversión de unidades", "un agente que la activa la recibe y la usa (100 m = 328.0840 ft)");
  gemini.usarMock(null);
});
