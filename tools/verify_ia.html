await seccion("agentes de análisis", async () => {
  const claves = ["ia.agentesAnalisis", "ia.agenteAnalisisActivo"];
  const limpiar = () => claves.forEach((k) => window.localStorage.removeItem(k));
  limpiar();
  const def = agAn.AGENTE_PREDETERMINADO;
  const riguroso = agAn.AGENTES_PREDETERMINADOS[1];
  let lista = agAn.cargarAgentes();
  ok(lista.length === 2 && lista[0] === def && lista[1] === riguroso && def.predefinido && def.id === agAn.ID_PREDETERMINADO, "sin agentes propios: los 2 predeterminados (estándar primero)");
  ok(def.instrucciones === analisis.SISTEMA_ANALISIS && def.reporte === analisis.PROMPT_REPORTE, "el predeterminado usa el prompt y el reporte estándar del código");
  ok(Object.isFrozen(def) && Object.isFrozen(riguroso) && Object.isFrozen(agAn.AGENTES_PREDETERMINADOS), "los predeterminados (y el array) están congelados: no se pueden mutar");
  ok(agAn.construirSistema(def) === analisis.SISTEMA_ANALISIS, "el sistema del predeterminado se envía tal cual");
  ok(/\n10\. Si te piden un cálculo, una conversión o un dato/.test(analisis.SISTEMA_ANALISIS) && analisis.SISTEMA_ANALISIS.includes("NO escribas ningún valor") && analisis.SISTEMA_ANALISIS.includes("Herramientas que puede usar"), "el estándar prohíbe escribir valores cuando falta la herramienta (regla 9) y remite a Agentes");
  ok(analisis.SISTEMA_ANALISIS.includes("REFERENCIAS DE DISEÑO") && analisis.SISTEMA_ANALISIS.includes("nunca las llames «norma»") && analisis.SISTEMA_ANALISIS.includes("«tramos»") && analisis.SISTEMA_ANALISIS.includes("corriente_falla_ka"), "el prompt estándar explica que Óptimo/Aceptable/Elevado son referencias de diseño (no norma) y cómo usar tramos, grupos y corriente de falla");
  ok(analisis.SISTEMA_ANALISIS.startsWith("Eres el asistente de análisis") && /\n9\. Da respuestas claras/.test(analisis.SISTEMA_ANALISIS) && analisis.SISTEMA_ANALISIS.includes("No las cuestiones ni las \"corrijas\"."), "las reglas 1 a 8 del estándar siguen ahí");

  // agente riguroso: memoria de calculo completa, todas las herramientas
  ok(riguroso.predefinido && riguroso.id !== def.id && riguroso.instrucciones === analisis.SISTEMA_RIGUROSO && riguroso.reporte === analisis.PROMPT_REPORTE_RIGUROSO, "el riguroso usa su propio prompt y reporte, distintos del estándar");
  ok(riguroso.herramientas === tools.HERRAMIENTAS_TODAS && riguroso.herramientas.length > tools.HERRAMIENTAS_ESTANDAR.length, "el riguroso tiene TODAS las herramientas (más que el estándar)");
  ok(riguroso.herramientas.includes("guardar_ficha_proyecto") && riguroso.herramientas.includes("dimensionar_conductor") && riguroso.herramientas.includes("convertir_unidades"), "incluye la ficha del proyecto, las de diseño y las de Varios");
  ok(analisis.SISTEMA_RIGUROSO.includes("guardar_ficha_proyecto") && analisis.SISTEMA_RIGUROSO.includes("por categoría") && /varias respuestas|VARIAS respuestas/.test(analisis.SISTEMA_RIGUROSO), "el prompt riguroso pide categorías, confirmar valores por defecto y repartir en varias respuestas");
  // 2026-09-24: origen "estimado" con justificación, revisar datos atípicos, confirmación final antes de calcular, y
  // sensibilidad exploratoria SOLO para el estándar (el riguroso no la usa: su memoria es definitiva).
  ok(analisis.SISTEMA_RIGUROSO.includes('"estimado"') && analisis.SISTEMA_RIGUROSO.includes("justificacion"), "el riguroso conoce el tercer origen «estimado» y que exige justificación");
  ok(/atípico|fuera de lo usual/.test(analisis.SISTEMA_RIGUROSO), "el riguroso revisa valores atípicos antes de dar una categoría por buena");
  ok(/resume en un solo mensaje TODOS los parámetros/.test(analisis.SISTEMA_RIGUROSO), "el riguroso pide una confirmación final de todos los parámetros justo antes de calcular");
  ok(/NO uses barrer_parametro como análisis de sensibilidad exploratorio/.test(analisis.SISTEMA_RIGUROSO), "el riguroso NO usa la sensibilidad exploratoria (queda solo para el estándar)");
  ok(/ofrece o corre barrer_parametro por iniciativa propia/.test(analisis.SISTEMA_ANALISIS), "el estándar sí ofrece/corre sensibilidad por iniciativa propia con datos inciertos o cerca de un umbral");
  ok(analisis.PROMPT_REPORTE_RIGUROSO.includes("estimación de ingeniería"), "la memoria riguroso también resume las estimaciones (no solo usuario/defecto) en Datos de entrada y en Supuestos");
  ok(analisis.PROMPT_REPORTE_RIGUROSO.includes("MEMORIA DE CÁLCULO") && analisis.PROMPT_REPORTE_RIGUROSO.includes("Verificación de cumplimiento"), "el reporte riguroso pide una memoria de cálculo formal, distinta de la del estándar");
  ok(agAn.construirSistema(riguroso) === analisis.SISTEMA_RIGUROSO, "el sistema del riguroso se envía tal cual (predefinido: sin regla fija añadida aparte)");

  // propio: duplicar, guardar, cargar
  const copia = agAn.duplicarAgente(def);
  ok(copia.id !== def.id && !copia.predefinido && copia.instrucciones === def.instrucciones && copia.nombre.endsWith("(copia)"), "duplicar crea una copia editable con otro id");
  copia.instrucciones = "Responde en inglés y muy breve.";
  const nuevo = { ...agAn.nuevoAgente(), nombre: "Mío", instrucciones: "Solo tablas.", temperatura: 0.9, reporte: "" };
  ok(agAn.guardarPropios([def, copia, nuevo]) === true, "guardarPropios responde true");
  const crudo = window.localStorage.getItem("ia.agentesAnalisis");
  ok(!crudo.includes(agAn.ID_PREDETERMINADO) && !crudo.includes(riguroso.id), "ningún predeterminado se escribe en el almacenamiento");
  lista = agAn.cargarAgentes();
  ok(lista.length === 4 && lista[0].id === def.id && lista[1].id === riguroso.id && lista[2].instrucciones === copia.instrucciones && lista[3].temperatura === 0.9, "carga: los 2 predeterminados primero y luego los propios");

  // la regla fija se añade a los propios, no a los predefinidos
  const sistemaPropio = agAn.construirSistema(lista[2]);
  ok(sistemaPropio.startsWith("Responde en inglés") && sistemaPropio.endsWith(agAn.REGLA_FIJA), "los agentes propios llevan la regla fija de no calcular al final");
  ok(agAn.promptReporte(lista[3]) === analisis.PROMPT_REPORTE && agAn.promptReporte({ reporte: "Solo un párrafo." }) === "Solo un párrafo.", "reporte vacío = estándar; con texto = el del agente");
  ok(agAn.temperaturaDe(lista[3], 0.3) === 0.9 && agAn.temperaturaDe(lista[2], 0.3) === 0.3, "temperatura del agente o la general");

  // herramientas por agente
  ok(agAn.herramientasDe(def).length === 10 && def.herramientas === tools.HERRAMIENTAS_ESTANDAR, "el predeterminado habilita las herramientas estándar");
  ok(copia.herramientas.length === 10 && !Object.isFrozen(copia.herramientas) && nuevo.herramientas.length === 10, "duplicar y crear agentes parten de las estándar (lista editable)");
  const soloDos = { ...agAn.nuevoAgente(), nombre: "Dos", instrucciones: "x", herramientas: ["buscar_tuberia", "calcular_perdidas"] };
  agAn.guardarPropios([soloDos]);
  ok(agAn.cargarAgentes()[2].herramientas.join() === "calcular_perdidas,buscar_tuberia", "la lista de herramientas se guarda y se carga");
  window.localStorage.setItem("ia.agentesAnalisis", JSON.stringify([{ id: "v", nombre: "viejo", instrucciones: "a" }, { id: "w", nombre: "raro", instrucciones: "a", herramientas: ["inventada", "calcular_perdidas"] }, { id: "z", nombre: "vacio", instrucciones: "a", herramientas: [] }]));
  const cargados = agAn.cargarAgentes();
  ok(cargados[2].herramientas.length === 10, "un agente guardado sin lista usa las herramientas estándar");
  ok(cargados[3].herramientas.join() === "calcular_perdidas" && cargados[4].herramientas.length === 0, "nombres desconocidos se descartan; una lista vacía se respeta");

  // almacenamiento manipulado: no puede suplantar ni romper los predeterminados
  window.localStorage.setItem("ia.agentesAnalisis", JSON.stringify([{ id: agAn.ID_PREDETERMINADO, nombre: "Falso", instrucciones: "hackeado" }, { id: riguroso.id, nombre: "Falso2", instrucciones: "hackeado" }, { id: "x", nombre: "ok", instrucciones: "a", temperatura: 99 }]));
  lista = agAn.cargarAgentes();
  ok(lista.length === 3 && lista[0] === def && lista[1] === riguroso && lista[2].id === "x" && lista[2].temperatura === 1.5, "un guardado con el id de un predeterminado se ignora y la temperatura se acota");
  window.localStorage.setItem("ia.agentesAnalisis", "no es json");
  ok(agAn.cargarAgentes().length === 2, "JSON corrupto -> solo los 2 predeterminados");
  limpiar();
});

const acceso = await import("../js/auth/backend.js");
const { crearBackendMock } = await import("../js/auth/backend-mock.js");
const YO = { email: "Yo@Gmail.com", nombre: "Yo", foto: "" };
const OTRO = { email: "otro@gmail.com", nombre: "Otro", foto: "" };

  await b.guardarClavePersonal("CLAVE-MIA");
  b._entrarComo(OTRO);
  ok((await b.leerClavePersonal()) === "CLAVE-DE-OTRO", "cada usuario conserva la suya");
  await b.guardarClavePersonal(null);
  ok((await b.leerClavePersonal()) === null, "borrar la clave personal");
  b._entrarComo(YO);
  await b.guardarClaveCompartida(null);
  ok((await b.leerClaveCompartida()) === null, "el admin borra la compartida");
  b._entrarComo(EXTRAÑO);
  ok(await falla(() => b.leerClavePersonal(), "permiso"), "no autorizado no lee claves");
});

await seccion("acceso: login, logout y conexión", async () => {
  const b = crearBackendMock({ usuarios: semilla(), cuentaAlIniciar: OTRO });
  ok((await acceso.esperarSesion(b)) === null, "arranca sin sesión");
  const u = await b.iniciarSesion();
  ok(u.email === "otro@gmail.com" && (await b.obtenerPerfil()).rol === "usuario", "iniciarSesion deja la sesión activa");
  await b.cerrarSesion();
  ok((await b.obtenerPerfil()) === null, "cerrarSesion");
  const c = crearBackendMock({ usuarios: semilla(), sesion: YO });
  c._conexion(false);
  ok(await falla(() => c.listarUsuarios(), "offline"), "sin conexión => error 'offline'");
  const cancel = crearBackendMock({ usuarios: semilla(), cuentaAlIniciar: null });
  ok(await falla(() => cancel.iniciarSesion(), "cancelado"), "login cancelado => error 'cancelado'");
});

const claves = await import("../js/ai/clave.js");
const cfgIA = await import("../js/ai/config.js");

await seccion("clave: fuente de la clave de Gemini (local / personal / compartida)", async () => {
  localStorage.removeItem("ia.fuenteClave");
  cfgIA.borrarClave();
  ok(claves.obtenerFuente() === "local", "por defecto la fuente es 'local'");
  let r = await claves.prepararClave();
  ok(!r.ok && r.motivo === "sin-clave-local", "local sin clave -> 'sin-clave-local'");
  cfgIA.guardarClave("AIza-LOCAL", false);
  r = await claves.prepararClave();
  ok(r.ok && claves.claveEnUso() === "AIza-LOCAL", "local con clave -> la usa");
  cfgIA.borrarClave();

  claves.guardarFuente("compartida");
  acceso.simularSinBackend();
  r = await claves.prepararClave();
  ok(!r.ok && r.motivo === "sin-servicio", "servidor sin Firebase configurado -> 'sin-servicio'");

  acceso.usarBackend(crearBackendMock({ usuarios: semilla(), sesion: null, claveCompartida: "AIza-COMPARTIDA" }));
  r = await claves.prepararClave();
  ok(!r.ok && r.motivo === "sin-sesion", "sin sesión -> 'sin-sesion'");

  acceso.usarBackend(crearBackendMock({ usuarios: semilla(), sesion: EXTRAÑO, claveCompartida: "AIza-COMPARTIDA" }));
  r = await claves.prepararClave();
  ok(!r.ok && r.motivo === "sin-acceso" && claves.claveEnUso() === "", "correo fuera de la lista -> 'sin-acceso' y no entrega la clave");

  acceso.usarBackend(crearBackendMock({ usuarios: semilla(), sesion: OTRO, claveCompartida: "AIza-COMPARTIDA" }));
  r = await claves.prepararClave();
  ok(r.ok && claves.claveEnUso() === "AIza-COMPARTIDA", "usuario autorizado -> usa la clave compartida");
  const guardado = JSON.stringify({ ...localStorage }) + JSON.stringify({ ...sessionStorage });
  ok(!guardado.includes("AIza-COMPARTIDA"), "la clave del servidor NO se copia a localStorage/sessionStorage (solo memoria)");
  claves.olvidarClaveServidor();
  ok(claves.claveEnUso() === "", "olvidarClaveServidor() borra la copia en memoria");

  acceso.usarBackend(crearBackendMock({ usuarios: semilla(), sesion: OTRO, claveCompartida: null }));
  r = await claves.prepararClave();
  ok(!r.ok && r.motivo === "sin-clave-servidor", "compartida sin configurar -> 'sin-clave-servidor'");

  claves.guardarFuente("personal");
  const mp = crearBackendMock({ usuarios: semilla(), sesion: OTRO, claveCompartida: "AIza-COMPARTIDA" });
  acceso.usarBackend(mp);
  r = await claves.prepararClave();
  ok(!r.ok && r.motivo === "sin-clave-servidor", "personal sin configurar -> 'sin-clave-servidor' (no cae a la compartida)");
  await mp.guardarClavePersonal("AIza-PERSONAL");
  r = await claves.prepararClave();
  ok(r.ok && claves.claveEnUso() === "AIza-PERSONAL", "personal configurada -> usa la personal");

  const off = crearBackendMock({ usuarios: semilla(), sesion: OTRO, claveCompartida: "x" });
  off._conexion(false);
  acceso.usarBackend(off);
  r = await claves.prepararClave();
  ok(!r.ok && r.motivo === "error", "falla del servidor -> 'error' con mensaje (no rompe)");

  claves.guardarFuente("basura");
  ok(claves.obtenerFuente() === "local", "una fuente inválida se trata como 'local'");
  acceso.usarBackend(null);
  localStorage.removeItem("ia.fuenteClave");
});

out.textContent += `\nRESULT: ${fallos ? "FAIL" : "OK"} (${total - fallos}/${total})\n`;
document.title = fallos ? "FAIL" : "OK";
