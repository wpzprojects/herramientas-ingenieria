<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>verify_ia_pantallas</title>
<!--
  Pruebas del rediseño de las pantallas de Funciones con IA (2026-09-19): «Configuración de IA» (js/views/ia-configuracion.js)
  «Corrector de redacción» (js/views/ia-redaccion.js) y «Análisis con calculadoras» (js/views/ia-analisis.js). Se ejecuta en el navegador, sin internet (Gemini simulado con un fetch falso).

  Uso (desde la raiz del proyecto):
    python -m http.server 8000
    abrir http://localhost:8000/tools/verify_ia_pantallas.html   -> lista PASS/FAIL
  o en modo consola:
    msedge --headless --dump-dom --virtual-time-budget=35000 http://localhost:8000/tools/verify_ia_pantallas.html
-->
<style>body{font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:12px}#stage{position:absolute;left:-9999px;width:1000px}</style>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<pre id="out"></pre>
<div id="stage"></div>
<script type="module">
window.__BASE_PATH__ = "../";
const out = document.getElementById("out");
let fallos = 0;
let total = 0;
function ok(cond, msg) {
  total++;
  if (!cond) fallos++;
  out.textContent += `${cond ? "PASS" : "FAIL"} ${msg}\n`;
}
async function seccion(nombre, fn) {
  out.textContent += `\n== ${nombre}\n`;
  try {
    await fn();
  } catch (err) {
    fallos++;
    total++;
    out.textContent += `FAIL excepcion en "${nombre}": ${err && err.stack ? err.stack : err}\n`;
  }
}
const espera = (ms) => new Promise((r) => setTimeout(r, ms));
const stage = document.getElementById("stage");
const texto = (e) => (e ? e.textContent.replace(/\s+/g, " ").trim() : "");

const cfg = await import("../js/ai/config.js");
const clave = await import("../js/ai/clave.js");

// Gemini simulado: la lista de modelos
const fetchReal = window.fetch;
let llamadas = 0;
window.fetch = async (url, opciones) => {
  if (String(url).includes("generativelanguage.googleapis.com") && String(url).includes("/models")) {
    llamadas++;
    return new Response(JSON.stringify({ models: [
      { name: "models/gemini-2.5-flash", supportedGenerationMethods: ["generateContent"] },
      { name: "models/gemini-2.5-pro", supportedGenerationMethods: ["generateContent"] },
      { name: "models/embedding-001", supportedGenerationMethods: ["embedContent"] },
    ] }), { status: 200, headers: { "Content-Type": "application/json" } });
  }
  return fetchReal(url, opciones);
};

function limpiarTodo() {
  cfg.borrarClave();
  cfg.borrarAjustes();
  try { localStorage.removeItem("ia.fuenteClave"); } catch { /* nada */ }
}

await seccion("Configuración de IA rediseñada", async () => {
  const vista = await import("../js/views/ia-configuracion.js");
  const marco = document.createElement("div");
  stage.innerHTML = "";
  stage.append(marco);
  const q = (s) => marco.querySelector(s);
  const qa = (s) => [...marco.querySelectorAll(s)];
  const dibujar = async () => {
    marco.innerHTML = "";
    await vista.render(marco, {});
    await espera(80);
  };

  limpiarTodo();
  await dibujar();
  const tarjetas = qa(".card");
  ok(tarjetas.length === 3 && tarjetas.every((c) => c.classList.contains("tarjeta-borde")), "tres tarjetas con el relleno de 16 px (tarjeta-borde)");
  ok(qa(".form-section-title").map(texto).join("|") === "Conexión con Gemini|Modelo|Datos y privacidad" && qa(".form-section-title .icon").length === 3, "cada una con barra de título e icono: Conexión con Gemini | Modelo | Datos y privacidad");
  ok(qa(".hint").length === 0, "ya no hay textos .hint debajo de los campos");
  ok(qa("label[data-info]").length === 5 && qa(".info-btn, label[data-info] button").length >= 5, "la ayuda va en 5 botones «i» (clave, modelo, temperatura, rondas y cálculos)");

  // conexion
  ok(!!q("#btn-guardar.btn-primary") && !!q("#btn-probar") && !!q("#btn-borrar-clave") && !q("#btn-instructivo.btn"), "«Guardar clave» es el principal, «Probar conexión» y «Borrar clave» secundarios; «¿Cómo obtener mi clave?» es un enlace, no un botón");
  const bordeBorrar = getComputedStyle(q("#btn-borrar-clave")).borderTopWidth;
  ok(!q("#btn-borrar-clave").classList.contains("btn-ghost") && bordeBorrar !== "0px" && bordeBorrar === getComputedStyle(q("#btn-probar")).borderTopWidth, `«Borrar clave» tiene borde como los demás botones (${bordeBorrar})`);
  ok(!!q("#btn-borrar-clave svg") && !!q("#btn-borrar-historial svg"), "los botones de borrar llevan icono de papelera");
  ok(/Cambiar en Perfil/.test(texto(q("#fuente-clave"))) && !!q("#fuente-clave a[href='#/perfil/clave']") && !!q("#fuente-clave .badge"), "la línea de estado dice qué clave se usa (insignia) y enlaza a Perfil");
  ok(!q("#aviso-fuente .callout"), "con «Este navegador» no hay aviso sobre la clave del servidor");
  ok(/Todavía no hay una clave guardada en este navegador/.test(texto(q("#estado-clave"))), "sin clave: lo dice");

  // avanzados plegados
  ok(q("#ia-avanzado").tagName === "DETAILS" && !q("#ia-avanzado").open && qa("#ia-avanzado input").length === 3, "los ajustes avanzados (3 campos) están plegados por defecto");
  q("#ia-avanzado summary").click();
  ok(q("#ia-avanzado").open, "se abren al pulsar «Ajustes avanzados»");

  // sin clave
  q("#btn-probar").click();
  await espera(50);
  ok(/Primero guarda o pega una clave/.test(texto(q("#msg-conexion"))), "«Probar conexión» sin clave avisa");
  q("#btn-actualizar-modelos").click();
  await espera(50);
  ok(/Primero guarda o pega una clave/.test(texto(q("#msg-modelo"))) && llamadas === 0, "«Actualizar lista» sin clave avisa (y no llama a Gemini)");

  // guardar clave
  q("#f-clave").value = "AIzaSyPRUEBA1234567890";
  q("#btn-guardar").click();
  ok(/Clave guardada/.test(texto(q("#msg-conexion"))) && /Clave guardada en este navegador: AIza/.test(texto(q("#estado-clave"))) && cfg.obtenerClave() === "AIzaSyPRUEBA1234567890", "guardar la clave la deja registrada y la muestra enmascarada");
  ok(q("#f-clave").value === "AIzaSyPRUEBA1234567890" && q("#f-clave").type === "password", "la clave guardada aparece en el campo, oculta con puntos (type=password)");
  q("#btn-ver").click();
  ok(q("#f-clave").type === "text" && q("#btn-ver").textContent === "Ocultar", "«Mostrar» la revela");
  q("#btn-ver").click();
  ok(q("#f-clave").type === "password", "y «Ocultar» la vuelve a esconder");
  await dibujar();
  ok(q("#f-clave").value === "AIzaSyPRUEBA1234567890" && q("#f-clave").type === "password" && /Este navegador/.test(texto(q("#fuente-clave .badge"))), "al volver a abrir la pantalla, con «Este navegador» en uso, la clave guardada se ve en el campo (oculta): ya no queda vacío");

  // probar y actualizar: separados
  const antes = llamadas;
  const modeloAntes = q("#f-modelo").value;
  q("#btn-probar").click();
  await espera(120);
  ok(/Conexión correcta/.test(texto(q("#msg-conexion"))) && llamadas === antes + 1, "«Probar conexión» verifica la clave (una llamada a Gemini)");
  ok(qa("#f-modelo option").length === 1 && q("#f-modelo").value === modeloAntes, "y NO toca la lista de modelos ni el modelo elegido");
  q("#btn-actualizar-modelos").click();
  await espera(150);
  ok(qa("#f-modelo option").length === 2 && /2 modelos disponibles/.test(texto(q("#msg-modelo"))), "«Actualizar lista» carga los modelos de generación (2, sin el de embeddings)");
  ok(cfg.obtenerAjustes().modelo === q("#f-modelo").value, "y deja guardado el modelo activo");

  // ajustes
  q("#f-temp").value = "0.5";
  q("#f-rondas").value = "99";
  q("#f-calculos").value = "10";
  q("#btn-guardar-ajustes").click();
  const a = cfg.obtenerAjustes();
  ok(a.temperatura === 0.5 && a.maxRondas === 15 && a.maxCalculos === 10 && /Ajustes guardados/.test(texto(q("#msg-ajustes"))), `guardar ajustes: temperatura y límites (un campo numérico ya normaliza la coma) y limita al rango (99 rondas → 15): ${JSON.stringify(a)} / ${texto(q("#msg-ajustes"))}`);
  q("#btn-restaurar-ajustes").click();
  ok(cfg.obtenerAjustes().maxRondas === cfg.AJUSTES_POR_DEFECTO.maxRondas && /restablecidos/.test(texto(q("#msg-ajustes"))), "restablecer valores");

  // borrar clave: pide confirmacion
  q("#f-clave").value = "AIzaSyPRUEBA1234567890";
  cfg.guardarClave("AIzaSyPRUEBA1234567890", true);
  const confirmReal = window.confirm;
  let preguntas = [];
  window.confirm = (m) => { preguntas.push(m); return false; };
  q("#btn-borrar-clave").click();
  ok(preguntas.length === 1 && /¿Borrar la clave guardada en este navegador\?/.test(preguntas[0]) && cfg.obtenerClave() === "AIzaSyPRUEBA1234567890", "«Borrar clave» pide confirmación y, si se cancela, NO borra");
  window.confirm = () => true;
  q("#btn-borrar-clave").click();
  ok(!cfg.obtenerClave() && q("#f-clave").value === "" && /Clave eliminada/.test(texto(q("#msg-conexion"))), "si se confirma, la elimina y vacía el campo");
  preguntas = [];
  window.confirm = (m) => { preguntas.push(m); return true; };
  q("#btn-borrar-clave").click();
  ok(preguntas.length === 0 && /No hay una clave guardada/.test(texto(q("#msg-conexion"))), "sin clave guardada no pregunta nada: avisa que no hay clave");
  window.confirm = confirmReal;

  // privacidad
  ok(qa("#ia-privacidad li").length === 4 && /Privacidad/.test(texto(q("#ia-privacidad strong"))) && /Google/.test(texto(q("#ia-privacidad"))), "el aviso de privacidad es un recuadro con 4 viñetas");
  ok(!!q("#info-datos") && !!q("#btn-borrar-historial") && !!q("#btn-restaurar-agentes"), "la tarjeta de datos tiene su texto de estado y los dos botones de borrar/restaurar (el conteo usa IndexedDB, que el navegador de pruebas no siempre da)");

  // con una clave del servidor elegida en Perfil
  clave.guardarFuente("compartida");
  await dibujar();
  ok(/Clave compartida \(servidor\)/.test(texto(q("#fuente-clave .badge"))) && /clave del servidor/.test(texto(q("#aviso-fuente"))), "si en Perfil se eligió una clave del servidor, la pantalla lo dice y aclara que el campo local no se usa");
  limpiarTodo();
});

await seccion("Corrector de redacción rediseñado", async () => {
  // Gemini simulado: la respuesta cambia con lo ultimo que se le pide
  const generaciones = [];
  const fetchPrevio = window.fetch;
  window.fetch = async (url, opciones) => {
    if (String(url).includes(":generateContent")) {
      const cuerpo = JSON.parse(opciones.body);
      const ultimo = cuerpo.contents.at(-1).parts[0].text;
      generaciones.push(ultimo);
      return new Response(JSON.stringify({ candidates: [{ content: { role: "model", parts: [{ text: `RESPUESTA ${generaciones.length}` }] }, finishReason: "STOP" }] }), { status: 200, headers: { "Content-Type": "application/json" } });
    }
    return fetchPrevio(url, opciones);
  };
  cfg.guardarClave("AIzaSyPRUEBA1234567890", false);
  clave.guardarFuente("local");
  try { localStorage.removeItem("ia.agentesRedaccion"); localStorage.removeItem("ia.agenteRedaccionActivo"); } catch { /* nada */ }
  const vista = await import("../js/views/ia-redaccion.js");
  const marco = document.createElement("div");
  stage.innerHTML = "";
  stage.append(marco);
  const q = (s) => marco.querySelector(s);
  const qa = (s) => [...marco.querySelectorAll(s)];
  await vista.render(marco, {});
  await espera(150);

  // --- tarjeta Agente
  const tarjeta = q(".card");
  ok(tarjeta.classList.contains("tarjeta-borde") && /Agente/.test(texto(tarjeta.querySelector(".form-section-title"))) && !!tarjeta.querySelector(".form-section-title .icon"), "la tarjeta «Agente» tiene relleno de 16 px y barra de título con icono");
  ok(!!q("#tarjeta-agente .form-section-title .icon g path[d^='M6 6a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4']"), "el icono de la tarjeta «Agente» es el robot");
  const rob = q("#tarjeta-agente .form-section-title .icon").getBoundingClientRect();
  const otro = q("#conv .form-section-title .icon").getBoundingClientRect();
  ok(Math.round(rob.width) === 21 && Math.round(rob.height) === 21 && rob.width > otro.width, `el robot es un poco más grande que los demás iconos de barra (${Math.round(rob.width)} px frente a ${Math.round(otro.width)} px) sin ser desproporcionado`);
  ok(qa("#tarjeta-agente .ia-pestanas .tab-btn").map(texto).join("|") === "Agentes|Gestionar" && q("#tarjeta-agente .ia-pestanas .tab-btn.active").textContent === "Agentes", "la tarjeta «Agente» tiene solo las pestañas «Agentes | Gestionar» (el historial pasó a «Conversación»)");
  ok(qa("#conv .ia-pestanas .tab-btn").map(texto).join("|") === "Actual|Historial" && q("#conv .ia-pestanas .tab-btn.active").textContent === "Actual", "la tarjeta «Conversación» tiene las pestañas «Actual | Historial» (empieza en «Actual»)");
  ok(qa(".card").length === 2 || qa(".card").length === 1, "todo vive en UNA tarjeta (más la de la conversación): ya no se abren tarjetas nuevas debajo");
  ok(qa("#lista-agentes .ia-chip").length === 4 && q("#lista-agentes .ia-chip").getAttribute("aria-pressed") === "true", "los 4 agentes siguen como píldoras y el primero está activo");
  const desc = q("#desc-agente");
  ok(desc.classList.contains("ia-desc-agente") && !desc.classList.contains("text-muted") && /correos/i.test(texto(desc)), "la descripción del agente es más visible (ya no es gris tenue)");

  // --- tarjeta de la conversacion: ahora con su barra de titulo
  const tConv = q("#conv");
  ok(tConv.classList.contains("tarjeta-borde") && texto(tConv.querySelector(".form-section-title")) === "Conversación" && !!tConv.querySelector(".form-section-title .icon g path[d^='M3 20l1.3 -3.9']"), "la tarjeta donde se escribe también tiene barra de título con icono: «Conversación»");
  ok(tConv.querySelector(".form-section-title").nextElementSibling === tConv.querySelector(".ia-pestanas") && tConv.querySelector(".ia-pestanas").nextElementSibling === q("#vista-actual"), "el título va arriba de todo, luego las pestañas «Actual | Historial» y después el chat y la caja de texto");

  // --- estado vacio: el ejemplo cambia con el agente
  ok(/borrador del correo/.test(q("#f-texto").placeholder), `el ejemplo de la caja habla del agente activo: «${q("#f-texto").placeholder}»`);
  qa("#lista-agentes .ia-chip")[3].click();
  ok(/resumen/.test(q("#f-texto").placeholder) && /borrador/.test(q("#f-texto").placeholder) === false, "al elegir «Resúmenes» el ejemplo cambia");
  qa("#lista-agentes .ia-chip")[0].click();

  // --- respuesta con etiqueta, «Copiar» donde estaba y atajos de ajuste
  q("#f-texto").value = "hola equipo les mando el informe";
  q("#btn-enviar").click();
  await espera(300);
  const resp = qa(".ia-msg--model").find((m) => /RESPUESTA 1/.test(m.textContent));
  ok(!!resp && texto(resp.querySelector(".ia-msg-etiqueta")) === "Correo corregido", "la respuesta lleva la etiqueta «Correo corregido» (según el agente)");
  ok(!!resp.querySelector(".ia-msg-acciones button svg") && /Copiar/.test(texto(resp.querySelector(".ia-msg-acciones"))), "el botón «Copiar» sigue en el mismo lugar, dentro de la respuesta");
  const chips = qa(".ia-ajustes .ia-chip").map(texto);
  ok(chips.join("|") === "Más corto|Más formal|Más cordial|Explica los cambios", `debajo de la respuesta hay atajos de ajuste: ${chips.join(", ")}`);
  ok(q(".ia-ajustes").previousElementSibling === resp, "y van justo después de la última respuesta");
  qa(".ia-ajustes .ia-chip")[0].click();
  await espera(300);
  ok(generaciones.length === 2 && /más corto/i.test(generaciones[1]), "«Más corto» le pide el ajuste a la IA sin escribir nada");
  ok(qa(".ia-msg--user").some((m) => texto(m) === "Más corto"), "el mensaje del usuario se ve como «Más corto»");
  ok(qa(".ia-ajustes").length === 1 && qa(".ia-msg--model").length === 2 && q(".ia-ajustes").previousElementSibling === qa(".ia-msg--model")[1], "los atajos se mueven bajo la respuesta nueva (solo hay un grupo)");

  // --- las tres vistas viven en la misma tarjeta
  const tarjetaAgente = q("#tarjeta-agente");
  const pestana = (v) => q(`#tarjeta-agente .ia-pestanas .tab-btn[data-vista="${v}"]`);
  const pestanaConv = (v) => q(`#conv .ia-pestanas .tab-btn[data-conv="${v}"]`);
  const visible = (el) => !!el && !el.hidden;
  const tarjetasAntes = qa(".card").length;
  q("#f-texto").value = "texto a medio escribir";
  pestanaConv("historial").click();
  await espera(150);
  ok(visible(q("#panel-historial")) && !visible(q("#vista-actual")) && q("#conv .ia-pestanas .tab-btn.active").textContent === "Historial", "«Historial» (en la tarjeta «Conversación») muestra el historial y oculta el chat y la caja");
  ok(q("#conv").contains(q("#panel-historial")) && !q("#tarjeta-agente").contains(q("#panel-historial")) && qa(".card").length === tarjetasAntes, "el historial vive en «Conversación», ya no en «Agente», y no abre tarjetas nuevas");
  { const prueba = document.createElement("div"); prueba.className = "ia-historial"; q("#panel-historial").append(prueba);
    ok(getComputedStyle(prueba).marginTop === "1.6px", "el historial queda a 25.6 px de las pestañas (20 % menos que los 32 px de antes: margen 1.6 px + los 24 px bajo las pestañas)"); prueba.innerHTML = '<div class="ia-historial-item"><span class="titulo">x</span></div>';
    const cT = getComputedStyle(prueba.querySelector(".titulo"));
    const botonEj = document.createElement("button"); botonEj.className = "ia-chip"; botonEj.setAttribute("aria-pressed", "false"); q("#panel-historial").append(botonEj);
    const cE = getComputedStyle(botonEj);
    ok(cT.fontSize === cE.fontSize && cT.color === cE.color && cT.fontWeight === cE.fontWeight, `la primera columna del historial tiene la letra de los ejemplos de pregunta (${cT.fontSize}, ${cT.color})`);
    botonEj.remove(); prueba.remove(); }
  ok(!q("#btn-enviar").checkVisibility() && q("#btn-nueva").checkVisibility() && !!q("#acciones.solo-nueva"), "viendo el historial la fila de abajo solo deja «Nueva conversación» (se ocultan Dictar y Enviar)");
  ok(q("#f-texto").value === "texto a medio escribir", "lo que estaba escrito en la caja se conserva");
  q("#btn-nueva").click();
  await espera(60);
  ok(visible(q("#vista-actual")) && !visible(q("#panel-historial")) && q("#conv .ia-pestanas .tab-btn.active").textContent === "Actual" && q("#btn-enviar").checkVisibility() && q("#f-texto").value === "", "«Nueva conversación» estando en el historial vuelve a «Actual», vacía la caja y reaparece la fila completa");
  pestanaConv("historial").click();
  pestanaConv("actual").click();
  ok(visible(q("#vista-actual")) && q("#btn-enviar").checkVisibility() && !q("#acciones.solo-nueva"), "«Actual» devuelve el chat, la caja y los botones");
  pestana("gestionar").click();
  pestana("agentes").click();
  ok(visible(q("#vista-agentes")) && !visible(q("#panel-gestor")) && qa("#lista-agentes .ia-chip").length === 4, "«Agentes» vuelve a mostrar los agentes disponibles");

  // --- gestor de agentes
  pestana("gestionar").click();
  await espera(100);
  const pg = q("#panel-gestor");
  ok(visible(pg) && !visible(q("#vista-agentes")) && tarjetaAgente.contains(pg) && qa(".card").length === tarjetasAntes, "«Gestionar» muestra la gestión en la misma tarjeta (sin tarjeta nueva)");
  const filas = [...pg.querySelectorAll("#gestor-lista .ia-historial-item")];
  const est = (f) => getComputedStyle(f);
  ok(filas.length === 4 && filas.every((f, i) => est(f).borderTopWidth === "0px" && est(f).borderLeftWidth === "0px" && est(f).borderRightWidth === "0px" && est(f).borderBottomWidth === (i < filas.length - 1 ? "1px" : "0px")), "la lista no son cajas: entre cada fila hay UNA sola línea fina (sin borde arriba, a los lados ni en la última fila)");
  const tit = getComputedStyle(filas[0].querySelector(".titulo"));
  ok(parseFloat(tit.fontSize) <= 14.5 && parseInt(tit.fontWeight) <= 500, `el nombre de cada fila es más pequeño y suave (${tit.fontSize}, peso ${tit.fontWeight}, color ${tit.color})`);
  ok(parseInt(tit.fontWeight) === 400 && tit.color !== getComputedStyle(q("#tarjeta-agente .form-section-title")).color, "sin negrita y con un color menos blanco que el texto principal");
  const eliminar = [...pg.querySelectorAll("#gestor-lista button")].filter((b) => b.textContent === "Eliminar");
  ok(eliminar.length === 4 && eliminar.every((b) => !b.classList.contains("btn-ghost") && getComputedStyle(b).borderTopWidth === getComputedStyle(pg.querySelector("#gestor-lista button")).borderTopWidth && getComputedStyle(b).borderTopWidth !== "0px"), "«Eliminar» tiene contorno igual que «Editar» y «Duplicar»");
  for (const arch of ["ia-redaccion", "ia-analisis"]) {
    const fuente = await (await fetch(`../js/views/${arch}.js`)).text();
    const i = fuente.indexOf("historial.borrar(c.id)");
    const antes = fuente.slice(Math.max(0, i - 400), i);
    ok(i > 0 && /¿Borrar esta conversación del historial\?/.test(antes) && /class: "btn btn-sm",\s*onclick: async/.test(antes), `${arch}: «Borrar» del historial pide confirmación antes de borrar y es un botón con contorno como «Abrir»`);
  }
  const cssApp = await (await fetch("../css/app.css")).text();
  ok(!/\.ia-historial-item:hover/.test(cssApp), "las filas no se resaltan al pasar el cursor");
  ok(filas.slice(1).every((f, i) => Math.abs(f.getBoundingClientRect().top - filas[i].getBoundingClientRect().bottom) < 1), "y las filas quedan pegadas (sin espacio que duplique la línea)");
  ok(!!pg.querySelector('.ia-gestor-acciones [data-a="nuevo"].btn-primary') && !!pg.querySelector(".ia-gestor-acciones .menu-mas") && pg.querySelectorAll("#gestor-lista .ia-historial-item").length === 4, "«Nuevo agente» es el único botón principal, hay un menú «Más» y la lista de los 4 agentes");
  const rLista = pg.querySelector("#gestor-lista").getBoundingClientRect();
  const rNuevo = pg.querySelector('[data-a="nuevo"]').getBoundingClientRect();

  ok(["Calculadoras", "Catálogos", "Análisis", "Varios"].every((g) => ed.querySelector(`[role="group"][aria-label="${g}"]`)), "siguen agrupadas por categoría: Calculadoras, Catálogos, Análisis y Varios");
  ok(chipsH.every((c) => c.title.length > 10), "cada una conserva su descripción al pasar el cursor");
  ed.querySelector("#g-cerrar").click();
  ok(!pc.querySelector(".ia-editor") && !pc.querySelector(".editando"), "«Cerrar» quita el editor y la marca");

  // --- duplicar, editar y usar
  filas[0].querySelectorAll("button.btn")[2].click(); // Duplicar
  await espera(150);
  ok(pc.querySelectorAll("#config-lista .ia-historial-item").length === 2 && /Editando:/.test(texto(pc.querySelector(".ia-editor-cabecera"))) && qa(".ia-editor label[data-info]").length === 4, "«Duplicar» crea la copia y abre su editor («Editando: …», con la ayuda de las instrucciones)");
  { // si los botones de UNA fila no caben junto al nombre, bajan en TODAS las filas
    const lista = pc.querySelector("#config-lista"), fs = [...lista.querySelectorAll(".ia-historial-item")];
    const abajo = (f) => { const t = f.querySelector(".titulo"), b = f.querySelector(".ia-historial-acciones"); return b.offsetTop >= t.offsetTop + t.offsetHeight; };
    const largo = document.createElement("span"); largo.style.cssText = "display:inline-block;width:320px"; fs[0].querySelector(".titulo").append(largo);
    const cuadro = async () => lista.dispatchEvent(new Event("alinear-acciones")); // el ResizeObserver real no avisa sin ventana visible
    lista.style.width = "560px"; await cuadro();
    ok(lista.classList.contains("acciones-abajo") && fs.every(abajo), "si en una fila los botones no caben junto al nombre, bajan los cuatro en todas las filas (aunque en las otras sí cupieran)");
    ok(fs.every((f) => { const b = f.querySelector(".ia-historial-acciones"); return b.getBoundingClientRect().left - f.getBoundingClientRect().left < 40; }), "los cuatro botones bajados quedan alineados a la izquierda de su fila");
    largo.remove(); lista.style.width = "800px"; await cuadro();
    ok(!lista.classList.contains("acciones-abajo") && fs.every((f) => !abajo(f)), "si en ninguna fila hace falta, todas vuelven a llevar los botones junto al nombre");
    lista.style.width = "";
  }
  const chipsC = [...pc.querySelectorAll(".ia-chip--herr")];
  ok(chipsC.length === 14 && chipsC.every((c) => !c.disabled), "en una copia editable las etiquetas de herramientas están activas");
  const unidades = chipsC.find((c) => /unidades/i.test(c.textContent));
  const perdidas = chipsC.find((c) => /Pérdidas/.test(c.textContent));
  ok(unidades.getAttribute("aria-pressed") === "false" && !unidades.querySelector(".ia-chip-check").checkVisibility() && perdidas.getAttribute("aria-pressed") === "true" && perdidas.querySelector(".ia-chip-check").checkVisibility(), "la ✓ solo se ve en las marcadas");
  unidades.click();
  perdidas.click();
  ok(unidades.getAttribute("aria-pressed") === "true" && unidades.querySelector(".ia-chip-check").checkVisibility() && perdidas.getAttribute("aria-pressed") === "false" && !perdidas.querySelector(".ia-chip-check").checkVisibility(), "pulsar marca o desmarca (selección múltiple) y la ✓ aparece o desaparece");
  ok(chipsC.filter((c) => c.getAttribute("aria-pressed") === "true").length === 9, "se pueden tener varias marcadas a la vez");
  // sin ninguna marcada no se guarda
  const alertaReal = window.alert;
  let avisos = [];
  window.alert = (m) => avisos.push(m);
  const marcadasAntes = chipsC.filter((c) => c.getAttribute("aria-pressed") === "true");
  marcadasAntes.forEach((c) => c.click());
  pc.querySelector("#g-guardar").click();
  ok(avisos.some((m) => /al menos una herramienta/.test(m)), "sin ninguna herramienta marcada no deja guardar y avisa");
  window.alert = alertaReal;
  marcadasAntes.forEach((c) => c.click());
  perdidas.click();
  pc.querySelector("#g-nombre").value = "Mi agente";
  pc.querySelector("#g-guardar").click();
  await espera(100);
  ok(/Cambios guardados/.test(texto(pc.querySelector("#config-msg"))) && /Mi agente/.test(texto(pc.querySelector("#config-lista"))), "guardar deja el mensaje y la lista actualizada");
  const guardadoAg = agAn.cargarAgentes().find((a) => a.nombre === "Mi agente");
  ok(guardadoAg.herramientas.includes("convertir_unidades") && guardadoAg.herramientas.includes("calcular_perdidas") && guardadoAg.herramientas.length === 10, `lo marcado se guarda como lista de herramientas del agente (${guardadoAg.herramientas.length}: incluye convertir_unidades)`);
  q('.ia-pestanas .tab-btn[data-vista="agentes"]').click();
  ok(!q("#vista-agentes").hidden && qa("#lista-agentes .ia-chip").map(texto).includes("Mi agente"), "el agente nuevo aparece como píldora en «Agentes»");
  qa("#lista-agentes .ia-chip").find((b) => b.textContent === "Mi agente").click();
  await espera(100);
  ok(qa("#lista-agentes .ia-chip").find((b) => b.textContent === "Mi agente").getAttribute("aria-pressed") === "true" && qa(".ia-msg").length === 0 && q("#card-reporte").hidden && /^Ej\.:/.test(q("#f-pregunta").placeholder), "elegirlo lo activa y, como había una conversación, empieza una nueva (sin chat ni reporte)");
  q('.ia-pestanas .tab-btn[data-vista="gestionar"]').click();
  await espera(100);
  ok(/en uso/.test(texto([...pc.querySelectorAll("#config-lista .ia-historial-item")].find((f) => /Mi agente/.test(f.textContent)))), "en «Gestionar» la etiqueta «en uso» marca al agente activo");
  pc.querySelector('[data-a="nuevo"]').click();
  await espera(80);
  ok(/Nuevo agente/.test(texto(pc.querySelector(".ia-editor-cabecera"))) && !pc.querySelector(".editando"), "«Nuevo agente» abre el editor con su barra y sin fila marcada");
  pc.querySelector("#g-cerrar").click();

  // --- historial (ahora en la tarjeta «Conversación»)
  q('#conv .ia-pestanas .tab-btn[data-conv="historial"]').click();
  await espera(100);
  ok(!q("#panel-historial").hidden && q("#vista-actual").hidden && q("#conv").contains(q("#panel-historial")) && !q("#tarjeta-agente").contains(q("#panel-historial")), "«Historial» se muestra dentro de la tarjeta «Conversación» (ya no en «Agente»)");
  { const prueba = document.createElement("div"); prueba.className = "ia-historial"; q("#panel-historial").append(prueba);
    ok(getComputedStyle(prueba).marginTop === "1.6px", "el historial queda a 25.6 px de las pestañas (20 % menos que los 32 px de antes: margen 1.6 px + los 24 px bajo las pestañas)"); prueba.innerHTML = '<div class="ia-historial-item"><span class="titulo">x</span></div>';
    const cT = getComputedStyle(prueba.querySelector(".titulo"));
    const botonEj = document.createElement("button"); botonEj.className = "ia-chip"; botonEj.setAttribute("aria-pressed", "false"); q("#panel-historial").append(botonEj);
    const cE = getComputedStyle(botonEj);
    ok(cT.fontSize === cE.fontSize && cT.color === cE.color && cT.fontWeight === cE.fontWeight, `la primera columna del historial tiene la letra de los ejemplos de pregunta (${cT.fontSize}, ${cT.color})`);
    botonEj.remove(); prueba.remove(); }
  ok(!q("#btn-enviar").checkVisibility() && q("#btn-nueva").checkVisibility() && !!q("#acciones.solo-nueva"), "viendo el historial solo queda «Nueva conversación» abajo");
  q("#btn-nueva").click();
  await espera(60);
  ok(!q("#vista-actual").hidden && q("#panel-historial").hidden && q("#btn-enviar").checkVisibility(), "«Nueva conversación» desde el historial vuelve a «Actual» con la fila completa");
  q('#tarjeta-agente .ia-pestanas .tab-btn[data-vista="agentes"]').click();
  ok(!q("#vista-agentes").hidden && q("#panel-config").hidden, "«Agentes» sigue mostrando los agentes disponibles");

  window.confirm = confirmReal;
  window.fetch = fetchPrevio;
  agAn.guardarPropios([]);
  agAn.guardarActivo(agAn.ID_PREDETERMINADO);
  try { cfg.borrarClave(); } catch { /* nada */ }
});

await seccion("tarjetas plegables en las pantallas de IA", async () => {
  // Decidido con el usuario (2026-09-21): se pliegan «Agente» (Corrector y Análisis) y «Reporte de escenarios» (Análisis); «Conversación» queda fija.
  const fetchPrevio = window.fetch;
  window.fetch = async (url, opciones) => {
    if (String(url).includes(":generateContent")) {
      const ult = JSON.parse(opciones.body).contents.at(-1);
      const yaHayResultado = (ult.parts || []).some((p) => p.functionResponse);
      const parts = yaHayResultado || !/pérdidas/.test(ult.parts?.[0]?.text || "")
        ? [{ text: "TEXTO DE LA IA" }]
        : [{ functionCall: { name: "calcular_perdidas", args: { tension_kv: 34.5, potencia_mw: 9.9, factor_potencia: 0.95, factor_carga: 0.56, longitud_km: 5.2, red: "Aerea", material: "ACSR", calibre: "4/0" } } }];
      return new Response(JSON.stringify({ candidates: [{ content: { role: "model", parts }, finishReason: "STOP" }] }), { status: 200, headers: { "Content-Type": "application/json" } });
    }
    return fetchPrevio(url, opciones);
  };
  cfg.guardarClave("AIzaSyPRUEBA1234567890", false);
  clave.guardarFuente("local");
  const agAn = await import("../js/ai/agentes-analisis.js");
  agAn.guardarPropios([]);
  agAn.guardarActivo(agAn.ID_PREDETERMINADO);
  try { localStorage.removeItem("ia.agentesRedaccion"); localStorage.removeItem("ia.agenteRedaccionActivo"); } catch { /* nada */ }
  const { plegado } = await import("../js/util/tarjetas-plegables.js");
  plegado.animar = false; // aqui se prueba el estado final al instante; la animacion se prueba en verify_tarjetas_plegables.html
  const conBoton = (t) => t?.querySelector(":scope > .form-section-title > .btn-plegar");
  const visible = (e) => !!e && e.checkVisibility();

  // --- Corrector de redacción: solo «Agente»
  {
    const vista = await import("../js/views/ia-redaccion.js");
    const marco = document.createElement("div");
    stage.innerHTML = "";
    stage.append(marco);
    const q = (s) => marco.querySelector(s);
    await vista.render(marco, {});
    await espera(150);
    const ag = q("#tarjeta-agente"), cv = q("#conv");
    const btn = conBoton(ag);
    ok(!!btn && btn.getAttribute("aria-expanded") === "true" && !ag.classList.contains("plegada") && visible(q("#vista-agentes")), "Corrector: la tarjeta «Agente» tiene botón de plegar y nace abierta");
    ok(!conBoton(cv) && !cv.querySelector(".btn-plegar"), "Corrector: «Conversación» NO se puede plegar");
    btn.click();
    ok(ag.classList.contains("plegada") && btn.getAttribute("aria-expanded") === "false" && !visible(q("#vista-agentes")) && !visible(q("#tarjeta-agente .ia-pestanas")) && visible(ag.querySelector(".form-section-title")), "Corrector: al plegar «Agente» solo queda su barra");
    ok(visible(q("#f-texto") || q("#vista-actual textarea")) && visible(q("#btn-enviar")), "Corrector: la caja de texto y «Enviar» siguen a la vista");
    q("#vista-actual textarea").value = "Hola equipo, envio el informe.";
    q("#btn-enviar").click();
    await espera(500);
    ok([...marco.querySelectorAll(".ia-msg--model")].some((m) => /TEXTO DE LA IA/.test(m.textContent)) && ag.classList.contains("plegada"), "Corrector: con «Agente» plegado se puede enviar y responde; sigue plegado");
    btn.click();
    ok(!ag.classList.contains("plegada") && visible(q("#vista-agentes")), "Corrector: al desplegar vuelve el contenido");
  }

  // --- Análisis: «Agente» y «Reporte de escenarios»
  {
    const vista = await import("../js/views/ia-analisis.js");
    const marco = document.createElement("div");
    stage.innerHTML = "";
    stage.append(marco);
    const q = (s) => marco.querySelector(s);
    await vista.render(marco, {});
    await espera(150);
    const ag = q("#tarjeta-agente"), cv = q("#conv"), rc = q("#card-reporte");
    ok(!!conBoton(ag) && !!conBoton(rc) && !conBoton(cv), "Análisis: «Agente» y «Reporte de escenarios» tienen botón de plegar; «Conversación» no");
    ok(!ag.classList.contains("plegada") && !rc.classList.contains("plegada"), "Análisis: ambas nacen abiertas");
    conBoton(ag).click();
    ok(ag.classList.contains("plegada") && !visible(q("#vista-agentes")) && !visible(q("#lista-agentes")) && visible(q("#f-pregunta")), "Análisis: al plegar «Agente» solo queda su barra y la conversación sigue a la vista");
    conBoton(rc).click(); // se pliega con la tarjeta aun oculta (sin cálculos): el estado se conserva
    ok(rc.hidden && rc.classList.contains("plegada"), "Análisis: el reporte puede quedar plegado de antemano (la tarjeta sigue oculta hasta que haya cálculos)");
    q("#f-pregunta").value = "Analiza las pérdidas de la línea de 34.5 kV con ACSR 4/0.";
    q("#btn-enviar").click();
    await espera(800);
    ok(!rc.hidden && rc.classList.contains("plegada") && !visible(q("#reporte-cuerpo")) && !visible(q("#btn-reporte")) && visible(rc.querySelector(".form-section-title")), "Análisis: tras un cálculo el reporte aparece PLEGADO (solo la barra) y «Generar reporte con IA» queda oculto");
    ok(ag.classList.contains("plegada") && [...marco.querySelectorAll(".ia-msg--model")].some((m) => /TEXTO DE LA IA/.test(m.textContent)), "Análisis: con «Agente» plegado se pudo consultar y responder");
    conBoton(rc).click();
    ok(!rc.classList.contains("plegada") && visible(q("#reporte-cuerpo")) && visible(q("#btn-reporte")) && !!q("#card-reporte .ia-escenarios table"), "Análisis: al desplegar el reporte se ven sus botones y las tablas");
    // Si se pliega el reporte MIENTRAS la IA lo genera, al terminar se despliega solo (el aviso del chat remite a él)
    q("#btn-reporte").click();
    conBoton(rc).click();
    ok(rc.classList.contains("plegada"), "Análisis: (preparación) el reporte se pliega mientras la IA lo genera");
    await espera(800);
    ok(!rc.classList.contains("plegada") && visible(q("#reporte-cuerpo")), "Análisis: al terminar de generar el reporte, la tarjeta se despliega sola");
  }
  window.fetch = fetchPrevio;
  agAn.guardarPropios([]);
  agAn.guardarActivo(agAn.ID_PREDETERMINADO);
  try { cfg.borrarClave(); } catch { /* nada */ }
});

await seccion("archivos", async () => {
  const sw = await (await fetch("../sw.js")).text();
  ok(sw.includes("js/views/ia-configuracion.js"), "el service worker precachea la pantalla");
});

window.fetch = fetchReal;
out.textContent += `\nRESULT: ${fallos ? "FAIL" : "OK"} (${total - fallos}/${total})\n`;
</script>
