<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Herramientas de Ingeniería</title>
<meta name="description" content="Calculadoras y catálogos de ingeniería para líneas y redes de distribución eléctrica: ampacidad, cortocircuito, pérdidas, regulación, conductores y normatividad." />
<meta name="theme-color" content="#0a5f5e" id="theme-color-meta" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Herramientas" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem("theme");
      var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      // colores personales del tema (Perfil > Apariencia): ya calculados, se aplican antes del primer pintado
      var css = localStorage.getItem("tema.css");
      if (css) {
        var st = document.createElement("style");
        st.id = "tema-personal";
        st.textContent = css;
        document.head.appendChild(st);
      }
      // menu lateral contraido (solo aplica en pantallas anchas): se aplica antes del primer pintado para evitar parpadeo
      if (localStorage.getItem("sidebarCollapsed") === "1") document.documentElement.classList.add("sb-collapsed");
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<div class="app-shell" id="app-shell">
  <header class="topbar">
    <button class="icon-btn nav-toggle-btn" id="nav-toggle" aria-label="Abrir menú" aria-expanded="false"></button>
    <a class="brand" href="#/">
      <span class="logo-mark" id="brand-mark"></span>
      <span>Herramientas de Ingeniería</span>
    </a>
    <div class="topbar-actions">
      <button class="icon-btn" id="theme-toggle" aria-label="Cambiar tema claro/oscuro"></button>
    </div>
  </header>
  <div class="app-body">
    <nav class="sidebar" id="sidebar" aria-label="Navegación principal">
      <ul class="nav-list" id="nav-list"></ul>
      <ul class="nav-list nav-list-perfil" id="nav-perfil"></ul>
      <div class="sidebar-head">
        <button type="button" class="icon-btn sidebar-collapse-btn" id="sidebar-collapse" aria-controls="nav-list"></button>
      </div>
    </nav>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <main class="content" id="app" tabindex="-1"></main>
  </div>
</div>
<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lightbox-close" aria-label="Cerrar">✕</button>
  <img id="lightbox-img" alt="" />
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
